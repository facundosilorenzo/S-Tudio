<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8ECE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<title>Cleared</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..800&family=Martian+Mono:wght@400..600&display=swap">
<style>
/* Layout: una sola columna centrada (máx 1040px); inicio = tablero de "salidas" con los exámenes; cada asignatura usa su color como acento.
   Mundo visual: "pase de embarque". Papel verde salvia de día, pista nocturna en oscuro, tablero split-flap con letras ámbar. */
:root{
  --bg:#E8ECE5; --surface:#FBFCF8; --surface-2:#F1F4EE; --ink:#151B17; --muted:#56615A; --line:#D4DCD3;
  --ok:#17784D; --ok-bg:#E1F1E6; --bad:#BE321E; --bad-bg:#FBE5DE; --warn:#965600; --warn-bg:#FBEDD3;
  --board:#122019; --board-ink:#F6ECD9; --board-dim:#94A99E; --flap:#1C2D26; --flap-ink:#FFC247;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:14px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-flip:cubic-bezier(.65,0,.35,1);
  --sh-1:0 1px 2px rgb(16 36 26 / .06), 0 6px 16px -8px rgb(16 36 26 / .18);
  --sh-2:0 2px 4px rgb(16 36 26 / .06), 0 22px 44px -18px rgb(16 36 26 / .34);
  color-scheme:light;
  interpolate-size:allow-keywords;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#141C19; --surface-2:#19231F; --ink:#F2EBDF; --muted:#A99F91; --line:#27322D;
  --ok:#62D59F; --ok-bg:#122C1F; --bad:#FF8C78; --bad-bg:#371812; --warn:#F4BC52; --warn-bg:#33260D;
  --board:#070B09; --board-ink:#F6ECD9; --board-dim:#82978C; --flap:#131E19;
  --sh-1:0 1px 2px rgb(0 0 0 / .3), 0 8px 18px -10px rgb(0 0 0 / .6);
  --sh-2:0 2px 4px rgb(0 0 0 / .3), 0 24px 48px -18px rgb(0 0 0 / .75);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#19231F; --ink:#F2EBDF; --muted:#A99F91; --line:#27322D;
  --ok:#62D59F; --ok-bg:#122C1F; --bad:#FF8C78; --bad-bg:#371812; --warn:#F4BC52; --warn-bg:#33260D;
  --board:#070B09; --board-ink:#F6ECD9; --board-dim:#82978C; --flap:#131E19;
  --sh-1:0 1px 2px rgb(0 0 0 / .3), 0 8px 18px -10px rgb(0 0 0 / .6);
  --sh-2:0 2px 4px rgb(0 0 0 / .3), 0 24px 48px -18px rgb(0 0 0 / .75);
  color-scheme:dark;
}
/* Colores por asignatura: --al (día) y --ad (noche / tablero) */
.s-financiacion{--al:#2E4BD6;--ad:#93A6FF}
.s-logistica{--al:#BB4A06;--ad:#FF9D5C}
.s-ingles{--al:#AD2768;--ad:#F58FC1}
.s-sistemas{--al:#0C7A69;--ad:#5CD8C2}
.s-gestion{--al:#6A41C6;--ad:#BBA4FF}
.s-negociacion{--al:#577309;--ad:#BEDA5E}
.s-comercio{--al:#946200;--ad:#F4C24F}
:root,.wrap,.wrap [class*="s-"]{--acc:var(--al,#2E4BD6);--acc-soft:color-mix(in oklab, var(--acc) 11%, var(--surface));--acc-line:color-mix(in oklab, var(--acc) 38%, var(--line))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]),:root:not([data-theme="light"]) .wrap,:root:not([data-theme="light"]) .wrap [class*="s-"]{--acc:var(--ad,#93A6FF)}}
:root[data-theme="dark"],:root[data-theme="dark"] .wrap,:root[data-theme="dark"] .wrap [class*="s-"]{--acc:var(--ad,#93A6FF)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.crumbs button{background:none;border:0;padding:2px 4px;color:var(--acc);text-decoration:underline;text-underline-offset:3px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.95rem}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .n{font-family:var(--f-mono);font-size:.8rem;background:var(--acc-soft);color:var(--acc);padding:1px 8px;border-radius:999px}
.btn.primary .n{background:rgba(255,255,255,.22);color:inherit}

/* Hero inicio */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:22px}
.hero p{max-width:60ch;color:var(--muted);margin-top:8px}
.countdown{text-align:right}
.countdown .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,7vw,3.6rem);line-height:1;color:var(--acc)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.countdown{text-align:left}}

/* Tablero de salidas (exámenes) */
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:18px 18px 8px;overflow-x:auto}
.board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.board-head h2{color:var(--board-ink);font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.board-head span{font-family:var(--f-mono);font-size:.8rem;color:var(--board-dim)}
.board table{width:100%;border-collapse:collapse;min-width:620px;color:var(--board-ink);font:inherit}
.board th{font-family:var(--f-mono);font-weight:400;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--board-dim);text-align:left;padding:6px 8px}
.board td{padding:10px 8px;border-top:1px solid rgba(255,255,255,.07);vertical-align:middle}
.board tr.go{cursor:pointer}
.board tr.go:hover td{background:rgba(255,255,255,.04)}
.flap{display:inline-flex;gap:2px}
.flap i{font-style:normal;font-family:var(--f-mono);font-weight:600;background:var(--flap);border-radius:3px;padding:2px 5px;font-size:.95rem;box-shadow:inset 0 -1px 0 rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);position:relative}
.flap i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.board .sub{font-weight:700}
.board .chip{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.chip.listo{background:#1E7A4F;color:#fff}
.chip.prep{background:#3A4254;color:#C9D1E0}
.chip.hoy{background:#E0A422;color:#1B1405}
.chip.hecho{background:#2B3242;color:#8F9AAE}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc);margin-right:8px;vertical-align:middle}
.mini{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;width:90px}
.mini b{display:block;height:100%;background:var(--acc)}

.note{margin-top:14px;font-size:.88rem;color:var(--muted)}

/* Tarjetas de asignatura / tema */
.subj-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--acc);margin-bottom:20px}
@media (max-width:640px){.subj-head{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard:hover{border-color:var(--acc)}
.tcard .num{font-family:var(--f-mono);font-size:.78rem;color:var(--acc);font-weight:600}
.tcard h3{font-size:1.05rem}
.tcard p{font-size:.92rem;color:var(--muted)}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:auto}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--acc)}

/* Tema: pestañas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.temanav{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}

/* Bloques de esquema */
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.blk > h3{margin-bottom:12px}
.mapa .raiz{display:inline-block;background:var(--acc);color:var(--surface);font-family:var(--f-display);font-weight:700;padding:8px 16px;border-radius:8px;margin-bottom:14px}
.ramas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;position:relative}
.rama{border-top:3px solid var(--acc);background:var(--surface-2);border-radius:0 0 8px 8px;padding:12px;min-width:0}
.rama b{display:block;font-family:var(--f-display);margin-bottom:4px}
.rama p{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.rama ul{margin:0;padding-left:18px;font-size:.92rem}
.rama li{margin:3px 0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.93rem}
.tbl th{background:var(--acc-soft);color:var(--ink);text-align:left;padding:8px 10px;font-family:var(--f-display);font-weight:700}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.flujo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.flujo li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.flujo li:not(:last-child)::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.flujo .k{width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;color:var(--acc);background:var(--surface)}
.flujo .t{padding-top:5px}
.claves{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px;margin:0}
.claves dt{font-weight:700}
.claves dd{margin:0;color:var(--ink)}
@media (max-width:560px){.claves{grid-template-columns:1fr}.claves dd{margin-bottom:8px}}
.formula{font-family:var(--f-mono);background:var(--surface-2);border:1px dashed var(--acc);border-radius:8px;padding:14px;overflow-x:auto;font-size:.95rem;white-space:nowrap}
.formula + p{margin-top:10px;font-size:.92rem;color:var(--muted)}
.ojo{background:var(--warn-bg);border:1px solid transparent;border-left:4px solid var(--warn)}
.ojo h3{color:var(--warn)}
.ojo ul{margin:0;padding-left:20px}
.ojo li{margin:4px 0}
.caso .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-top:10px;display:block}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.vs{grid-template-columns:1fr}}
.vs > div{background:var(--surface-2);border-radius:8px;padding:12px}
.vs b{font-family:var(--f-display);display:block;margin-bottom:6px;color:var(--acc)}
.vs ul{margin:0;padding-left:18px;font-size:.93rem}
.lista{margin:0;padding-left:20px}
.lista li{margin:4px 0}

/* Flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.fc{width:100%;max-width:620px;min-height:240px;perspective:1200px;background:none;border:0;padding:0}
.fc-inner{position:relative;width:100%;min-height:240px;transition:transform .45s ease;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--line);text-align:left}
.fc-face.back{transform:rotateY(180deg);background:var(--acc-soft);border-color:var(--acc)}
.fc-face .q{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.fc-face .a{font-size:1.02rem}
@media (prefers-reduced-motion:reduce){.fc-inner{transition:none}}

/* Test */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:760px}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.qprog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.qprog b{display:block;height:100%;background:var(--acc);transition:width .3s}
.qtext{font-family:var(--f-display);font-size:1.22rem;font-weight:700;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.expl{margin-top:16px;padding:14px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--muted)}
.expl.ok{border-left-color:var(--ok)}
.expl.bad{border-left-color:var(--bad)}
.expl b{display:block;margin-bottom:4px}
.score{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--acc)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:20px;max-width:760px}
.review .item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px}
.review .item.okk{border-left-color:var(--ok)}
.review .item p{margin-top:4px;font-size:.93rem}
.timer{font-family:var(--f-mono);font-weight:600;padding:4px 10px;border-radius:6px;background:var(--acc-soft);color:var(--acc)}
.timer.low{background:var(--bad-bg);color:var(--bad)}

/* Ejercicios */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex .enun{font-size:1rem}
.ex .ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex input{font-family:var(--f-mono);font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);width:200px;max-width:100%}
.ex .res{font-weight:700}
.ex .res.ok{color:var(--ok)} .ex .res.bad{color:var(--bad)}
.ex .sol{background:var(--surface-2);border-radius:8px;padding:12px;font-size:.94rem}
.ex .sol ol{margin:6px 0 0;padding-left:20px}
.ex .sol li{margin:3px 0}
.ex .foto{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ex .foto .thumb{max-width:180px;max-height:180px;border-radius:8px;border:1px solid var(--line);object-fit:cover}
.ex .foto .hint{font-size:.85rem;color:var(--muted)}
.corr{border-radius:10px;padding:14px;background:var(--surface-2);border-left:4px solid var(--muted);display:flex;flex-direction:column;gap:8px}
.corr.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.corr.parcial{border-left-color:var(--warn);background:var(--warn-bg)}
.corr.bad{border-left-color:var(--bad);background:var(--bad-bg)}
.corr .v{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.corr ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.corr li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:.94rem}
.corr li .m{font-weight:700}
.corr li.si .m{color:var(--ok)} .corr li.no .m{color:var(--bad)}
.corr .lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.foot{margin-top:40px;font-size:.82rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.foot button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline}

/* Examen: puntos que entran, preguntas cortas, simulacro tipo examen, writing */
.lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.tag{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--acc);color:var(--surface);white-space:nowrap;font-weight:600}
.tag.soft{background:var(--acc-soft);color:var(--acc)}
.exban{background:var(--acc-soft);border:1px solid var(--acc);border-radius:var(--r);padding:14px 16px;margin:0 0 20px}
.exban summary{cursor:pointer;list-style-position:outside;color:var(--acc)}
.exban summary b{font-family:var(--f-display);font-size:1.05rem}
.exban > b{font-family:var(--f-display);display:block;margin-bottom:8px;color:var(--acc);font-size:1.05rem}
.exban ul{margin:0;padding-left:20px;font-size:.94rem}
.exban li{margin:2px 0}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 18px}
.exgrid div{font-size:.92rem;min-width:0}
.exgrid b{display:block;font-family:var(--f-display)}
textarea.resp{width:100%;min-height:110px;font:inherit;line-height:1.5;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);resize:vertical}
textarea.resp:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-color:var(--acc)}
textarea.resp.big{min-height:220px}
.model{background:var(--surface-2);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.model .lista{font-size:.93rem}
.selfm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.selfm .btn{padding:6px 12px;font-size:.88rem}
.selfm .btn.on{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.mine{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.95rem;white-space:pre-wrap}
.exam-sec{margin-top:30px}
.exam-sec > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--acc);padding-bottom:8px;margin-bottom:14px}
.exam-sec > header p{flex-basis:100%;font-size:.9rem;color:var(--muted)}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.eq .qtext{font-size:1.04rem;margin-bottom:10px}
.eq .opt{padding:8px 12px}
.eq.done{border-color:var(--acc)}
.bar-exam{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.notas > div{background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
.notas b{font-family:var(--f-display);font-size:1.5rem;display:block;line-height:1.2}
.notas small{color:var(--muted);font-size:.82rem}
.pend{color:var(--warn);font-weight:700;margin-top:10px}
.wc{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.wc.ok{color:var(--ok)}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.errs li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.94rem}
.errs .o{text-decoration:line-through;color:var(--bad)}
.errs .c{color:var(--ok);font-weight:700}
.wprompts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}

/* ================= Rediseño: pase de embarque + tablero split-flap ================= */
html{scrollbar-color:color-mix(in oklab, var(--muted) 45%, transparent) transparent;-webkit-tap-highlight-color:transparent}
body{font-size:16.5px;line-height:1.6;font-feature-settings:"ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:color-mix(in oklab, var(--acc) 26%, transparent);color:var(--ink)}
input,textarea{caret-color:var(--acc);accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:17px;height:17px}
.wrap{position:relative;isolation:isolate}
.wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 420px at 92% -8%, color-mix(in oklab, var(--acc) 12%, transparent), transparent 70%),
    radial-gradient(700px 380px at -10% 108%, color-mix(in oklab, var(--acc) 7%, transparent), transparent 70%);
  transition:opacity .4s ease}
h1,h2,h3{font-family:var(--f-display);font-optical-sizing:auto;font-variation-settings:"SOFT" 60, "WONK" 0;letter-spacing:-.015em}
h1{font-size:clamp(2rem,5vw,3.25rem);font-weight:640;line-height:1.04;letter-spacing:-.03em}
h2{font-weight:600}
h3{font-weight:620}
.eyebrow,.lab,.tag,.chip,.board th{font-family:var(--f-mono);font-weight:500}
.eyebrow{font-size:.68rem;letter-spacing:.12em;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums slashed-zero}
a,button{-webkit-user-select:none;user-select:none}
button:focus-visible,a:focus-visible,input:focus-visible,tr.go:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:8px}

/* Barra superior */
.top{margin-bottom:34px;padding:6px 0}
.brand{gap:12px;align-items:center;border-radius:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none;box-shadow:var(--sh-1);transition:transform .5s var(--ease-out)}
.brand .logo svg{width:19px;height:19px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"WONK" 1}
.brand span{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase}
@media (hover:hover) and (pointer:fine){.brand:hover .logo{transform:translate(2px,-2px) rotate(-6deg)}}
.crumbs{font-size:.88rem;gap:4px}
.crumbs > span:not(:last-child){opacity:.5}
.crumbs > span:last-child{color:var(--ink);font-weight:600}
.crumbs button{color:var(--muted);text-decoration:none;border-radius:6px;padding:3px 6px;transition:color .2s ease, background-color .2s ease}
@media (hover:hover) and (pointer:fine){.crumbs button:hover{color:var(--acc);background:var(--acc-soft)}}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:11px 18px;font-weight:600;font-size:.94rem;letter-spacing:-.005em;box-shadow:var(--sh-1);
  transition:transform .16s var(--ease-out), background-color .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease}
.btn:active:not([disabled]){transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover:not([disabled]){border-color:var(--acc-line);box-shadow:var(--sh-2)}}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--acc);border-color:transparent;color:var(--surface);box-shadow:0 1px 0 rgb(255 255 255 / .18) inset, 0 8px 22px -10px color-mix(in oklab, var(--acc) 85%, black)}
.btn.primary:hover{filter:none}
@media (hover:hover) and (pointer:fine){.btn.primary:hover:not([disabled]){background:color-mix(in oklab, var(--acc) 88%, var(--ink));border-color:transparent}}
.btn.ghost{background:transparent;box-shadow:none}
.btn[disabled]{opacity:.42;box-shadow:none}
.btn .n{font-size:.7rem;font-weight:500;padding:2px 9px}
.btn.primary .n{background:rgb(255 255 255 / .2);color:inherit}

/* Hero */
.hero{gap:28px;margin-bottom:30px;align-items:end}
.hero h1{max-width:15ch;margin-top:10px}
.hero p{font-size:1.05rem;max-width:52ch;margin-top:14px}
.countdown .eyebrow{display:block;margin-bottom:10px}
.countdown .big{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;font-size:1rem;color:var(--ink)}
.countdown .big .u{font-family:var(--f-display);font-weight:600;font-size:1.4rem;color:var(--acc);padding-bottom:6px}
.countdown .muted{margin-top:8px;font-size:.78rem}
@media (max-width:640px){.countdown .big{justify-content:flex-start}}
.flap.xl{gap:5px}
.flap.xl i{font-size:clamp(2.4rem,7vw,3.5rem);padding:.08em .16em;border-radius:8px;line-height:1.1;min-width:.9em;text-align:center;
  background:linear-gradient(180deg, color-mix(in oklab,var(--board) 88%, white) 0 50%, var(--board) 50% 100%);color:var(--flap-ink);
  box-shadow:0 1px 0 rgb(255 255 255 / .06) inset, var(--sh-2)}
.flap.xl i::after{background:rgb(0 0 0 / .65);height:2px;margin-top:-1px}

/* Tablero de salidas, como un pase de embarque con troquel */
.board{--notch:58px;border-radius:20px;padding:20px 22px 12px;box-shadow:var(--sh-2);position:relative;
  -webkit-mask:radial-gradient(circle 11px at 0 var(--notch), #0000 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 11px at 100% var(--notch), #0000 98%, #000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 var(--notch), #0000 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 11px at 100% var(--notch), #0000 98%, #000) right/51% 100% no-repeat;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in oklab, var(--flap-ink) 7%, transparent), transparent 60%),
    var(--board)}
.board-head{height:26px;margin-bottom:22px;flex-wrap:nowrap;align-items:center}
.board-head::after{content:"";position:absolute;left:22px;right:22px;top:var(--notch);border-top:2px dashed rgb(255 255 255 / .1)}
.board-head h2{font-family:var(--f-mono);font-weight:600;font-size:.82rem;letter-spacing:.16em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.board-head h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--flap-ink);box-shadow:0 0 0 4px color-mix(in oklab, var(--flap-ink) 22%, transparent);animation:beacon 2.4s ease-in-out infinite}
.board-head span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
@keyframes beacon{50%{box-shadow:0 0 0 7px color-mix(in oklab, var(--flap-ink) 0%, transparent)}}
.board th{font-size:.6rem;letter-spacing:.16em;padding:8px 10px}
.board td{padding:13px 10px;border-top:1px solid rgb(255 255 255 / .06);transition:background-color .2s ease}
.board tr.go{--acc:var(--ad)}
.board tr.go td:first-child{border-radius:10px 0 0 10px}
.board tr.go td:last-child{border-radius:0 10px 10px 0}
@media (hover:hover) and (pointer:fine){
  .board tr.go:hover td{background:rgb(255 255 255 / .05)}
  .board tr.go:hover .dot{transform:scale(1.5)}
  .board tr.go:hover .sub{color:#fff}
}
.board tr.go:active td{background:rgb(255 255 255 / .08)}
.board .sub{font-weight:600;transition:color .2s ease}
.dot{width:9px;height:9px;transition:transform .3s var(--ease-out);box-shadow:0 0 12px color-mix(in oklab, var(--acc) 70%, transparent)}
.flap{perspective:400px}
.flap i{background:linear-gradient(180deg, color-mix(in oklab,var(--flap) 80%, white 6%) 0 50%, var(--flap) 50% 100%);color:var(--flap-ink);
  font-size:.92rem;padding:3px 6px;border-radius:4px;transform-origin:50% 50%;backface-visibility:hidden}
.flap i.spin{animation:flapTick 55ms linear}
.flap i.land{animation:flapLand .32s var(--ease-out)}
@keyframes flapTick{from{transform:rotateX(70deg);filter:brightness(.7)}to{transform:rotateX(0)}}
@keyframes flapLand{0%{transform:rotateX(80deg);filter:brightness(.6)}100%{transform:rotateX(0);filter:none}}
.board .chip{font-size:.6rem;letter-spacing:.12em;padding:4px 9px;border-radius:999px;font-weight:600}
.chip.listo{background:rgb(98 213 159 / .14);color:#86E6B7;box-shadow:inset 0 0 0 1px rgb(98 213 159 / .28)}
.chip.prep{background:rgb(255 255 255 / .06);color:#C9D1C9}
.chip.hoy{background:var(--flap-ink);color:#1B1405;animation:hoy 1.8s ease-in-out infinite}
.chip.hecho{background:transparent;color:var(--board-dim);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .12)}
@keyframes hoy{50%{box-shadow:0 0 0 5px color-mix(in oklab, var(--flap-ink) 25%, transparent)}}
.mini{height:5px;width:96px;background:rgb(255 255 255 / .1)}
.mini b,.bar b{transform-origin:left center;transition:transform .9s var(--ease-out) .25s;border-radius:inherit}
@starting-style{.mini b,.bar b{transform:scaleX(0)}}
.note{font-size:.85rem;margin-top:18px;padding-left:2px}

/* Asignatura */
.subj-head{border-bottom:0;padding-bottom:26px;margin-bottom:24px;position:relative}
.subj-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg, var(--acc), color-mix(in oklab, var(--acc) 0%, transparent))}
.subj-head h1{margin-top:8px;max-width:18ch}
.subj-head .countdown .big{font-family:var(--f-display);font-weight:650;color:var(--acc);letter-spacing:-.03em}
.actions{gap:10px;margin-bottom:26px}
.grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tcard{border-radius:18px;padding:20px;gap:12px;box-shadow:var(--sh-1);position:relative;overflow:hidden;
  transition:transform .25s var(--ease-out), box-shadow .25s ease, border-color .2s ease}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--acc);transform:scaleX(.18);transform-origin:left;transition:transform .45s var(--ease-out)}
.tcard:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){
  .tcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--acc-line)}
  .tcard:hover::before{transform:scaleX(1)}
}
.tcard .num{font-size:.66rem;letter-spacing:.14em}
.tcard h3{font-size:1.18rem;line-height:1.2}
.tcard p{font-size:.92rem;line-height:1.5}
.meters{font-size:.76rem;gap:6px 10px;padding-top:8px;border-top:1px dashed var(--line)}
.bar{height:5px;background:color-mix(in oklab, var(--line) 80%, transparent)}
.tag{font-size:.6rem;letter-spacing:.1em;padding:3px 9px;font-weight:600}

/* "Lo que entra" */
.exban{border-radius:18px;border-color:var(--acc-line);padding:16px 20px;box-shadow:var(--sh-1)}
.exban summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.exban summary::-webkit-details-marker{display:none}
.exban summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .3s var(--ease-out);flex:none}
.exban[open] summary::after{transform:rotate(-135deg) translateY(-1px)}
.exban::details-content{block-size:0;overflow:clip;transition:block-size .38s var(--ease-out), content-visibility .38s allow-discrete}
.exban[open]::details-content{block-size:auto}

/* Tema: pestañas con indicador que se desliza (View Transitions) */
.tabs{gap:2px;border-bottom:1px solid var(--line);margin:22px 0 26px;scrollbar-width:none}
.tab{border-bottom:0;position:relative;padding:12px 16px;font-weight:600;border-radius:10px 10px 0 0;transition:color .2s ease, background-color .2s ease}
@media (hover:hover) and (pointer:fine){.tab:hover{color:var(--ink);background:var(--acc-soft)}}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--acc);view-transition-name:tab-ind}
.tab .mono{font-size:.72rem}
::view-transition-group(tab-ind){animation-duration:.32s;animation-timing-function:var(--ease-out)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
.vt-ruta::view-transition-old(root){animation:vtOut .14s ease both}
.vt-ruta::view-transition-new(root){animation:vtIn .34s var(--ease-out) both}
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0;transform:translateY(10px);filter:blur(3px)}}

/* Bloques del esquema */
.blk{border-radius:18px;padding:22px;box-shadow:var(--sh-1)}
.blk > h3{font-size:1.22rem;margin-bottom:14px}
.mapa .raiz{border-radius:12px;padding:9px 18px;font-weight:620;box-shadow:0 8px 20px -10px var(--acc);color:var(--surface)}
.rama{border-top:0;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);position:relative;padding:14px 14px 12px}
.rama::before{content:"";position:absolute;left:14px;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.rama b{margin-top:4px;font-weight:620}
.tbl{border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.tbl th{font-family:var(--f-body);font-weight:700;font-size:.82rem;letter-spacing:.02em}
.tbl tr:nth-child(even) td{background:color-mix(in oklab, var(--surface-2) 70%, transparent)}
.tbl td{font-variant-numeric:tabular-nums}
.flujo .k{background:var(--acc);color:var(--surface);border-color:var(--acc);font-size:.8rem;box-shadow:0 0 0 5px var(--acc-soft)}
.flujo li:not(:last-child)::before{background:linear-gradient(var(--acc-line), var(--line))}
.formula{border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:12px;font-size:.88rem}
.ojo{background:var(--warn-bg);border:1px solid color-mix(in oklab, var(--warn) 30%, transparent);border-left-width:1px}
.ojo h3{display:flex;align-items:center;gap:10px}
.ojo h3::before{content:"!";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--warn);color:var(--surface);font-family:var(--f-mono);font-size:.78rem;flex:none}
.vs > div{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}

/* Flashcards: mazo con profundidad */
.fc{position:relative}
.fc::before,.fc::after{content:"";position:absolute;inset:0;border-radius:18px;background:var(--surface);border:1px solid var(--line);z-index:-1;transition:transform .4s var(--ease-out)}
.fc::before{transform:translateY(8px) scale(.97);opacity:.7}
.fc::after{transform:translateY(16px) scale(.94);opacity:.4}
.fc-wrap{isolation:isolate;padding-bottom:10px}
.fc-inner{transition:transform .56s var(--ease-flip)}
.fc-face{border-radius:18px;padding:30px;box-shadow:var(--sh-2)}
.fc-face .q{font-size:1.5rem;font-weight:620;line-height:1.25}
.fc-face.back{background:var(--acc-soft);border-color:var(--acc-line)}
.fc:active .fc-inner{scale:.985}
@media (hover:hover) and (pointer:fine){.fc:hover::before{transform:translateY(11px) scale(.97)}.fc:hover::after{transform:translateY(22px) scale(.94)}}
.fc-wrap > .fc{animation:cardIn .42s var(--ease-out)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) rotate(-1deg) scale(.98)}}

/* Test */
.qcard{border-radius:20px;padding:26px;box-shadow:var(--sh-2);animation:qIn .26s var(--ease-out)}
@keyframes qIn{from{opacity:0;transform:translateY(6px)}}
.qprog{height:5px;border-radius:5px}
.qtext{font-size:1.32rem;font-weight:620;line-height:1.3;letter-spacing:-.01em}
.opt{border-radius:14px;padding:13px 16px;border-width:1px;background:var(--surface);box-shadow:inset 0 0 0 1px transparent;
  transition:transform .16s var(--ease-out), border-color .2s ease, background-color .2s ease, box-shadow .2s ease}
.opt .l{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-size:.75rem;transition:background-color .2s ease, color .2s ease}
.opt:active:not([disabled]){transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.opt:hover:not([disabled]){border-color:var(--acc-line);background:var(--acc-soft)}.opt:hover:not([disabled]) .l{color:var(--acc)}}
.opt.sel{box-shadow:inset 0 0 0 1px var(--acc)}
.opt.sel .l{background:var(--acc);color:var(--surface);box-shadow:none}
.opt.ok{box-shadow:inset 0 0 0 1px var(--ok);animation:okPop .38s var(--ease-out)}
.opt.ok .l{background:var(--ok);color:var(--surface);box-shadow:none}
.opt.bad{box-shadow:inset 0 0 0 1px var(--bad);animation:badShake .36s var(--ease-out)}
.opt.bad .l{background:var(--bad);color:var(--surface);box-shadow:none}
@keyframes okPop{40%{transform:scale(1.015)}}
@keyframes badShake{20%{transform:translateX(-4px)}45%{transform:translateX(3px)}70%{transform:translateX(-2px)}}
.expl{border-left-width:1px;border:1px solid var(--line);border-radius:14px;animation:qIn .3s var(--ease-out) .08s both}
.expl.ok{border-color:color-mix(in oklab, var(--ok) 40%, transparent);background:var(--ok-bg)}
.expl.bad{border-color:color-mix(in oklab, var(--bad) 40%, transparent);background:var(--bad-bg)}
.expl.ok b{color:var(--ok)} .expl.bad b{color:var(--bad)}
.score{font-family:var(--f-display);font-size:clamp(3.4rem,10vw,5rem);font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.review .item{border-left-width:1px;border-radius:14px;box-shadow:var(--sh-1);position:relative;padding:16px 16px 16px 20px}
.review .item::before{content:"";position:absolute;left:8px;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--bad)}
.review .item.okk::before{background:var(--ok)}
.timer{border-radius:999px;padding:4px 12px;font-size:.8rem}
.timer.low{animation:hoy 1s ease-in-out infinite;--flap-ink:var(--bad)}

/* Ejercicios, cortas, simulacro */
.ex,.eq{border-radius:18px;box-shadow:var(--sh-1)}
.ex input,textarea.resp{border-radius:12px;border-width:1px;transition:border-color .2s ease, box-shadow .2s ease}
.ex input:focus,textarea.resp:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.ex .sol,.mine,.notas > div{border-radius:12px}
.corr{border-left-width:1px;border:1px solid var(--line);border-radius:14px}
.corr.ok{border-color:color-mix(in oklab, var(--ok) 40%, transparent)}
.corr.parcial{border-color:color-mix(in oklab, var(--warn) 40%, transparent)}
.corr.bad{border-color:color-mix(in oklab, var(--bad) 40%, transparent)}
.model{border-left-width:1px;border:1px solid var(--acc-line);background:var(--acc-soft);border-radius:14px}
.selfm .btn.on{box-shadow:0 8px 20px -10px var(--acc)}
.exam-sec > header{border-bottom:1px solid var(--line);position:relative}
.exam-sec > header::after{content:"";position:absolute;left:0;bottom:-1px;width:64px;height:2px;background:var(--acc)}
.bar-exam{background:color-mix(in oklab, var(--bg) 82%, transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px)}
.eq.done{border-color:var(--acc-line);box-shadow:var(--sh-1), inset 0 0 0 1px var(--acc-line)}
.notas b{font-weight:650;letter-spacing:-.02em}
.empty{border-radius:18px;padding:40px 24px}
.foot{border-top:1px dashed var(--line);padding-top:18px}
.foot button{text-underline-offset:3px;transition:color .2s ease}
.foot button:hover{color:var(--bad)}

/* Ajustes de lectura de datos y móvil */
.board td.mono{font-size:.8rem}
.fc-wrap > .row .mono{font-size:.72rem;letter-spacing:.03em}
.board{box-shadow:var(--sh-2), inset 0 0 0 1px rgb(255 255 255 / .05)}
@media (max-width:600px){
  .brand span{display:none}
  .top{margin-bottom:24px}
  .board{padding:16px 12px 8px;overflow:visible;border-radius:18px}
  .board-head{padding:0 4px}
  .board-head::after{left:12px;right:12px}
  .board table,.board tbody{display:block;min-width:0}
  .board thead{display:none}
  .board tr.go{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"cod sub chip" "cod fecha falta";gap:4px 12px;align-items:center;padding:13px 8px;border-top:1px solid rgb(255 255 255 / .06);border-radius:12px;transition:background-color .2s ease}
  .board tbody tr.go:first-child{border-top:0}
  .board td{display:block;padding:0;border:0 !important;background:none !important}
  .board td:nth-child(1){grid-area:cod}
  .board td:nth-child(2){grid-area:sub;font-size:.95rem;line-height:1.3}
  .board td:nth-child(3){grid-area:fecha;color:var(--board-dim)}
  .board td:nth-child(4){grid-area:falta;text-align:right;color:var(--board-dim)}
  .board td:nth-child(4):empty{display:none}
  .board-head span{display:none}
  .board td:nth-child(5){grid-area:chip;justify-self:end}
  .board td.mono{font-size:.72rem}
  .board tr.go:active{background:rgb(255 255 255 / .06)}
  .flap i{font-size:.82rem;padding:2px 5px}
}

/* Entrada del inicio: un solo momento coreografiado */
.intro .hero > div:first-child > *{animation:rise .6s var(--ease-out) both}
.intro .hero h1{animation-delay:.05s}
.intro .hero p{animation-delay:.12s}
.intro .countdown{animation:rise .6s var(--ease-out) .18s both}
.intro .board{animation:boardIn .7s var(--ease-out) .22s both}
.intro .board tbody tr{animation:rise .5s var(--ease-out) both;animation-delay:calc(.34s + var(--r,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes boardIn{from{opacity:0;transform:translateY(18px) scale(.985)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-property:opacity,color,background-color,border-color !important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
}
</style>
</head>
<body>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
/* ---------- Configuración del curso ---------- */
const ASIGNATURAS = [
  {id:'financiacion', cod:'FIN', nombre:'Financiación Internacional', examen:'2026-11-10', listo:true},
  {id:'logistica',    cod:'LOG', nombre:'Logística de Almacenamiento', examen:'2026-11-12', listo:true},
  {id:'ingles',       cod:'ENG', nombre:'Inglés', examen:'2026-11-13', listo:true},
  {id:'sistemas',     cod:'SIM', nombre:'Sistemas de Información de Mercados', examen:'2026-11-16', listo:true},
  {id:'gestion',      cod:'GEF', nombre:'Gestión Económica y Financiera', examen:'2026-11-17', listo:true},
  {id:'negociacion',  cod:'NEG', nombre:'Negociación Internacional', examen:'2026-11-18', listo:true},
  {id:'comercio',     cod:'CDI', nombre:'Comercio Digital Internacional', examen:'2026-11-19', listo:true},
];
const DATA = {};
window.ESTUDIO = {
  registrar(d){ DATA[d.id] = d; },
  // Añade a cada tema los puntos de examen, las preguntas cortas y test marcados como «de examen»
  // Añade preguntas cortas y ejercicios de práctica extra a cada tema
  extra(id, ext){ const d=DATA[id]; if(!d) return; for(const n in ext){ const t=d.temas.find(x=>x.n==n); if(!t) continue; const e=ext[n];
    if(e.cortas) t.cortas=(t.cortas||[]).concat(e.cortas); if(e.ejercicios) t.ejercicios=(t.ejercicios||[]).concat(e.ejercicios); } },
  ampliar(id, ext){ const d=DATA[id]; if(!d) return; for(const n in ext){ const t=d.temas.find(x=>x.n==n); if(!t) continue; const e=ext[n];
    if(e.examen) t.examen=e.examen; if(e.cortas) t.cortas=e.cortas; if(e.test) t.test.push(...e.test.map(q=>({...q,x:1}))); } }
};

/* ---------- Almacenamiento local (progreso) ---------- */
const KEY='ci-repaso-v1';
let P = {tests:{}, fallos:{}, flash:{}, ex:{}, ct:{}};
try{ const raw = localStorage.getItem(KEY); if(raw){ P = Object.assign(P, JSON.parse(raw)); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){} }

/* ---------- Utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'], MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function hoy(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function fecha(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function diasHasta(s){ return Math.round((fecha(s)-hoy())/86400000); }
function fmtFecha(s){ const d=fecha(s); return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`; }
function flap(txt,cls=''){ return `<span class="flap${cls?' '+cls:''}">`+[...String(txt)].map((c,k)=>`<i style="--i:${k}">${esc(c===' '?'\u00a0':c)}</i>`).join('')+'</span>'; }
/* ---------- Movimiento ---------- */
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function vt(fn, cls){ if(!document.startViewTransition || reduceMotion()){ fn(); return; } if(cls) document.documentElement.classList.add(cls); const t=document.startViewTransition(fn); t.finished.finally(()=>{ if(cls) document.documentElement.classList.remove(cls); }); }
let flapHecho=false;
function flapShuffle(root){
  if(flapHecho || reduceMotion()) return; flapHecho=true;
  const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  root.querySelectorAll('.flap i').forEach(el=>{
    const fin=el.textContent; if(!fin.trim()) return;
    const tr=el.closest('tr'); const r=tr? Number(tr.style.getPropertyValue('--r'))||0 : 0;
    const k=Number(el.style.getPropertyValue('--i'))||0;
    const digits=/\d/.test(fin); const pool=digits?'0123456789':CH;
    let n=0; const steps=5+r+k*2;
    el.textContent=pool[Math.random()*pool.length|0];
    const tick=()=>{ n++; el.classList.remove('spin','land'); void el.offsetWidth;
      if(n>=steps){ el.textContent=fin; el.classList.add('land'); return; }
      el.textContent=pool[Math.random()*pool.length|0]; el.classList.add('spin'); setTimeout(tick,58); };
    setTimeout(tick, 380 + r*45);
  });
}
function countUp(node, target, dec=1){ if(!node || reduceMotion()) return; const fin=node.textContent; const t0=performance.now(), D=900;
  const f=t=>{ const p=Math.min(1,(t-t0)/D), e=1-Math.pow(1-p,4); node.textContent=p<1? (target*e).toFixed(dec).replace('.',',') : fin; if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
const LOGO='<span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22h20"/><path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z"/></svg></span>';
const asig = id => ASIGNATURAS.find(a=>a.id===id);
function qid(sid,t,i){ return `${sid}-t${t}-q${i}`; }

function todasPreguntas(sid){
  const d=DATA[sid]; const out=[];
  d.temas.forEach(t=>t.test.forEach((q,i)=>out.push({...q, id:qid(sid,t.n,i), tema:t.n})));
  return out;
}
function progresoTema(sid,t){
  const r=P.tests[`${sid}-t${t.n}`]; const best = r? r.best : null;
  const fcs=t.flash.length; let known=0; t.flash.forEach((f,i)=>{ if(P.flash[`${sid}-t${t.n}-f${i}`]) known++; });
  return {best, fcs, known};
}
function progresoAsig(sid){
  const d=DATA[sid]; if(!d) return 0;
  let s=0; d.temas.forEach(t=>{ const p=progresoTema(sid,t); s += ((p.best||0)/100)*0.7 + (p.fcs? p.known/p.fcs:0)*0.3; });
  return Math.round(s/d.temas.length*100);
}
function nFallos(sid){ return Object.keys(P.fallos).filter(k=>k.startsWith(sid+'-')).length; }

/* ---------- Router por hash ---------- */
let estado = {vista:'inicio'};
function ir(h){ if(location.hash==='#'+h || (!h && !location.hash)) render(); else location.hash = h; }
function leerHash(){
  const h = location.hash.replace('#','');
  if(!h) return {vista:'inicio'};
  const m = h.match(/^([a-z]+)(?:-(t\d+|simulacro|fallos|repaso|writing))?$/);
  if(!m || !asig(m[1])) return {vista:'inicio'};
  if(!m[2]) return {vista:'asig', sid:m[1]};
  if(m[2][0]==='t') return {vista:'tema', sid:m[1], tema:Number(m[2].slice(1))};
  return {vista:m[2], sid:m[1]};
}
window.addEventListener('hashchange', ()=>{ estado=leerHash(); vt(render,'vt-ruta'); });

/* ---------- Vistas ---------- */
const app = document.getElementById('app');
let timerId=null;
function setAcc(sid){ app.className = 'wrap' + (sid? ' s-'+sid : ' s-'+(proximo()?.id||'financiacion')); }
function proximo(){ return ASIGNATURAS.find(a=>diasHasta(a.examen)>=0); }

function topbar(extra=''){
  return `<div class="top"><button class="brand" onclick="ir('')">${LOGO}<b>Cleared</b><span>1ºA Comercio Internacional · exam ready</span></button><nav class="crumbs">${extra}</nav></div>`;
}

function render(){
  clearInterval(timerId);
  const e=estado;
  if(e.sid && !DATA[e.sid] && e.vista!=='inicio'){ return vistaPendiente(e.sid); }
  if(e.vista==='inicio') vistaInicio();
  else if(e.vista==='asig') vistaAsig(e.sid);
  else if(e.vista==='tema') vistaTema(e.sid, e.tema);
  else if(e.vista==='simulacro') vistaExamen(e.sid);
  else if(e.vista==='writing') vistaWriting(e.sid);
  else if(e.vista==='fallos') vistaQuiz(e.sid,'fallos');
  else if(e.vista==='repaso') vistaFlashAll(e.sid);
  window.scrollTo(0,0);
}

function vistaInicio(){
  const p = proximo(); setAcc(p?.id);
  const filas = ASIGNATURAS.map(a=>{
    const d=diasHasta(a.examen); const pr=progresoAsig(a.id);
    let chip = a.listo? '<span class="chip listo">Listo</span>' : '<span class="chip prep">En preparación</span>';
    if(d===0) chip='<span class="chip hoy">Hoy</span>'; else if(d<0) chip='<span class="chip hecho">Hecho</span>';
    return `<tr class="go s-${a.id}" style="--r:${ASIGNATURAS.indexOf(a)}" tabindex="0" onclick="ir('${a.id}')" onkeydown="if(event.key==='Enter')ir('${a.id}')">
      <td>${flap(a.cod)}</td>
      <td class="sub"><span class="dot"></span>${esc(a.nombre)}</td>
      <td class="mono">${fmtFecha(a.examen)}</td>
      <td class="mono">${d>0? d+' d' : d===0? '—' : ''}</td>
      <td>${chip}</td></tr>`;
  }).join('');
  const d = p? diasHasta(p.examen):null;
  app.innerHTML = topbar() + `
  <section class="hero">
    <div><span class="eyebrow">Exámenes del 10 al 19 de noviembre</span><h1>Tu repaso de 1º, asignatura por asignatura</h1>
    <p>Esquemas de cada tema, flashcards, tests con corrección automática, ejercicios de cálculo y simulacros de examen. Todo sale de tus apuntes.</p></div>
    ${p? `<div class="countdown"><div class="eyebrow">Próximo: ${esc(p.nombre)}</div><div class="big">${d===0? flap('HOY','xl') : flap(String(d),'xl')+`<span class="u">${d===1?'día':'días'}</span>`}</div><div class="muted mono">${fmtFecha(p.examen)}</div></div>`:''}
  </section>
  <section class="board" aria-label="Calendario de exámenes">
    <div class="board-head"><h2>Salidas · Exámenes</h2><span>Noviembre 2026</span></div>
    <table><thead><tr><th>Cód.</th><th>Asignatura</th><th>Fecha</th><th>Faltan</th><th>Estado</th></tr></thead><tbody>${filas}</tbody></table>
  </section>
  ${pie()}`;
  if(!flapHecho && !reduceMotion()){ app.classList.add('intro'); setTimeout(()=>app.classList.remove('intro'), 1400); }
  flapShuffle(app);
}

function vistaPendiente(sid){
  const a=asig(sid); setAcc(sid);
  app.innerHTML = topbar(`<button onclick="ir('')">Inicio</button><span>/</span><span>${esc(a.nombre)}</span>`) + `
  <div class="subj-head"><div><span class="eyebrow">${a.cod} · examen ${fmtFecha(a.examen)}</span><h1>${esc(a.nombre)}</h1></div></div>
  <div class="empty">Esta asignatura está en preparación. Se añadirá aquí con sus 7 temas en cuanto esté lista.</div>${pie()}`;
}

function vistaAsig(sid){
  const a=asig(sid), d=DATA[sid]; setAcc(sid);
  const dias=diasHasta(a.examen); const nf=nFallos(sid); const nq=todasPreguntas(sid).length;
  const cards = d.temas.map(t=>{
    const p=progresoTema(sid,t);
    return `<button class="tcard" onclick="ir('${sid}-t${t.n}')">
      <span class="row" style="justify-content:space-between;gap:8px"><span class="num">TEMA ${t.n}</span>${t.examen?.length?'<span class="tag">Entra en examen</span>':''}</span><h3>${esc(t.titulo)}</h3><p>${esc(t.idea)}</p></button>`;
  }).join('');
  const sim=P.tests[`${sid}-sim`]; const conEx=d.temas.filter(t=>t.examen?.length);
  app.innerHTML = topbar(`<button onclick="ir('')">Inicio</button><span>/</span><span>${esc(a.nombre)}</span>`) + `
  <div class="subj-head"><div><span class="eyebrow">${a.cod} · ${d.temas.length} temas · ${nq} preguntas</span><h1>${esc(a.nombre)}</h1></div>
    <div class="countdown"><div class="eyebrow">Examen ${fmtFecha(a.examen)}</div><div class="big" style="font-size:2.4rem">${dias>0? dias+' días' : dias===0? 'Hoy':'Hecho'}</div></div></div>
  <div class="actions">
    <button class="btn primary" onclick="ir('${sid}-simulacro')">Simulacro tipo examen <span class="n">${DATA[sid]?.simulacro?.formato?.nc===0?'test + ejercicios':'test + cortas + ejercicios'}</span></button>
    ${sid==='ingles'?`<button class="btn" onclick="ir('ingles-writing')">Writing <span class="n">corrige Claude</span></button>`:''}
    <button class="btn" onclick="ir('${sid}-fallos')" ${nf?'':'disabled'}>Repasar mis fallos <span class="n">${nf}</span></button>
    <button class="btn" onclick="ir('${sid}-repaso')">Todas las tarjetas</button>
  </div>
  ${conEx.length?`<details class="exban" open><summary><b>Lo que entra en el examen (indicado por la profesora)</b></summary><div class="exgrid" style="margin-top:8px">${conEx.map(t=>`<div><b>Tema ${t.n}</b><ul>${t.examen.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div></details>`:''}
  <div class="grid">${cards}</div>${pie()}`;
}

/* ---------- Tema ---------- */
let tabActual='esquema';
function vistaTema(sid,n){
  const a=asig(sid), d=DATA[sid], t=d.temas.find(x=>x.n===n); setAcc(sid);
  if(!t) return ir(sid);
  const tabs=[['esquema','Esquema'],['flash','Tarjetas'],['test','Test']]; if(t.cortas?.length) tabs.push(['cortas','Preguntas cortas']); if(t.ejercicios?.length) tabs.push(['ejer','Ejercicios']);
  if(!tabs.find(x=>x[0]===tabActual)) tabActual='esquema';
  const prev=d.temas.find(x=>x.n===n-1), next=d.temas.find(x=>x.n===n+1);
  app.innerHTML = topbar(`<button onclick="ir('')">Inicio</button><span>/</span><button onclick="ir('${sid}')">${esc(a.nombre)}</button><span>/</span><span>Tema ${n}</span>`) + `
  <span class="eyebrow">${a.cod} · Tema ${n}</span><h1 style="margin-top:6px">${esc(t.titulo)}</h1>
  ${t.examen?.length?`<section class="exban" style="margin:16px 0 0"><b>Entra en el examen</b><ul>${t.examen.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===tabActual}" onclick="vt(()=>{tabActual='${k}';vistaTema('${sid}',${n})})">${l}${k==='ejer'?` <span class="mono muted">${t.ejercicios.length}</span>`:k==='cortas'?` <span class="mono muted">${t.cortas.length}</span>`:''}</button>`).join('')}</div>
  <div id="panel"></div>
  <div class="temanav">${prev?`<button class="btn ghost" onclick="tabActual='esquema';ir('${sid}-t${prev.n}')">← Tema ${prev.n}</button>`:'<span></span>'}${next?`<button class="btn ghost" onclick="tabActual='esquema';ir('${sid}-t${next.n}')">Tema ${next.n} →</button>`:''}</div>${pie()}`;
  const panel=$('#panel');
  if(tabActual==='esquema') panel.innerHTML = `<div class="stack">${t.esquema.map(bloque).join('')}</div>`;
  else if(tabActual==='flash') flashcards(panel, t.flash.map((f,i)=>({f, id:`${sid}-t${n}-f${i}`})), ()=>vistaTema(sid,n));
  else if(tabActual==='test') quiz(panel, t.test.map((q,i)=>({...q,id:qid(sid,n,i),tema:n})), {modo:'tema', clave:`${sid}-t${n}`, sid});
  else if(tabActual==='ejer') ejercicios(panel, sid, n, t.ejercicios);
  else if(tabActual==='cortas') cortasUI(panel, sid, n, t.cortas);
}

function bloque(b){
  const T = b.t? `<h3>${b.t}</h3>`:'';
  switch(b.k){
    case 'mapa': return `<section class="blk mapa">${T}<div class="raiz">${b.raiz}</div><div class="ramas">${b.ramas.map(r=>`<div class="rama"><b>${r.t}</b>${r.d?`<p>${r.d}</p>`:''}${r.h?`<ul>${r.h.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`).join('')}</div></section>`;
    case 'tabla': return `<section class="blk">${T}<div class="tbl"><table><thead><tr>${b.cab.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${b.filas.map(f=>`<tr>${f.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
    case 'flujo': return `<section class="blk">${T}<ol class="flujo">${b.pasos.map((p,i)=>`<li><span class="k">${i+1}</span><span class="t">${p}</span></li>`).join('')}</ol></section>`;
    case 'claves': return `<section class="blk">${T}<dl class="claves">${b.items.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></section>`;
    case 'formula': return `<section class="blk">${T}<div class="formula">${b.f}</div>${b.nota?`<p>${b.nota}</p>`:''}</section>`;
    case 'ojo': return `<section class="blk ojo"><h3>${b.t||'Para el examen'}</h3><ul>${b.items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
    case 'caso': return `<section class="blk caso">${T}<span class="lbl">Planteamiento</span><p>${b.plan}</p><span class="lbl">Solución</span><p>${b.sol}</p></section>`;
    case 'vs': return `<section class="blk">${T}<div class="vs">${[b.a,b.b].map(x=>`<div><b>${x.t}</b><ul>${x.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div></section>`;
    case 'lista': return `<section class="blk">${T}<ul class="lista">${b.items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
    case 'texto': return `<section class="blk">${T}<p>${b.p}</p></section>`;
    default: return '';
  }
}

/* ---------- Flashcards ---------- */
function flashcards(el, cards, onExit){
  let soloPend=false; let mazo=shuffle(cards); let i=0;
  function pintar(){
    const lista = soloPend? mazo.filter(c=>!P.flash[c.id]) : mazo;
    const known = cards.filter(c=>P.flash[c.id]).length;
    if(!lista.length){ el.innerHTML = `<div class="empty"><h3 style="margin-bottom:8px">Te sabes todas las tarjetas (${known}/${cards.length})</h3><p>Puedes repasarlas otra vez o pasar al test.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="fcAll">Repasar todas</button><button class="btn" id="fcReset">Empezar de cero</button></div></div>`;
      $('#fcAll',el).onclick=()=>{soloPend=false;i=0;mazo=shuffle(cards);pintar();};
      $('#fcReset',el).onclick=()=>{cards.forEach(c=>delete P.flash[c.id]);save();soloPend=false;i=0;pintar();}; return; }
    if(i>=lista.length) i=0;
    const c=lista[i];
    el.innerHTML = `<div class="fc-wrap">
      <div class="row" style="justify-content:space-between;width:100%;max-width:620px"><span class="mono muted">${i+1} / ${lista.length}</span><span class="mono muted">Me las sé: ${known}/${cards.length}</span></div>
      <button class="fc" id="fc" aria-label="Girar tarjeta"><div class="fc-inner">

/* ---------- Test / simulacro ---------- */
const fueraSim=(d,n)=>(d.simulacro?.fuera||[]).includes(+n);
const temasSim=d=>d.temas.filter(t=>!fueraSim(d,t.n));
function vistaQuiz(sid, modo){
  const a=asig(sid), d=DATA[sid]; setAcc(sid);
  let preguntas = todasPreguntas(sid);
  let titulo='Simulacro de examen';
  if(modo==='fallos'){ preguntas = preguntas.filter(q=>P.fallos[q.id]); titulo='Repaso de fallos'; }
  else {
    preguntas = preguntas.filter(q=>!fueraSim(d,q.tema));
    // Simulacro: reparto equilibrado entre temas
    const n = Math.min(d.simulacro?.n||25, preguntas.length);
    const porTema={}; preguntas.forEach(q=>(porTema[q.tema]=porTema[q.tema]||[]).push(q));
    const temas=Object.keys(porTema); Object.keys(porTema).forEach(k=>porTema[k]=shuffle(porTema[k]));
    const sel=[]; let k=0; while(sel.length<n){ const tt=porTema[temas[k%temas.length]]; if(tt.length) sel.push(tt.pop()); k++; if(k>5000)break; }
    preguntas = shuffle(sel);
  }
  app.innerHTML = topbar(`<button onclick="ir('')">Inicio</button><span>/</span><button onclick="ir('${sid}')">${esc(a.nombre)}</button><span>/</span><span>${titulo}</span>`)+`<h1 style="margin-bottom:6px">${titulo}</h1><p class="muted" style="margin-bottom:20px">${modo==='simulacro'? `${preguntas.length} preguntas de todos los temas, ${d.simulacro?.min||30} minutos. Ves la corrección al terminar, como en el examen real.` : 'Solo las preguntas que has fallado. Cada acierto la quita de la lista.'}</p><div id="panel"></div>${pie()}`;
  if(!preguntas.length){ $('#panel').innerHTML='<div class="empty">No tienes fallos pendientes en esta asignatura.</div>'; return; }
  quiz($('#panel'), preguntas, {modo, clave:modo==='simulacro'? `${sid}-sim`:null, sid, min: modo==='simulacro'? (d.simulacro?.min||30):0});
}

function quiz(el, preguntas, cfg){
  const examen = cfg.modo==='simulacro';
  const qs = (cfg.modo==='tema'? shuffle(preguntas) : preguntas).map(q=>{ const orden=shuffle(q.o.map((_,i)=>i)); return {...q, orden}; });
  let i=0; const resp=new Array(qs.length).fill(null); let fin=false;
  let restante = cfg.min? cfg.min*60 : 0;
  if(restante){ timerId=setInterval(()=>{ restante--; const t=$('#timer',el); if(t){ t.textContent=fmtT(restante); if(restante<=120) t.classList.add('low'); } if(restante<=0){ clearInterval(timerId); terminar(); } },1000); }
  function fmtT(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function pintar(){
    const q=qs[i]; const r=resp[i]; const contestada = r!==null;
    const mostrar = contestada && !examen;
    el.innerHTML = `<div class="qcard">
      <div class="qtop"><span class="eyebrow">Pregunta ${i+1} de ${qs.length}${q.tema && cfg.modo!=='tema'?` · Tema ${q.tema}`:''}</span>${q.x?'<span class="tag soft">Punto de examen</span>':''}${restante?`<span class="timer" id="timer">${fmtT(restante)}</span>`:''}</div>
      <div class="qprog"><b style="width:${(i+(contestada?1:0))/qs.length*100}%"></b></div>
      <div class="qtext">${q.p}</div>
      <div class="opts">${q.orden.map((oi,k)=>{
        let cls=''; if(mostrar){ if(oi===q.c) cls='ok'; else if(oi===r) cls='bad'; } else if(r===oi) cls='sel';
        return `<button class="opt ${cls}" data-o="${oi}" ${mostrar?'disabled':''}><span class="l">${'ABCD'[k]}</span><span>${q.o[oi]}</span></button>`; }).join('')}</div>
      ${mostrar? `<div class="expl ${r===q.c?'ok':'bad'}"><b>${r===q.c?'Correcto.':'Incorrecto. La respuesta correcta es la marcada en verde.'}</b>${q.e}</div>`:''}
      <div class="row" style="justify-content:space-between;margin-top:18px">
        ${examen && i>0? `<button class="btn ghost" id="qPrev">← Anterior</button>`:'<span></span>'}
        <div class="row">${examen? `<button class="btn ghost" id="qEnd">Entregar</button>`:''}
        ${(contestada||examen)? `<button class="btn primary" id="qNext" ${examen&&!contestada?'disabled':''}>${i===qs.length-1? (examen?'Entregar y corregir':'Ver resultado') : 'Siguiente →'}</button>`:''}</div>
      </div></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(mostrar) return; resp[i]=Number(b.dataset.o); if(!examen) registrar(q, resp[i]); pintar(); });
    const nx=$('#qNext',el); if(nx) nx.onclick=()=>{ if(i<qs.length-1){ i++; pintar(); } else terminar(); };
    const pv=$('#qPrev',el); if(pv) pv.onclick=()=>{ i--; pintar(); };
    const en=$('#qEnd',el); if(en) en.onclick=()=>{ const sin=resp.filter(x=>x===null).length; if(sin && !en.dataset.c){ en.dataset.c=1; en.textContent=`Quedan ${sin} sin contestar · Entregar igualmente`; return; } terminar(); };
  }
  function registrar(q, r){ if(r===q.c) delete P.fallos[q.id]; else P.fallos[q.id]=1; save(); }
  function terminar(){
    if(fin) return; fin=true; clearInterval(timerId);
    if(examen) qs.forEach((q,k)=>{ if(resp[k]!==null) registrar(q,resp[k]); else P.fallos[q.id]=1; }); save();
    const ok = qs.filter((q,k)=>resp[k]===q.c).length; const pct=Math.round(ok/qs.length*100);
    const nota=(ok/qs.length*10).toFixed(1).replace('.',',');
    if(cfg.clave){ const prev=P.tests[cfg.clave]||{best:0,intentos:0}; P.tests[cfg.clave]={best:Math.max(prev.best,pct), last:pct, intentos:prev.intentos+1}; save(); }
    const mal = qs.map((q,k)=>({q,r:resp[k]})).filter(x=>x.r!==x.q.c);
    el.innerHTML = `<div class="qcard"><span class="eyebrow">Resultado</span>
      <div class="row" style="align-items:baseline;gap:18px;margin:8px 0 6px"><div class="score">${nota}</div><div class="muted">${ok} de ${qs.length} correctas · ${pct}%</div></div>
      <p class="muted">${pct>=90?'Muy bien. Este tema lo tienes dominado.':pct>=70?'Bien. Repasa los fallos de abajo y vuelve a intentarlo.':pct>=50?'Aprobado justo. Vuelve al esquema antes de repetir.':'Todavía flojo. Repasa el esquema y las tarjetas y vuelve a hacer el test.'}</p>
      <div class="row" style="margin-top:16px"><button class="btn primary" id="again">Repetir</button>${mal.length?`<button class="btn" onclick="ir('${cfg.sid}-fallos')">Repasar solo mis fallos</button>`:''}</div></div>
      ${mal.length? `<h2 style="margin-top:28px">Revisa tus fallos</h2><div class="review">${mal.map(({q,r})=>`<div class="item"><b>${q.p}</b><p>${r===null?'<span class="muted">Sin contestar.</span> ':`Tu respuesta: <span style="color:var(--bad)">${q.o[r]}</span><br>`}Correcta: <span style="color:var(--ok);font-weight:700">${q.o[q.c]}</span></p><p class="muted">${q.e}</p></div>`).join('')}</div>`:''}`;
    countUp($('.score',el), ok/qs.length*10);
    $('#again',el).onclick=()=>{ if(cfg.modo==='tema') quiz(el, preguntas, cfg); else render(); };
  }
  pintar();
}

function num(s){ s=String(s).trim().replace(/\s/g,'').replace(/[€$]/g,''); if(/,\d{1,}$/.test(s) && s.includes('.')) s=s.replace(/\./g,'').replace(',','.'); else if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); return parseFloat(s); }
function fmtN(x,dec){ return x.toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }

let SAMPLE=null, FOTO_OK=false;
(async()=>{ try{ if(!window.claude?.use) return; const s=await claude.use('sample'); if(!s) return; const lim=await s.limits().catch(()=>null); SAMPLE=s; FOTO_OK=!!lim?.images; document.querySelectorAll('.foto').forEach(f=>pintarFoto(f)); document.querySelectorAll('[data-a=ia]').forEach(b=>b.hidden=false); document.querySelectorAll('.sin-ia').forEach(b=>b.hidden=true); }catch(e){} })();
function errMsg(e){ return {cancelled:'Corrección cancelada.', not_granted:'No has permitido que la app use Claude. Puedes activarlo en los permisos de la app o corregirte tú con la respuesta modelo.', rate_limited:'Has hecho muchas correcciones seguidas. Espera un poco y vuelve a intentarlo.', image_rejected:'No se ha podido usar esa imagen. Prueba con otra foto (JPG o PNG).', invalid_json:'La corrección no ha salido bien. Vuelve a intentarlo.', refused:'No se ha podido corregir. Vuelve a intentarlo.'}[e?.code] || 'Ha fallado la conexión. Vuelve a intentarlo.'; }
const textoPlano = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent; };
function pintarFoto(f){
  const disp=f.querySelector('[data-a=foto]'), nota=f.querySelector('.hint');
  if(FOTO_OK){ disp.hidden=false; nota.textContent='Resuelve el ejercicio en papel, con todos los pasos, y saca una foto clara de la hoja.'; }

Responde en español, tuteando al alumno, SOLO con un objeto JSON con esta forma:

async function corregirCortasIA(items, signal){
  const prompt = `Eres profesor de un ciclo de FP de Comercio Internacional (asignatura: ${asig(estado.sid).nombre}). Corrige ${items.length===1?'la respuesta':'las respuestas'} de un alumno a preguntas cortas de examen.
Compara cada respuesta con la respuesta modelo de los apuntes y con las ideas clave. Puntúa cada una de 0 a 1 en pasos de 0,25: 1 si recoge todas las ideas clave aunque use otras palabras; 0,5 si recoge más o menos la mitad; 0 si está en blanco, es incorrecta o no tiene relación. No exijas que sea literal. Sé justo y concreto.

${items.map((it,i)=>`PREGUNTA ${i+1}: ${textoPlano(it.p)}
RESPUESTA MODELO: ${textoPlano(it.r)}
IDEAS CLAVE: ${it.k?.length? it.k.map(textoPlano).join('; ') : '(las de la respuesta modelo)'}
RESPUESTA DEL ALUMNO: ${String(it.a||'').trim()||'(en blanco)'}`).join('\n\n')}

Responde en español, tuteando al alumno, SOLO con un objeto JSON con esta forma: {"resultados":[{"puntuacion":0.75,"bien":"qué ha puesto bien, en una frase","falta":"qué le falta o qué está mal, en una o dos frases (cadena vacía si nada)"}]}, con un elemento por pregunta y en el mismo orden.`;
  const r = await SAMPLE.json(prompt, {signal, cache:false});

}

    <div class="out" aria-live="polite"></div>
    <div class="model" hidden>${modeloHTML(c)}${selfMarkHTML(v)}</div></div>`; }).join('')}</div>`;
  el.querySelectorAll('.ex').forEach(box=>{
    const k=Number(box.dataset.k), c=lista[k], id=`${sid}-t${n}-c${k}`; const ta=box.querySelector('textarea'), out=box.querySelector('.out'), mod=box.querySelector('.model');
    box.querySelector('[data-a=ver]').onclick=()=>{ mod.hidden=!mod.hidden; };
    wireSelfMark(mod, v=>{ P.ct[id]=v; save(); });
    const bIA=box.querySelector('button[data-a=ia]');
    bIA.onclick=async()=>{
      if(!ta.value.trim()){ out.innerHTML='<div class="corr bad"><span>Escribe primero tu respuesta.</span></div>'; return; }
      const ctl=new AbortController(); bIA.disabled=true;
      out.innerHTML='<div class="corr"><span class="v">Corrigiendo…</span><span class="muted">Claude está comparando tu respuesta con los apuntes.</span><div><button class="btn ghost" data-a="stop">Cancelar</button></div></div>';
      out.querySelector('[data-a=stop]').onclick=()=>ctl.abort();
      try{ const [r]=await corregirCortasIA([{...c, a:ta.value}], ctl.signal); out.innerHTML=iaHTML(r); iaFill(out,r); P.ct[id]=r.s; save(); mod.hidden=false; }
      catch(e){ out.innerHTML=`<div class="corr bad"><span>${errMsg(e)}</span></div>`; mod.hidden=false; }
      finally{ bIA.disabled=false; }
    };
  });
}

/* ---------- Simulacro tipo examen ---------- */
function repartir(lista, n){
  const por={}; shuffle(lista).forEach(x=>(por[x.tema]=por[x.tema]||[]).push(x));
  const ks=shuffle(Object.keys(por)); const out=[]; let k=0;
  while(out.length<n && ks.some(t=>por[t].length)){ const arr=por[ks[k%ks.length]]; if(arr.length) out.push(arr.pop()); k++; }
  return out;
}

  test = shuffle(test).map(q=>({...q, orden:shuffle(q.o.map((_,i)=>i))}));

      ${x.r!=null?`<div class="ex" style="padding:0;border:0;background:none"><div class="ans"><input data-e="${i}" inputmode="decimal" placeholder="Resultado final" aria-label="Resultado del ejercicio ${i+1}"> <span class="mono muted">${x.u||''}</span></div></div>`:`<textarea class="resp" data-e="${i}" placeholder="Puedes escribir aquí tu resolución o hacerla en papel" aria-label="Resolución del ejercicio ${i+1}"></textarea>`}</div>`).join('')}</div></section>`:''}

  function entregar(porTiempo){

    // Test

    const t10=Math.max(0, ok*vOk - mal*vMal), tPts=t10*F.pt/10;

    ejs.forEach((x,i)=>{ if(es[i]===1) P.ex[x.id]=1; });
    const prev=P.tests[`${sid}-sim`]||{best:0,intentos:0}; P.tests[`${sid}-sim`]={...prev, intentos:(prev.intentos||0)+1}; save();

    ${ejs.length?`<section class="exam-sec"><header><h2>Ejercicios prácticos</h2><span class="mono">${fmtN(ptsE,1)} p cada uno</span><p>Si tu resultado no coincide, sube la foto de tu hoja: Claude puede darte la mitad si el planteamiento es bueno. En los de desarrollo, ponte nota o usa la foto.</p></header>
      <div class="stack">${ejs.map((x,i)=>`<div class="ex" data-ei="${i}"><span class="eyebrow">Ejercicio ${i+1} · Tema ${x.tema}</span><div class="enun">${x.p}</div>
        ${x.r!=null?`<div class="res ${es[i]?'ok':'bad'}">${respE[i].trim()? `Tu resultado: ${esc(respE[i])} ${x.u||''} · ${es[i]?'Correcto':'No coincide'}` : 'Sin resultado'}</div>`:(respE[i].trim()?`<span class="lab">Tu resolución</span><div class="mine">${esc(respE[i])}</div>`:'')}
        <div class="sol">${x.r!=null?`<b>Solución: ${fmtN(x.r,x.dec??2)} ${x.u||''}</b>`:'<b>Solución</b>'}<ol>${x.pasos.map(p=>`<li>${p}</li>`).join('')}</ol></div>

    ${wr?`<section class="exam-sec"><header><h2>Writing</h2><span class="mono">aparte</span></header><div class="eq" id="wrBox"><span class="eyebrow">${esc(wr.t)} · ${wr.w[0]}–${wr.w[1]} words · tienes ${nPal(wtxt)}</span><div style="margin:6px 0 10px">${esc(wr.p)}</div>

    ${pie()}`;

    function recalc(){
      const sc=cs.reduce((s,v)=>s+(v||0),0)*ptsC, se=es.reduce((s,v)=>s+(v||0),0)*ptsE;
      const total=tPts+sc+se, nota=total/MAX*10; const pc=cs.filter(v=>v===null).length, pe=es.filter(v=>v===null).length;
      $('#nota').textContent=fmtN(nota,2); $('#notaTxt').textContent = (pc+pe)? 'nota provisional' : (nota>=5?'aprobado':'suspenso');

      const pct=Math.round(nota*10); const p=P.tests[`${sid}-sim`]||{best:0,intentos:1}; P.tests[`${sid}-sim`]={...p, best:Math.max(p.best||0,pct), last:pct}; save();

      wireSelfMark(box, v=>{ es[i]=v; recalc(); });
      const f=box.querySelector('.foto'), fi=f.querySelector('input[type=file]'); pintarFoto(f);

      fi.onchange=()=>{ const file=fi.files?.[0]; fi.value=''; if(file) corregirFoto(box, x, x.id, file, v=>{ const s={correcto:1, parcial:0.5, incorrecto:0}[v]; if(s==null) return; es[i]=Math.max(s, x.r!=null? (es[i]||0) : 0); box.querySelectorAll('.selfm [data-m]').forEach(b=>b.classList.toggle('on', Number(b.dataset.m)===es[i])); recalc(); }); };
    });
    // Writing
    const wb=$('#wrBox'); if(wb){ const bt=wb.querySelector('button[data-a=ia]'); if(bt) bt.onclick=()=>corregirWriting(wr, wtxt, wb.querySelector('.wout'), bt); }

  }

/* ---------- Writing (Inglés) ---------- */
async function corregirWriting(wr, texto, out, btn){
  const ctl=new AbortController(); if(btn) btn.disabled=true;
  out.innerHTML='<div class="corr"><span class="v">Corrigiendo…</span><span class="muted">Claude está leyendo tu texto. Puede tardar hasta un minuto.</span><div><button class="btn ghost" data-a="stop">Cancelar</button></div></div>';
  out.querySelector('[data-a=stop]').onclick=()=>ctl.abort();
  const n=nPal(texto);
  const prompt = `Eres profesor de inglés de un ciclo de FP de Comercio Internacional (nivel A2-B1). Corrige este writing de examen.
TAREA: ${wr.p}
EXTENSIÓN PEDIDA: ${wr.w[0]}-${wr.w[1]} palabras. El alumno ha escrito ${n}.
TEXTO DEL ALUMNO:
"""
${texto}
"""
Valora el cumplimiento de la tarea y la extensión, la gramática, el vocabulario, la organización (conectores, párrafos) y el registro (formal o informal según la tarea). Pon una nota realista de 0 a 10 para un examen de este nivel.
Responde en español, tuteando al alumno (los fragmentos y correcciones, en inglés), SOLO con un objeto JSON con esta forma:
{"nota": 7.5, "resumen": "valoración general en una o dos frases", "positivo": "lo que está bien", "errores": [{"original": "fragmento del alumno con el error", "correccion": "fragmento corregido", "explicacion": "por qué, breve"}], "mejora": "el consejo más importante para subir nota", "version_mejorada": "su texto corregido y algo mejorado, manteniendo su contenido y un nivel A2-B1"}`;
  try{
    const r=await SAMPLE.json(prompt, {signal:ctl.signal, cache:false});
    let nota=Number(r?.nota); if(!isFinite(nota)) nota=0; nota=Math.max(0,Math.min(10,nota));
    const errs=Array.isArray(r?.errores)? r.errores : [];
    out.innerHTML=`<div class="corr ${nota>=7?'ok':nota>=5?'parcial':'bad'}"><span class="v">${fmtN(nota,1)} / 10</span><p class="w-res"></p>
      ${r?.positivo?`<div><span class="lab">Lo que está bien</span><p class="w-pos"></p></div>`:''}
      ${errs.length?`<div><span class="lab">Errores (${errs.length})</span><ul class="errs">${errs.map(()=>`<li><span class="o"></span> → <span class="c"></span><br><span class="muted e"></span></li>`).join('')}</ul></div>`:''}
      ${r?.mejora?`<div><span class="lab">Para subir nota</span><p class="w-mej"></p></div>`:''}
      ${r?.version_mejorada?`<div><span class="lab">Versión corregida</span><div class="mine w-ver"></div></div>`:''}</div>`;
    const c=out.querySelector('.corr'); const set=(s,v)=>{ const e=c.querySelector(s); if(e) e.textContent=String(v||''); };
    set('.w-res', r?.resumen); set('.w-pos', r?.positivo); set('.w-mej', r?.mejora); set('.w-ver', r?.version_mejorada);
    c.querySelectorAll('.errs li').forEach((li,i)=>{ li.querySelector('.o').textContent=String(errs[i]?.original||''); li.querySelector('.c').textContent=String(errs[i]?.correccion||''); li.querySelector('.e').textContent=String(errs[i]?.explicacion||''); });
  }catch(e){ out.innerHTML=`<div class="corr bad"><span>${errMsg(e)}</span></div>`; }
  finally{ if(btn) btn.disabled=false; }
}
function vistaWriting(sid){
  if(sid!=='ingles') return ir(sid);
  const a=asig(sid); setAcc(sid);
  app.innerHTML = topbar(`<button onclick="ir('')">Inicio</button><span>/</span><button onclick="ir('${sid}')">${esc(a.nombre)}</button><span>/</span><span>Writing</span>`)+`
  <h1>Writing</h1><p class="muted" style="margin:8px 0 18px;max-width:70ch">Elige una tarea, escribe tu texto y Claude te lo corrige con nota, errores explicados y una versión corregida. Las tareas usan la gramática de cada tema.</p>
  <div class="wprompts">${WRITING.map((w,i)=>`<button class="tcard" data-w="${i}"><span class="num">TASK ${i+1} · ${w.w[0]}–${w.w[1]} WORDS</span><h3>${esc(w.t)}</h3><p>${esc(w.p)}</p></button>`).join('')}</div>
  <div id="wpanel"></div>${pie()}`;
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const w=WRITING[Number(b.dataset.w)];
    const p=$('#wpanel'); p.innerHTML=`<div class="eq" style="margin-top:22px"><span class="eyebrow">${esc(w.t)} · ${w.w[0]}–${w.w[1]} words</span><div style="margin:6px 0 10px">${esc(w.p)}</div>
      <textarea class="resp big" placeholder="Write here…" aria-label="Tu writing"></textarea>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="wc">0 words</span><span><button class="btn primary" data-a="ia" ${SAMPLE?'':'hidden'}>Corregir con Claude</button><span class="sin-ia muted" ${SAMPLE?'hidden':''}>La corrección funciona al abrir la app desde Claude.</span></span></div>
      <div class="wout" aria-live="polite" style="margin-top:12px"></div></div>`;
    const ta=p.querySelector('textarea'), wc=p.querySelector('.wc'); ta.oninput=()=>{ const n=nPal(ta.value); wc.textContent=`${n} words`; wc.classList.toggle('ok', n>=w.w[0]&&n<=w.w[1]); };
    const bt=p.querySelector('button[data-a=ia]'); bt.onclick=()=>{ if(!ta.value.trim()) return; corregirWriting(w, ta.value, p.querySelector('.wout'), bt); };
    p.scrollIntoView({behavior:'smooth', block:'start'}); ta.focus({preventScroll:true}); });
}
