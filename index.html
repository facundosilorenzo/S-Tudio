 1:{cortas:[
  {p:"¿Qué es el sistema comercial? Explica sus agentes y sus tres flujos.", r:"Es el conjunto de elementos, relaciones y flujos que permiten que los productos lleguen <b>de quienes los producen a quienes los consumen</b>. Agentes: empresa o fabricante, intermediarios (mayoristas y minoristas), consumidor final e instituciones. Flujos: <b>físico</b> (traslado del producto), <b>de información</b> (demanda, precios, existencias, preferencias) y <b>financiero</b> (pagos, cobros y condiciones).", k:["del productor al consumidor","agentes: empresa, intermediarios, consumidor, instituciones","flujo físico","flujo de información","flujo financiero"]},
  {p:"Diferencia entre variables comerciales controlables y no controlables.", r:"Las <b>controlables</b> son las <b>4 P</b> del marketing mix: producto, precio, distribución y comunicación. Las <b>no controlables</b> son el <b>entorno</b>: el <b>macroentorno</b> (fuerzas globales PESTEL que afectan a todo el sector) y el <b>microentorno</b> (competidores, proveedores, clientes e intermediarios, con influencia directa). No se controlan, pero se analizan, se anticipan y la empresa se adapta.", k:["controlables: 4 P","no controlables: entorno","macroentorno PESTEL","microentorno: agentes cercanos"]},
  {p:"Distingue mercado potencial, disponible y objetivo con un ejemplo.", r:"<b>Potencial</b>: demanda máxima teórica si compraran todos los que tienen necesidad y capacidad. <b>Disponible</b>: consumidores con acceso real a la oferta de la empresa. <b>Objetivo</b>: segmento al que la empresa decide dirigir sus recursos. Ejemplo Netflix: potencial = todos los internautas; disponible = países con Internet rápido y derechos; objetivo = jóvenes nativos digitales.", k:["potencial: máximo teórico","disponible: acceso real","objetivo: segmento elegido","ejemplo"]},
  {p:"¿Qué son las 5 fuerzas de Porter y los tipos de competidores?", r:"Las <b>5 fuerzas</b>: rivalidad entre competidores existentes, amenaza de nuevos entrantes, amenaza de productos sustitutivos, poder de negociación de los proveedores y poder de negociación de los clientes. Competidores: <b>directos</b> (mismo producto y público), <b>indirectos</b> (misma necesidad, solución distinta) y <b>potenciales</b> (podrían entrar).", k:["rivalidad","nuevos entrantes","sustitutivos","poder de proveedores y clientes","directos, indirectos, potenciales"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una cadena de gimnasios low cost analiza su microentorno. Identifica un competidor directo, uno indirecto y uno potencial, y aplica dos de las 5 fuerzas de Porter.", pasos:["Directo: otra cadena de gimnasios low cost (mismo producto, mismo público).","Indirecto: apps de entrenamiento en casa o clubes de running (misma necesidad, solución distinta).","Potencial: una gran marca deportiva que podría abrir gimnasios.","Fuerzas: <b>amenaza de sustitutivos</b> alta (entrenar en casa) y <b>amenaza de nuevos entrantes</b> alta (barreras bajas)."]}
 ]},
 2:{cortas:[
  {p:"Diferencia entre necesidad, deseo y demanda. Pon un ejemplo.", r:"<b>Necesidad</b>: estado de carencia percibida; el marketing no la crea, la detecta (hambre). <b>Deseo</b>: forma concreta de expresar la necesidad según la cultura y la personalidad (una paella). <b>Demanda</b>: deseo respaldado por <b>capacidad y voluntad de compra</b> (puedo pagarla y la pido).", k:["necesidad: carencia, el marketing la detecta","deseo: forma concreta","demanda: capacidad y voluntad de compra"]},
  {p:"Explica la pirámide de Maslow con un ejemplo de producto para cada nivel.", r:"De la base a la cima: <b>fisiológicas</b> (alimentación, descanso: comida, colchón), <b>seguridad</b> (protección, salud: seguros, alarmas), <b>sociales</b> (pertenencia: marcas que crean comunidad), <b>reconocimiento</b> (estatus, logro: lujo, alto rendimiento) y <b>autorrealización</b> (desarrollo personal: cursos, actividades creativas).", k:["fisiológicas","seguridad","sociales","reconocimiento","autorrealización"]},
  {p:"Explica los roles del proceso de compra industrial (B2B).", r:"<b>Iniciador</b>: detecta la necesidad. <b>Prescriptor</b>: recomienda una solución o proveedor. <b>Decisor</b>: aprueba la compra. <b>Comprador</b>: ejecuta la transacción. <b>Usuario final</b>: usa el bien. Por eso las compras B2B son más complejas, racionales y colectivas.", k:["iniciador","prescriptor","decisor","comprador","usuario"]},
  {p:"¿Qué factores influyen en el comportamiento del consumidor?", r:"<b>Culturales</b>: cultura (valores, creencias, costumbres) y subculturas. <b>Sociales</b>: grupos de referencia (de pertenencia o aspiración), familia y clase social. <b>Personales</b>: edad, ciclo de vida familiar, ocupación, estilo de vida y personalidad. <b>Psicológicos</b>: motivación, percepción, aprendizaje, actitudes y creencias.", k:["culturales","sociales","personales","psicológicos"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa de hostelería quiere comprar una nueva cafetera industrial. Asigna los roles B2B a: el camarero que avisa de que la vieja falla, el técnico que recomienda una marca, el gerente que firma y el administrativo que hace el pedido. ¿Quién es el usuario?", pasos:["Camarero que avisa: <b>iniciador</b>.","Técnico que recomienda: <b>prescriptor</b>.","Gerente que firma: <b>decisor</b>.","Administrativo que hace el pedido: <b>comprador</b>.","Usuario final: los <b>camareros</b> que usarán la cafetera."]}
 ]},
 3:{cortas:[
  {p:"¿Qué es la segmentación y qué requisitos debe cumplir un segmento?", r:"Es dividir el mercado en <b>subgrupos homogéneos entre sí y heterogéneos respecto a los demás</b> para adaptar la oferta (la sistematizó Kotler). Requisitos: <b>medible</b> (se puede cuantificar), <b>accesible</b> (se puede llegar a él), <b>rentable o sustancial</b> (tamaño y capacidad de compra), <b>diferenciable</b> (reacciona distinto) y <b>accionable</b> (se puede diseñar un programa para él).", k:["homogéneos dentro, heterogéneos fuera","medible","accesible","rentable","diferenciable","accionable"]},
  {p:"Explica los criterios de segmentación con un ejemplo de cada uno.", r:"<b>Geográfica</b> (país, región, clima): más ropa de abrigo en el norte. <b>Demográfica</b>, la más usada (edad, sexo, ingresos): productos financieros para mayores de 65. <b>Psicográfica</b> (valores, estilo de vida): alimentación para vida saludable. <b>Conductual</b> (frecuencia de uso, lealtad, beneficios): programas para heavy users.", k:["geográfica","demográfica (la más usada)","psicográfica","conductual"]},
  {p:"Compara las estrategias indiferenciada, diferenciada y concentrada.", r:"<b>Indiferenciada</b>: una sola oferta para todo el mercado con economías de escala (Ford Modelo T); recursos altos, riesgo bajo. <b>Diferenciada</b>: una oferta para cada segmento (Toyota: Yaris, Corolla…); recursos muy altos, empresa multiproducto. <b>Concentrada</b>: todos los recursos en un nicho (Rolex, Hawkers); para pymes con recursos limitados, pero riesgo alto por dependencia.", k:["indiferenciada: una oferta, masiva","diferenciada: una por segmento","concentrada: un nicho, pymes","recursos y riesgo"]},
  {p:"¿Qué es un buyer persona?", r:"Una <b>representación semificticia del cliente ideal</b> construida a partir de <b>datos reales</b>. Sirve para humanizar al cliente y orientar las decisiones de marketing. Ejemplo: «El Jefe» de Mercadona, o «Laura, 34 años» en el caso NaturBox.", k:["semificticia","cliente ideal","datos reales","humaniza al cliente"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una startup con poco presupuesto lanza zapatillas veganas. ¿Qué estrategia comercial le recomiendas y por qué? ¿Qué cambiaría si en unos años fuera una gran empresa multiproducto?", pasos:["Ahora: estrategia <b>concentrada (nicho)</b>: recursos limitados, perfil startup y fase de lanzamiento.","Riesgo: alta dependencia de un solo segmento.","Más adelante, como gran empresa multiproducto y en madurez: estrategia <b>diferenciada</b>, una oferta para cada segmento (running, moda, niños…).","Criterio del tema: en el lanzamiento, concentración; en la madurez, diferenciación."]}
 ]},
 4:{cortas:[
  {p:"¿Qué es el SIM y cuál es su finalidad?", r:"Es una <b>estructura permanente</b> de personas, equipos y procedimientos que <b>recogen, clasifican, analizan y distribuyen</b> la información necesaria para tomar decisiones comerciales. Finalidad: determinar las necesidades de información, evitar la dispersión, garantizar la disponibilidad y mejorar la calidad de las decisiones. Es un sistema vivo; una pyme puede tenerlo en una hoja de cálculo.", k:["estructura permanente","recoger, clasificar, analizar, distribuir","decisiones comerciales","evitar la dispersión"]},
  {p:"Explica los 4 subsistemas del SIM.", r:"<b>Datos internos</b>: información de la propia actividad (ventas, pedidos, reclamaciones); la fuente más rápida y barata. <b>Inteligencia de marketing</b>: vigila de forma continua el entorno. <b>Investigación comercial</b>: estudios específicos para una pregunta concreta. <b>Apoyo a las decisiones</b>: cruza y analiza todo con modelos estadísticos.", k:["datos internos","inteligencia de marketing","investigación comercial","apoyo a las decisiones"]},
  {p:"Clasifica la información según su naturaleza, origen y disponibilidad.", r:"<b>Naturaleza</b>: cuantitativa (cifras: ventas, cuota) o cualitativa (opiniones, motivaciones). <b>Origen</b>: primaria (se obtiene para el problema concreto: encuestas, entrevistas) o secundaria (ya existe, hecha con otro fin: informes, INE). <b>Disponibilidad</b>: interna (ventas, contabilidad) o externa (competencia, instituciones). Los criterios no son excluyentes.", k:["cuantitativa / cualitativa","primaria / secundaria","interna / externa","no excluyentes"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una heladería tiene: (1) el registro de ventas de su caja, (2) un informe del INE sobre consumo, (3) las conversaciones del dueño con proveedores sobre tendencias y (4) un test de sabores que va a hacer a clientes. Clasifica cada fuente y di a qué subsistema del SIM pertenece.", pasos:["(1) Caja: cuantitativa, secundaria, interna → <b>datos internos</b>.","(2) INE: cuantitativa, secundaria, externa → <b>inteligencia de marketing</b>.","(3) Proveedores: cualitativa, secundaria, externa → <b>inteligencia de marketing</b>.","(4) Test de sabores: cualitativa/cuantitativa, primaria → <b>investigación comercial</b>.","Todo se cruza en el <b>apoyo a las decisiones</b>."]}
 ]},
 5:{cortas:[
  {p:"¿Cuáles son los requisitos de idoneidad de un SIM?", r:"<b>Relevancia</b>: la información responde a una decisión concreta. <b>Exactitud</b>: los datos reflejan la realidad (sin errores de tecleo ni clientes duplicados). <b>Actualidad</b>: la información pierde valor con el tiempo, hay que fijar la frecuencia de revisión. <b>Coste-beneficio</b>: máximo valor de decisión con los recursos disponibles.", k:["relevancia","exactitud","actualidad","coste-beneficio"]},
  {p:"¿Con qué criterios se valoran los datos?", r:"<b>Fiabilidad</b>: quién generó el dato, con qué método y con qué frecuencia se actualiza. <b>Coste</b>: dinero, tiempo y esfuerzo técnico. <b>Validez</b>: que se ajuste a la pregunta (ajuste al problema, actualidad, nivel de detalle). <b>Utilidad</b>: que aporte algo a la decisión; suele aumentar combinando fuentes. Fiabilidad y coste sirven para elegir fuentes; validez y utilidad, para ver si el dato sirve.", k:["fiabilidad","coste","validez","utilidad"]},
  {p:"Compara hoja de cálculo, CRM y ERP como herramientas del SIM.", r:"<b>Hoja de cálculo</b>: registrar, ordenar y calcular con volumen moderado; accesible y barata pero limitada. <b>CRM</b>: gestiona la relación con los clientes (historial de compras, consultas, reclamaciones) y la consultan varios departamentos. <b>ERP y bases de datos</b>: integran ventas, almacén y contabilidad en un único sistema y reducen duplicidades. Condiciones: actualización permanente, agilidad de consulta y seguridad (RGPD).", k:["hoja de cálculo: volumen moderado","CRM: clientes","ERP: integra departamentos","actualización, agilidad, seguridad"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una óptica tiene clientes duplicados en su base de datos, precios de hace dos años y guarda datos que nadie consulta. ¿Qué requisitos de idoneidad incumple y cómo lo solucionarías?", pasos:["Clientes duplicados → falla la <b>exactitud</b>: depurar la base y hacer comprobaciones cruzadas.","Precios de hace dos años → falla la <b>actualidad</b>: fijar una frecuencia de revisión.","Datos que nadie usa → falla la <b>relevancia</b> (y el <b>coste-beneficio</b>): guardar solo lo que sirve para decidir.","Herramienta: un <b>CRM</b> con actualización automática, niveles de acceso y cumplimiento del RGPD."]}
 ]},
 6:{cortas:[
  {p:"Define la investigación comercial y explica sus características.", r:"Es el <b>proceso sistemático y objetivo</b> de identificar, recopilar, analizar, interpretar y presentar la información para ayudar a decidir; su finalidad es <b>reducir la incertidumbre</b>. Es un subsistema del SIM. Características: <b>sistemática</b> (método por fases), <b>objetiva</b> (imparcial), <b>específica</b> (responde a una necesidad concreta) y <b>aplicada</b> (apoya una decisión real).", k:["proceso sistemático y objetivo","reducir la incertidumbre","subsistema del SIM","sistemática, objetiva, específica, aplicada"]},
  {p:"Diferencias entre el SIM y la investigación comercial.", r:"El <b>SIM</b> es <b>permanente</b>, abarca toda la información de la empresa, usa datos internos e inteligencia de mercado y se usa a diario. La <b>investigación comercial</b> es un <b>proyecto con principio y fin</b>, responde a una pregunta concreta, suele generar <b>datos primarios nuevos</b> y se usa bajo demanda.", k:["SIM permanente / investigación con principio y fin","toda la información / una pregunta","datos internos / primarios","a diario / bajo demanda"]},
  {p:"¿Qué prohíbe el código ICC/ESOMAR y qué derechos tiene el entrevistado?", r:"Prohíbe el <b>sugging</b> (vender haciéndolo pasar por una encuesta) y el <b>frugging</b> (pedir donativos haciéndolo pasar por un estudio). El entrevistado tiene derecho al <b>anonimato</b> (no se revela su identidad), a la <b>confidencialidad</b> (los datos solo se usan para el estudio) y al <b>consentimiento informado</b> (acepta conociendo el objetivo y puede abandonar sin consecuencias).", k:["sugging","frugging","anonimato","confidencialidad","consentimiento informado"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa llama a clientes diciendo que hace «una breve encuesta» y al final les ofrece un seguro. Otra prueba su nueva bebida sin enseñar la marca. Una tercera mide el recuerdo de su anuncio una semana después de emitirlo. ¿Qué es cada cosa?", pasos:["Encuesta que acaba en venta: <b>sugging</b>, prohibido por el código ICC/ESOMAR.","Bebida sin marca visible: <b>test de producto ciego</b> (elimina el efecto marca).","Recuerdo tras emitir el anuncio: <b>postest</b> publicitario.","Si se probara el anuncio antes de lanzarlo sería un <b>pretest</b>."]}
 ]},
 7:{cortas:[
  {p:"Enumera y explica brevemente las fases del proceso de investigación comercial.", r:"1) <b>Identificar y definir el problema</b> u oportunidad. 2) <b>Definir el propósito</b> (qué información, cuánto tiempo, para quién). 3) <b>Objetivos e hipótesis</b>. 4) <b>Diseño de la investigación</b> (tipo de estudio y fuentes). 5) <b>Obtención de la información</b>. 6) <b>Tratamiento y análisis</b>. 7) <b>Conclusiones e informe</b>. No son estrictamente lineales.", k:["problema","propósito","objetivos e hipótesis","diseño","obtención","análisis","informe"]},
  {p:"¿Por qué un síntoma no es un problema? ¿Qué requisitos tiene un problema bien definido?", r:"Porque una caída de ventas es un <b>síntoma</b>: el problema real puede estar en el precio, la distribución, la competencia o los gustos. Un problema bien definido es <b>concreto, verificable</b> (con datos), <b>delimitado en tiempo y alcance</b> y <b>relevante</b>. Mal: «las ventas no van bien». Bien: «las ventas de X han caído un 12 % en la zona norte en el último trimestre».", k:["síntoma ≠ problema","concreto","verificable","delimitado","relevante"]},
  {p:"Explica los tipos de hipótesis y la pareja H0/H1.", r:"<b>Descriptiva</b>: predice un valor de la población (más del 40 % estaría interesado). <b>De relación</b>: dos variables están asociadas, sin causa-efecto. <b>Causal</b>: una variable influye en otra. En estadística, <b>H0 (nula)</b> dice que no hay efecto y <b>H1 (alternativa)</b> que sí lo hay; con la muestra se decide si se rechaza H0.", k:["descriptiva","de relación","causal","H0 nula: no hay efecto","H1 alternativa: sí hay efecto"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una academia de idiomas ve que se matriculan menos alumnos de verano. Redacta el problema bien definido, el objetivo general, dos objetivos específicos y una pareja H0/H1.", pasos:["Problema: «las matrículas de los cursos de verano han bajado un X % respecto al verano anterior en la sede de…» (concreto, verificable y delimitado).","Objetivo general: determinar por qué han bajado las matrículas de verano.","Específicos: conocer el precio que consideran adecuado; saber qué horarios prefieren.","H0: el precio no influye en la decisión de matricularse. H1: el precio sí influye."]}
 ]}
});
ESTUDIO.extra("gestion", {
 1:{cortas:[
  {p:"¿Qué es un emprendedor y qué características lo definen? ¿Tiene que ser totalmente nueva la idea?", r:"Según la RAE, es la «persona que emprende con resolución acciones o empresas innovadoras»: <b>lleva a cabo una idea y asume un riesgo</b>. Es <b>innovador y planificador</b> (se anticipa a los cambios con un plan estratégico) y <b>no tiene miedo al fracaso</b>. La idea <b>no tiene que ser totalmente nueva, pero sí diferente</b>: se consigue observando el mercado y perfilándola (debilidades y fortalezas).", k:["emprende acciones innovadoras","asume un riesgo","innovador y planificador","sin miedo al fracaso","idea diferente, no necesariamente nueva"]},
  {p:"¿Qué es la misión de una empresa? Pon un ejemplo.", r:"Es su <b>razón de ser</b>. Responde a tres preguntas: <b>¿qué producir?, ¿cómo producir? y ¿para quién producir?</b> Ejemplo: Coca-Cola produce <b>bebidas refrescantes</b>, <b>creando valor</b>, <b>para gente feliz</b>. De la misión salen los objetivos generales (medio y largo plazo) y los operativos.", k:["razón de ser","qué producir","cómo producir","para quién producir","ejemplo"]},
  {p:"¿Qué tipos de responsabilidad social puede asumir una empresa? Explícalo con el caso Gendare.", r:"La RSE es la <b>integración voluntaria</b> de las preocupaciones sociales y medioambientales en la actividad (Libro Verde de la Comisión Europea). En Gendare: responsabilidad <b>económica</b> (crea empleo y aporta al PIB), <b>medioambiental</b> (producción sostenible) y <b>social</b> (destina el 2 % de los beneficios a causas sociales).", k:["integración voluntaria","económica: empleo y PIB","medioambiental: producción sostenible","social: 2 % de beneficios"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una cadena de cafeterías de Sevilla analiza su entorno. Clasifica en <b>general</b> o <b>específico</b>: (a) sube el precio del café en origen por el proveedor; (b) la población envejece; (c) abre otra cafetería en la misma calle; (d) nueva ley que limita las terrazas; (e) los clientes piden leche vegetal.", pasos:["(a) Proveedor: <b>específico</b> (microentorno, efecto directo).","(b) Demografía: <b>general</b> (factor demográfico, no lo controla).","(c) Competencia: <b>específico</b>.","(d) Ley: <b>general</b> (factor legislativo/político).","(e) Clientes: <b>específico</b>; la empresa sí puede reaccionar (ampliar la carta)."]}
 ]},
 2:{cortas:[
  {p:"¿Qué es el análisis DAFO y cómo se organiza?", r:"Es una herramienta que analiza la situación de la empresa en cuatro cuadrantes. La parte <b>interna</b> (el emprendedor y la empresa) recoge las <b>Fortalezas</b> (positivo) y las <b>Debilidades</b> (negativo). La parte <b>externa</b> (el entorno, que no se controla) recoge las <b>Oportunidades</b> (positivo) y las <b>Amenazas</b> (negativo). En el plan de empresa va dentro del <b>plan de marketing</b>.", k:["interno: fortalezas y debilidades","externo: oportunidades y amenazas","entorno incontrolable","dentro del plan de marketing"]},
  {p:"¿Qué opciones de producto tiene un emprendedor? Pon un ejemplo.", r:"Tres opciones: (1) una <b>innovación</b> que cubre una necesidad no cubierta (Álvaro y su sensor de riego por Bluetooth); (2) <b>entrar en un mercado ya explotado</b> que tiene alguna deficiencia; (3) <b>desarrollar un mercado nuevo o desatendido</b>. Tanto quien ama el riesgo como quien lo evita puede emprender, porque hay sectores de bajo riesgo.", k:["innovación: necesidad no cubierta","mercado explotado con deficiencia","mercado nuevo o desatendido","ejemplo"]},
  {p:"¿Quién utiliza el plan de empresa y cómo debe redactarse?", r:"Lo usa el <b>empresario</b> como guía y para el control de resultados, y también <b>otros usuarios</b>: accionistas, entidades de financiación, clientes y proveedores. Debe ser <b>claro, sencillo, con datos actualizados y con todas las áreas</b>, y conviene tener una <b>versión completa y otra resumida</b>. La idea debe ser innovadora, creativa y viable.", k:["guía y control para el empresario","accionistas, financiación, clientes, proveedores","claro, sencillo, datos actualizados","versión completa y resumida"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Pedro abre una academia de idiomas online. Clasifica cada punto en el DAFO: (a) es profesor nativo; (b) crece la demanda de clases por internet; (c) no tiene experiencia en gestión; (d) grandes plataformas con precios muy bajos; (e) no necesita local; (f) las ayudas al autoempleo para jóvenes.", pasos:["(a) <b>Fortaleza</b> (interno, positivo).","(b) <b>Oportunidad</b> (externo, positivo).","(c) <b>Debilidad</b> (interno, negativo).","(d) <b>Amenaza</b> (externo, negativo).","(e) <b>Fortaleza</b>: menos costes, como Clara en su caso.","(f) <b>Oportunidad</b>: depende del entorno, no de él."]}
 ]},
 3:{cortas:[
  {p:"Diferencia entre sociedad civil y comunidad de bienes.", r:"En la <b>sociedad civil</b> dos o más personas <b>ponen en común</b> bienes o derechos para un proyecto. En la <b>comunidad de bienes</b> dos o más personas tienen un <b>bien en común que ya existía</b> y lo explotan, y no se puede aportar solo dinero. En las dos: <b>sin personalidad jurídica</b>, <b>sin capital mínimo</b>, <b>responsabilidad ilimitada</b>, cada socio tributa por <b>IRPF</b> y cotiza en el <b>RETA</b>.", k:["SC: ponen bienes en común para un proyecto","CB: bien común previo","sin personalidad jurídica","responsabilidad ilimitada","IRPF y RETA"]},
  {p:"¿Por qué puede interesar crear una sociedad mercantil en lugar de ser empresario individual?", r:"Por tres motivos: <b>financiación</b> (se puede buscar en los socios), <b>responsabilidad</b> (limitada a lo aportado, frente a la ilimitada del individual) e <b>impuestos</b> (el individual puede pagar más del 50 % de sus ingresos por IRPF; las sociedades, en torno al 30 % o menos por Impuesto de Sociedades).", k:["financiación de los socios","responsabilidad limitada","impuestos: IS ~30 % frente a IRPF >50 %"]},
  {p:"¿Qué derechos tiene el accionista de una SA y qué órganos tienen la SA y la SL?", r:"Derechos del accionista: <b>participar en los beneficios</b>, <b>voto en la junta</b>, <b>preferencia en la suscripción de nuevas acciones</b> e <b>información</b>. Órganos: la <b>junta general</b> (se reúne al menos una vez al año) y el <b>órgano de administración</b>.", k:["participar en beneficios","voto en la junta","preferencia en nuevas acciones","información","junta general y órgano de administración"]}
 ], ejercicios:[
  {p:"Se constituye una sociedad anónima con el capital mínimo legal. ¿Cuánto deben desembolsar como mínimo los socios en el momento de la constitución?", r:15000, dec:2, u:"€", pasos:["Capital mínimo de la SA: <b>60.000 €</b>.","Desembolso inicial mínimo: el <b>25 %</b>.","60.000 × 0,25 = <b>15.000 €</b>."]},
  {p:"Una SL se crea con 1.000 € de capital y en su primer año gana 4.000 €. ¿Qué importe mínimo debe destinar a reserva legal?", r:800, dec:2, u:"€", pasos:["Con menos de 3.000 € de capital, la SL debe destinar <b>al menos el 20 %</b> del beneficio a reserva legal, hasta que reserva + capital sumen 3.000 €.","4.000 × 0,20 = <b>800 €</b>.","Reserva + capital = 1.800 €, aún por debajo de 3.000 €, así que sigue la obligación el año siguiente."]}
 ]},
 4:{cortas:[
  {p:"Diferencia entre trámites de constitución y trámites de puesta en marcha. Pon dos ejemplos de cada uno.", r:"Los de <b>constitución</b> dan a la sociedad su <b>forma jurídica</b>: certificación negativa de denominación, estatutos, escritura, inscripción en el <b>Registro Mercantil</b> y <b>NIF</b>. Los de <b>puesta en marcha</b> permiten <b>empezar la actividad</b>: alta en el <b>Censo</b> y en el IAE, <b>licencia municipal</b>, inscripción en la Seguridad Social y <b>Libro de Visitas</b>. El empresario individual no necesita trámites de constitución.", k:["constitución: forma jurídica","ejemplos: denominación, Registro Mercantil, NIF","puesta en marcha: empezar la actividad","ejemplos: Censo, licencia, Libro de Visitas"]},
  {p:"¿Qué tipos de ayudas y subvenciones existen para las empresas?", r:"Pueden ser <b>directas</b> (dinero) o <b>indirectas</b> (descuentos, bonificaciones). Tipos: <b>asesoramiento empresarial</b>, <b>ayudas y subvenciones</b> (intereses de préstamos, autoempleo), <b>fomento de la inversión</b> e <b>incentivos fiscales</b>. Son un incentivo, <b>nunca la fuente básica de financiación</b>; influyen el sexo, la edad o el tipo de empresa.", k:["directas o indirectas","asesoramiento","subvenciones a intereses y autoempleo","incentivos fiscales","nunca la fuente básica"]},
  {p:"¿Cuáles son las obligaciones laborales de la empresa?", r:"<b>Comunicar la apertura del centro de trabajo</b>; <b>firmar el contrato antes de que el trabajador empiece</b> (a través del SEPE o Contrat@); y <b>dar de alta a los trabajadores en la Seguridad Social</b>, comunicando también las variaciones y las bajas.", k:["comunicar apertura del centro","contrato antes de empezar (SEPE/Contrat@)","alta en la Seguridad Social, variaciones y bajas"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Solpisomar sufre dos problemas: (a) un incendio destruye su almacén y no puede pagar a sus proveedores este mes; (b) compró un piso a largo plazo financiándolo con un crédito a corto. ¿Qué tipo de insolvencia es cada uno? Si un proveedor pide el concurso, ¿es voluntario o necesario y qué fases tendrá?", pasos:["(a) Insolvencia <b>fortuita</b>, por un hecho imprevisto.","(b) Insolvencia <b>transitoria</b>: falta de liquidez puntual por financiar un activo a largo con deuda a corto (incumple la regla de oro).","Si lo pide un acreedor es un concurso <b>necesario</b> (si lo pidiera la empresa sería voluntario).","Fases: <b>1. común</b>, <b>2. convenio</b> y <b>3. liquidación</b>, ante un juez mercantil (Ley Concursal 22/2003)."]}
 ]},
 5:{cortas:[
  {p:"¿Qué es el balance de situación? Explica la estructura económica y la financiera.", r:"Es el documento que refleja el patrimonio de la empresa. La <b>estructura económica</b> es el <b>activo</b>: lo que la empresa tiene (bienes y derechos), en qué ha empleado los recursos. La <b>estructura financiera</b> es el <b>patrimonio neto + pasivo</b>: de dónde proceden los recursos. Se cumple <b>ACTIVO = PATRIMONIO NETO + PASIVO</b>.", k:["activo: bienes y derechos, en qué se emplea","PN + pasivo: de dónde salen los recursos","ACTIVO = PN + PASIVO"]},
  {p:"Diferencia entre activo no corriente y activo corriente, con ejemplos.", r:"El <b>activo no corriente</b> permanece en la empresa <b>más de un año</b>: inmovilizado intangible (aplicaciones informáticas), inmovilizado material (maquinaria, furgonetas, ordenadores), inversiones inmobiliarias e inversiones financieras a l/p. El <b>activo corriente</b> se convierte en dinero en <b>menos de un año</b>: existencias, deudores comerciales (clientes), inversiones financieras a c/p y efectivo.", k:["no corriente: más de un año","ejemplos: maquinaria, furgoneta","corriente: menos de un año","ejemplos: existencias, clientes, efectivo"]},
  {p:"¿Qué es la regla de oro de la financiación?", r:"El <b>activo no corriente se financia con capitales permanentes</b> (patrimonio neto + pasivo no corriente) y el <b>activo corriente con exigible a corto plazo</b>. Además, los <b>ingresos de las inversiones deben superar el coste de financiarlas</b>. Si se financia un activo a largo con deuda a corto, la empresa puede quedarse sin liquidez.", k:["ANC con capitales permanentes","AC con exigible a c/p","ingresos > coste de la financiación"]}
 ], ejercicios:[
  {p:"Una empresa tiene: local propio 90.000 €, maquinaria 25.000 €, una aplicación informática 4.000 €, existencias 6.000 €, clientes que le deben 3.500 € y 2.500 € en el banco. ¿Cuánto suma el activo corriente?", r:12000, dec:2, u:"€", pasos:["Activo corriente = lo que dura menos de un año: existencias, clientes y efectivo.","6.000 + 3.500 + 2.500 = <b>12.000 €</b>.","(Local, maquinaria y aplicación son activo no corriente: 119.000 €; activo total 131.000 €.)"]},
  {p:"La empresa anterior (activo total 131.000 €) se financia con 60.000 € de capital de los socios, un préstamo a 8 años de 50.000 €, 7.000 € que debe a proveedores a 30 días y el resto con un préstamo a 9 meses. ¿Cuánto suma el capital permanente?", r:110000, dec:2, u:"€", pasos:["Capital permanente = patrimonio neto + pasivo no corriente.","PN: capital 60.000 €. PNC: préstamo a 8 años 50.000 €.","60.000 + 50.000 = <b>110.000 €</b>.","(El pasivo corriente son los 21.000 € restantes: 7.000 de proveedores + 14.000 del préstamo a 9 meses.)"]}
 ]},
 6:{cortas:[
  {p:"¿Qué es una ampliación de capital? Explica la prima de emisión y las formas de emitir.", r:"Es <b>emitir nuevas acciones</b> para crecer, reducir deuda o aumentar la tesorería. Se ofrecen <b>primero a los socios actuales</b> (derecho de preferencia) para que mantengan su cuota. La <b>prima de emisión = precio de emisión − valor nominal</b>. Se emite <b>a la par</b> (precio = nominal) o <b>sobre la par</b> (precio > nominal); <b>bajo la par no está permitido</b> en España.", k:["emitir nuevas acciones","preferencia de los socios actuales","prima = precio − nominal","a la par / sobre la par","bajo la par no permitido"]},
  {p:"Diferencia entre amortización y provisión.", r:"La <b>amortización</b> recoge la pérdida de valor del inmovilizado para <b>recuperar la inversión y poder reponerlo</b>; es un <b>gasto pero no un pago</b>. La <b>provisión</b> consiste en <b>retener recursos para gastos o pérdidas futuras</b> (impagos, pérdida de valor de existencias, reclamaciones). Las dos son <b>autofinanciación de mantenimiento</b>.", k:["amortización: reponer el inmovilizado","gasto pero no pago","provisión: gastos o pérdidas futuras","autofinanciación de mantenimiento"]},
  {p:"¿Qué es el scrip dividendo y qué es el pay-out?", r:"El <b>scrip dividendo</b> es una ampliación de capital <b>con cargo a reservas</b>: se entregan acciones gratis a los accionistas <b>sin salida de tesorería</b>. El <b>pay-out</b> es la parte del beneficio que se reparte: <b>dividendos ÷ beneficio neto</b>. Lo que no se reparte son las <b>reservas</b> (autofinanciación de enriquecimiento).", k:["scrip: ampliación con cargo a reservas","acciones gratis sin salida de tesorería","pay-out = dividendos ÷ beneficio neto","lo no repartido: reservas"]}
 ], ejercicios:[
  {p:"Una empresa gana 80.000 € de beneficio neto y tiene un pay-out del 40 %. ¿Cuánto destina a reservas?", r:48000, dec:2, u:"€", pasos:["Dividendos = 80.000 × 0,40 = 32.000 €.","Reservas = beneficio − dividendos = 80.000 − 32.000 = <b>48.000 €</b>.","Es autofinanciación de <b>enriquecimiento</b>."]},
  {p:"Una empresa obtiene un resultado neto de 35.000 €. Amortiza una máquina de 60.000 € (sin valor residual, vida útil de 10 años) por cuotas constantes y dota 2.000 € de provisiones. ¿Cuál es el cash-flow?", r:43000, dec:2, u:"€", pasos:["Amortización anual = 60.000 ÷ 10 = 6.000 €.","Cash-flow = resultado neto + amortizaciones + provisiones.","35.000 + 6.000 + 2.000 = <b>43.000 €</b>."]},
  {p:"Una SA emite 8.000 acciones nuevas de 5 € de valor nominal a un precio de 7,50 €. ¿Cuánto ingresa en total con la ampliación?", r:60000, dec:2, u:"€", pasos:["Se emite <b>sobre la par</b>: prima = 7,50 − 5 = 2,50 € por acción.","Ingreso total = 8.000 × 7,50 = <b>60.000 €</b>.","(De ellos, 40.000 € son capital social y 20.000 € prima de emisión.)"]},
  {p:"Unos ordenadores cuestan 3.600 €, tienen un valor residual de 600 € y una vida útil de 4 años. Con cuotas constantes, ¿cuál es la cuota de amortización anual?", r:750, dec:2, u:"€/año", pasos:["Cuota = (valor de compra − valor residual) ÷ vida útil.","(3.600 − 600) ÷ 4 = 3.000 ÷ 4 = <b>750 €/año</b>."]}
 ]},
 7:{cortas:[
  {p:"Diferencia entre acciones y obligaciones. ¿Qué es un empréstito?", r:"Las <b>acciones</b> son parte del <b>capital</b> (propiedad): solo se devuelven si se disuelve la empresa y se remuneran según los resultados. Las <b>obligaciones</b> son parte de una <b>deuda</b>: se devuelven al vencimiento y pagan <b>intereses fijados de antemano</b>. El <b>empréstito</b> es emitir muchas obligaciones que suscriben pequeños inversores (obligacionistas); es difícil para las pymes.", k:["acciones: capital, propiedad","obligaciones: deuda","se devuelven al vencimiento con interés fijo","empréstito: muchas obligaciones, obligacionistas"]},
  {p:"Diferencia entre descuento comercial y factoring.", r:"En el <b>descuento comercial</b> el banco <b>adelanta el importe de los efectos</b> de los clientes cobrando una comisión, pero el <b>riesgo de impago sigue siendo de la empresa</b>. En el <b>factoring</b> una empresa especializada <b>compra los derechos de cobro</b> (todas las facturas) y <b>asume el riesgo de impago</b>; es cómodo pero caro.", k:["descuento: el banco adelanta los efectos","riesgo de la empresa","factoring: compra los derechos de cobro","riesgo de la empresa de factoring, más caro"]},
  {p:"¿Qué son la carencia, el saldo vivo y la TAE de un préstamo?", r:"La <b>carencia</b> es el periodo en el que <b>solo se pagan intereses</b>. El <b>saldo vivo</b> es el <b>capital pendiente de amortizar</b>. La <b>TAE</b> es el <b>tipo efectivo</b>, que incluye todos los intereses y comisiones, y sirve para comparar préstamos.", k:["carencia: solo intereses","saldo vivo: capital pendiente","TAE: incluye intereses y comisiones"]}
 ], ejercicios:[
  {p:"Una empresa pide un préstamo de 120.000 € al 4,5 % anual a 5 años, pagando intereses cada año y el capital al final. ¿Cuánto paga de intereses cada año?", r:5400, dec:2, u:"€", pasos:["Interés anual = principal × tipo de interés.","120.000 × 0,045 = <b>5.400 €</b> al año.","El último año pagará 120.000 + 5.400 = 125.400 €."]},
  {p:"Una empresa tiene una línea de crédito de 20.000 € y durante todo el año dispone de 12.000 €. El banco cobra un 6 % anual sobre lo dispuesto y una comisión del 0,5 % sobre lo no dispuesto. ¿Cuánto paga en total al banco ese año?", r:760, dec:2, u:"€", pasos:["Intereses por lo dispuesto: 12.000 × 0,06 = 720 €.","No dispuesto: 20.000 − 12.000 = 8.000 €. Comisión: 8.000 × 0,005 = 40 €.","Total = 720 + 40 = <b>760 €</b>."]}
 ]}
});
ESTUDIO.extra("negociacion", {
 1:{cortas:[
  {p:"¿Qué es el comercio internacional y qué ventajas tiene? ¿En qué se diferencia del comercio interior?", r:"Es el <b>intercambio de bienes o servicios entre dos o más países</b>. Ventajas: <b>más especialización</b>, <b>economías de escala</b>, estímulo de la <b>producción, la renta y el empleo</b>, y <b>más competencia</b> (mejor rendimiento, precio y tecnología). Se diferencia del comercio interior por la aparición de las <b>aduanas</b>.", k:["intercambio entre países","especialización y economías de escala","producción, renta y empleo","más competencia","aduanas"]},
  {p:"¿Cuáles son las principales instituciones de la UE y qué hace cada una?", r:"La <b>Comisión Europea</b> elabora y <b>propone</b> la legislación y negocia con otros países. El <b>Consejo de la UE</b> y el <b>Parlamento Europeo</b> <b>aprueban</b> las normas. El <b>Tribunal de Justicia</b> garantiza que la legislación se cumpla e interprete igual en todos los países. El <b>Tribunal de Cuentas</b> comprueba que los fondos se recaudan y usan bien.", k:["Comisión: propone","Consejo y Parlamento: aprueban","Tribunal de Justicia: cumplimiento","Tribunal de Cuentas: fondos"]},
  {p:"¿Qué son el ICEX y el SOIVRE?", r:"El <b>ICEX</b> es una entidad pública nacional que <b>promueve las exportaciones españolas</b> y la <b>inversión extranjera en España</b>. El <b>SOIVRE</b> es el servicio de inspección de la Dirección General de Comercio e Inversiones: <b>controla la calidad comercial</b> de los productos de comercio exterior y asesora técnicamente; es garantía de calidad y seguridad de las exportaciones españolas.", k:["ICEX: promueve exportaciones","e inversión extranjera","SOIVRE: control de calidad","asesoramiento técnico"]},
  {p:"¿Qué es negociar y qué tipos de negociación internacional existen?", r:"Negociar es el <b>acercamiento entre dos partes enfrentadas para lograr una situación favorable para ambas</b>. Lo más habitual es la <b>compraventa</b> (precio, garantías, lugar y plazo de entrega, condiciones de pago). Tipos: importación/exportación, contratos con centrales de compra, suministro y subcontratación, <b>joint-ventures y franquicias</b>, distribución, alianzas y fusiones, transferencia tecnológica y patentes, y <b>licitaciones públicas</b>.", k:["acercamiento de partes enfrentadas","favorable para ambas","compraventa","joint-ventures, franquicias, licitaciones…"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Ordena las fases de una exportación de vino de Logroño a un importador de Canadá: (a) despacho en la aduana canadiense; (b) firma del contrato; (c) transporte hasta el almacén del importador; (d) transporte por mar; (e) camión hasta el puerto y despacho de exportación.", pasos:["1.º <b>(b)</b> Firma del contrato de exportación con las condiciones de entrega.","2.º <b>(e)</b> Transporte interior hasta el recinto aduanero y despacho de exportación.","3.º <b>(d)</b> Transporte hasta el país de destino.","4.º <b>(a)</b> Entrada en la aduana de importación y despacho.","5.º <b>(c)</b> Transporte interior hasta los almacenes del importador."]}
 ]},
 2:{cortas:[
  {p:"Diferencia entre estudio de mercado primario y secundario, con ejemplos.", r:"El <b>primario o de campo</b> se hace <b>expresamente para la investigación</b>: visitas comerciales con <b>observación, entrevistas y encuestas</b>. El <b>secundario o documental</b> usa <b>información ya publicada</b>: informes comerciales, informes anuales de empresas y publicaciones de instituciones como el <b>ICEX</b>.", k:["primario: de campo, expreso","observación, entrevistas, encuestas","secundario: documental, ya publicado","informes, ICEX"]},
  {p:"¿Qué tipos de proveedores hay y cuál ofrece precios más bajos?", r:"<b>Fabricantes</b>: transforman la materia prima en producto terminado; tienen los <b>precios más bajos</b>. <b>Distribuidores (mayoristas)</b>: compran grandes cantidades al fabricante y venden a minoristas, con precios mayores. <b>Independientes</b>: autónomos que distribuyen en exclusiva sus creaciones únicas. <b>Importadores</b>: como un mayorista nacional, pero con artículos del extranjero.", k:["fabricantes: precio más bajo","distribuidores mayoristas","independientes","importadores"]},
  {p:"Diferencia entre representante comercial, distribuidor y agente comercial.", r:"El <b>representante</b> pone en contacto y <b>firma acuerdos en nombre de la empresa</b> (tiene poder legal). El <b>distribuidor</b> es <b>responsable del producto</b> e incluso del servicio técnico. El <b>agente comercial</b> vende, ofrece productos y <b>tramita pedidos</b>, pero <b>solo negocia lo autorizado</b>.", k:["representante: firma acuerdos, poder legal","distribuidor: responsable del producto y servicio técnico","agente: tramita pedidos, solo lo autorizado"]},
  {p:"¿Qué es el margen de negociación?", r:"Cada parte tiene un <b>límite superior</b> (su mejor opción) y un <b>límite inferior</b> (la última opción para seguir); por debajo del inferior la negociación <b>se rompe</b>. Se negocia en la <b>zona donde los límites de ambas partes se solapan</b>. Es <b>dinámico</b> y cambia según el país: en Latinoamérica se empieza muy exigente y se va rebajando, y en la cultura árabe se regatea.", k:["límite superior: mejor opción","límite inferior: se rompe","zona de solapamiento","dinámico según el país"]}
 ], ejercicios:[
  {p:"Un exportador pide idealmente 40 €/ud y no bajaría de 30 €/ud. El importador quiere pagar idealmente 25 €/ud y aceptaría como máximo 34 €/ud. ¿Cuántos euros de amplitud tiene la zona de acuerdo?", r:4, dec:2, u:"€/ud", pasos:["Zona de acuerdo = donde se solapan los límites: entre el mínimo del vendedor y el máximo del comprador.","Va de 30 €/ud (mínimo del exportador) a 34 €/ud (máximo del importador).","Amplitud = 34 − 30 = <b>4 €/ud</b>."]}
 ]},
 3:{cortas:[
  {p:"¿Qué es un e-marketplace? Tipos, ventajas y desventajas.", r:"Es un <b>espacio virtual que reúne a compradores y vendedores</b> sin la barrera de la distancia. Tipos: <b>B2B</b> (entre empresas), <b>B2C</b> (empresa a consumidor) y <b>C2C</b> (entre consumidores); y <b>generales</b> o <b>sectoriales</b>. Ventajas: ahorro en infraestructura (a cambio de una comisión) y en publicidad, y un gran escaparate. Desventajas: <b>más competencia</b> y tener que <b>cumplir las reglas del marketplace</b>.", k:["espacio virtual compradores-vendedores","B2B, B2C, C2C","generales o sectoriales","ahorro y escaparate","más competencia, reglas"]},
  {p:"¿Qué es el dropshipping y qué ventajas tiene?", r:"Creas una <b>web</b> donde publicas productos que el cliente paga; informas del pedido al <b>fabricante (dropshipper)</b>, que lo <b>envía directamente al cliente</b>, y tú ganas una <b>comisión</b> como intermediario. Ventajas: <b>baja inversión inicial</b>, gran variedad de productos casi inmediata, menos riesgo al probar productos nuevos, ahorro de tiempo y <b>sin inventario ni almacén</b>.", k:["web propia","el fabricante envía al cliente","comisión como intermediario","baja inversión","sin inventario ni almacén"]},
  {p:"¿Qué son la RFQ y el MOQ? ¿Por qué un proveedor fija un MOQ?", r:"La <b>RFQ</b> (solicitud de cotización) es la carta con la que el comprador <b>pide formalmente una oferta detallada</b> (contacto, productos, unidades mínimas, coste unitario, entrega, forma de pago). Conviene que sea breve y sencilla. El <b>MOQ</b> (Minimum Order Quantity) es la <b>cantidad mínima de pedido</b> y es <b>negociable</b>. Se fija porque el proveedor tiene más trabajo del que puede atender o porque solo trabaja con grandes empresas.", k:["RFQ: pedir oferta detallada","breve y sencilla","MOQ: cantidad mínima","negociable","exceso de trabajo o solo grandes empresas"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una tienda quiere promocionar su calzado en Japón. Indica qué acción de promoción exterior es cada una: (a) el gerente viaja a Tokio para reunirse con distribuidores; (b) se invita a compradores japoneses y a su prensa a visitar las fábricas de Elche; (c) la empresa organiza sola un viaje para buscar clientes; (d) expone en una feria de calzado de Osaka.", pasos:["(a) <b>Acción comercial</b>: el empresario visita el país para contactar y cerrar acuerdos.","(b) <b>Acción comercial inversa</b>: se invita a empresas extranjeras y sus medios.","(c) <b>Prospección individual</b>: la hace una sola empresa.","(d) <b>Feria internacional</b>: empresas del mismo sector exponen a clientes."]}
 ]},
 4:{cortas:[
  {p:"¿Cómo se clasifican los clientes por frecuencia y por volumen?", r:"Por <b>frecuencia</b>: <b>frecuente</b> (servicio personalizado y especial atención), <b>habitual</b> (seguimiento e información) y <b>ocasional</b>. Por <b>volumen</b>: <b>alto</b> (compras por encima de la media), <b>medio</b> (igual a la media) y <b>bajo</b> (por debajo).", k:["frecuente, habitual, ocasional","alto, medio, bajo","respecto a la media"]},
  {p:"¿Cómo se calcula la rentabilidad de un cliente? ¿El que más compra es siempre el más rentable?", r:"<b>Rentabilidad = precio de venta ÷ costes en la venta</b>. Antes se pasa todo al mismo periodo: cantidad mensual = nº de pedidos al mes × cantidad por pedido (o pedido anual ÷ 12). <b>No</b>: en el caso Estiagri, <b>Fertilmar, el que menos compra, es el más rentable</b> (2,25). Además, muchos pedidos pequeños suponen más envíos.", k:["precio de venta ÷ costes","mismo periodo (mensual)","no siempre el que más compra","Fertilmar"]},
  {p:"Explica los modelos de base de datos y sus elementos.", r:"Elementos: <b>datos, atributos, campos, registros y archivo</b>; las <b>columnas</b> son campos y las <b>filas</b> registros. Modelos: <b>jerárquico</b> (árbol invertido de una raíz a los nodos), <b>en red</b> (como el jerárquico pero puede relacionarse con otras estructuras; más complejo) y <b>relacional</b> (el <b>más usado</b>: las tablas se relacionan por campos comunes). Programas: Access y Excel.", k:["columnas = campos, filas = registros","jerárquico: árbol","en red: más complejo","relacional: el más usado"]}
 ], ejercicios:[
  {p:"Precio de venta: 200 €/tn. Un cliente compra 3.600 tn al año y el coste es de 160 €/tn. ¿Cuál es su rentabilidad?", r:1.25, dec:2, pasos:["Cantidad mensual = 3.600 ÷ 12 = 300 tn.","Venta = 300 × 200 = 60.000 €. Costes = 300 × 160 = 48.000 €.","Rentabilidad = 60.000 ÷ 48.000 = <b>1,25</b> (rentable)."]},
  {p:"Un cliente hace 12 pedidos al mes de 8 tn cada uno y el precio de venta es de 250 €/tn. ¿Cuál es el importe de sus ventas mensuales?", r:24000, dec:2, u:"€", pasos:["Cantidad mensual = 12 × 8 = 96 tn.","Venta = 96 × 250 = <b>24.000 €</b> al mes."]},
  {p:"Ponderaciones para elegir clientes: rentabilidad 40 %, volumen 35 %, plazo de pago 25 %. El cliente X saca 9, 5 y 6 puntos. ¿Cuál es su puntuación final?", r:6.85, dec:2, u:"puntos", pasos:["Se multiplica cada puntuación por su ponderación.","9 × 0,40 = 3,6 · 5 × 0,35 = 1,75 · 6 × 0,25 = 1,5.","3,6 + 1,75 + 1,5 = <b>6,85 puntos</b>."]}
 ]},
 5:{cortas:[
  {p:"Diferencia entre CRM y ERP.", r:"El <b>CRM</b> (Customer Relationship Management) gestiona las <b>ventas y los clientes</b> (marketing relacional): es fácil de instalar, más económico y sirve para empresas de todos los tamaños. El <b>ERP</b> (Enterprise Resource Planning) gestiona y controla los <b>procesos de todos los departamentos</b>: instalación más compleja (varios módulos), coste más elevado, para empresas medianas y grandes. Son <b>compatibles</b>.", k:["CRM: ventas y clientes","fácil y económico, todos los tamaños","ERP: todos los departamentos","complejo y caro, medianas y grandes","compatibles"]},
  {p:"¿Qué tipos de CRM existen?", r:"<b>Operativo</b>: gestión de marketing, ventas y servicio al cliente. <b>Analítico</b>: almacén de datos (<b>data warehouse</b>) para tomar decisiones y evaluar resultados. <b>Colaborativo</b>: interacción con el cliente por email, teléfono o chat.", k:["operativo: marketing, ventas, servicio","analítico: data warehouse","colaborativo: email, teléfono, chat"]},
  {p:"¿Para qué sirven las TIC en la negociación internacional y por qué algunas empresas no usan TIC específicas?", r:"Sirven para <b>administrar mejor la empresa</b> (contabilidad, inventario), <b>hacer trámites online</b>, <b>mejorar la comunicación</b> con clientes y proveedores y <b>trabajar en red</b>. Algunas no usan TIC específicas (SRM, ERP, CRM) porque ya usan otras o prefieren el cara a cara, por <b>falta de formación</b> o personal capacitado, o por su <b>alto coste</b> o falta de infraestructuras.", k:["administración","trámites online","comunicación","trabajo en red","falta de formación, coste"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa de 200 empleados con fábrica, almacén, contabilidad y comercial que no se comunican entre sí quiere un programa accesible desde cualquier lugar y montado rápido. ¿Qué le recomiendas?", pasos:["Necesita integrar <b>todos los departamentos</b> → <b>ERP</b> (además es una empresa grande, que puede asumir su coste).","Accesible desde cualquier lugar → ERP <b>en la nube</b>.","Montado rápido y más barato → ERP <b>predefinido</b> por módulos, no a medida.","Antes: analizar necesidades reales, volumen de trabajo, departamentos y presupuesto. Puede añadir un CRM: son compatibles."]}
 ]},
 6:{cortas:[
  {p:"¿Qué es la comunicación y cuáles son sus elementos?", r:"Es el <b>intercambio de mensajes mediante códigos entre un emisor y un receptor</b>; una buena comunicación genera <b>feedback</b>. Elementos (caso Maite): <b>emisor</b> (Maite), <b>receptor</b> (Antonio, el frutero), <b>mensaje</b> («me vendes un kilo de plátanos»), <b>canal</b> (el aire), <b>código</b> (el español) y <b>contexto</b> (el mercado).", k:["intercambio de mensajes mediante códigos","feedback","emisor, receptor, mensaje","canal, código, contexto"]},
  {p:"¿Cuáles son las barreras de la comunicación? Pon un ejemplo de cada tipo.", r:"Del <b>emisor</b>: código distinto (idioma, cultura), mala pronunciación, lenguaje verbal y no verbal que no coinciden, actitud negativa. Del <b>entorno</b>: ruidos, interrupciones, espacio demasiado grande o pequeño. Del <b>receptor</b>: desmotivación, estar obligado, deducciones precipitadas, prejuicios hacia el emisor, falta de feedback.", k:["emisor: código distinto, pronunciación","entorno: ruidos, interrupciones","receptor: desinterés, prejuicios, sin feedback"]},
  {p:"¿Qué tipos de comunicación no verbal existen?", r:"La comunicación no verbal aporta el <b>60-70 % de la información</b>. Tipos: <b>kinesia</b> o kinésica (lenguaje corporal: gestos, sonrisa, mirada y movimientos), <b>paralingüística</b> (ritmo, volumen y tono de voz, que dependen de las emociones) y <b>proxémica</b> (distancia y espacio personal respecto al interlocutor).", k:["60-70 % de la información","kinesia: lenguaje corporal","paralingüística: la voz","proxémica: distancia"]}
 ], ejercicios:[
  {p:"Según las técnicas de buena comunicación, cada parte debe hablar entre el 20 % y el 80 % del tiempo. En una reunión de 50 minutos, ¿cuántos minutos como máximo debería hablar una sola parte?", r:40, dec:0, u:"minutos", pasos:["Máximo recomendado: el <b>80 %</b> del tiempo, para no acaparar.","50 × 0,80 = <b>40 minutos</b>.","(Y como mínimo el 20 %: 10 minutos.)"]},
  {p:"<b>Caso práctico.</b> En una reunión en Asia observas: (a) el cliente se toca la garganta; (b) apoya la mano bajo la barbilla; (c) se sienta hacia delante con las manos abiertas hacia arriba; (d) cruza los brazos tras tu oferta. ¿Qué indica cada señal?", pasos:["(a) <b>Nerviosismo e inseguridad</b>.","(b) <b>Autoconfianza</b>.","(c) <b>Proactividad y decisión</b>.","(d) Puede indicar que <b>está considerando la propuesta</b>.","Todo es <b>kinesia</b> (lenguaje corporal); conviene conocer también la cultura del país."]}
 ]},
 7:{cortas:[
  {p:"Diferencia entre traductor e intérprete.", r:"El <b>traductor</b> traduce palabras y <b>textos escritos</b> al idioma pedido: documentos y contratos (a veces bilingües). El <b>intérprete</b>, además de traducir, <b>da sentido a las frases dentro del contexto</b>: trabaja en reuniones, ferias y encuentros cara a cara como <b>mediador entre culturas</b>; mejor si está especializado en el sector.", k:["traductor: textos escritos","documentos y contratos","intérprete: da sentido en el contexto","reuniones, mediador entre culturas"]},
  {p:"¿Qué tipos de interpretación existen y dónde se usa cada una?", r:"<b>Simultánea</b>: traducción instantánea, a la par del discurso, en cabinas con micrófonos y auriculares (congresos, grandes reuniones). <b>Consecutiva</b>: tras la intervención del orador, tomando notas con abreviaturas y símbolos (conferencias, ruedas de prensa, tribunales). <b>Susurrada o chuchotage</b>: simultánea en voz muy baja al oído (reuniones muy reducidas sin cabina).", k:["simultánea: cabinas, congresos","consecutiva: notas, tribunales","susurrada/chuchotage: al oído, grupos pequeños"]},
  {p:"¿Qué partes tiene una carta comercial?", r:"<b>Encabezamiento</b>: datos de la empresa (nombre, dirección, teléfono, email) y <b>asunto</b>. <b>Cuerpo</b>: el motivo de la carta, en párrafos. <b>Cierre</b>: despedida, <b>firma, nombre y cargo</b>. Las comerciales son las que se envían entre comerciantes sobre sus negocios.", k:["encabezamiento: datos y asunto","cuerpo: motivo en párrafos","cierre: despedida, firma, nombre y cargo"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Elige el medio o la figura adecuada en cada caso: (a) traducir un contrato de distribución al alemán; (b) un congreso con 300 asistentes de 5 países; (c) una reunión de tres personas sin cabina; (d) comunicar a un distribuidor que rescindes el contrato con prueba de fecha y contenido; (e) asegurarte de que un cliente recibe un catálogo en papel.", pasos:["(a) <b>Traductor</b>: es un texto escrito.","(b) <b>Interpretación simultánea</b> en cabinas.","(c) <b>Interpretación susurrada (chuchotage)</b>.","(d) <b>Burofax</b>: acredita contenido, emisor y fecha (valor probatorio).","(e) <b>Carta certificada</b>: asegura la recepción, con seguimiento."]}
 ]}
});
ESTUDIO.extra("comercio", {
 1:{cortas:[
  {p:"Explica qué ocurre desde que escribes una dirección web hasta que ves la página.", r:"(1) Escribes el <b>dominio</b> en el navegador. (2) El <b>DNS</b> traduce el nombre al <b>número IP</b> del servidor. (3) El navegador envía una <b>petición con cabeceras</b> (navegador, hora, IP…). (4) El <b>servidor responde</b> y se descarga el <b>código HTML</b>. (5) El navegador lo <b>interpreta y muestra</b> la página. Si es <b>HTTPS</b>, los datos viajan cifrados (candado).", k:["dominio","DNS traduce a IP","petición con cabeceras","servidor responde con HTML","el navegador lo interpreta"]},
  {p:"Diferencia entre intranet y extranet, y entre servidor dedicado y compartido.", r:"La <b>intranet</b> es la red privada de la empresa a la que <b>solo acceden los empleados</b>; la <b>extranet</b> la amplía para que accedan también <b>personas de fuera relacionadas</b> con la empresa (clientes, proveedores). Un <b>servidor dedicado</b> es una máquina <b>solo para tu web</b>; en uno <b>compartido</b> hay <b>varias webs en el mismo servidor</b>, y es más barato.", k:["intranet: solo empleados","extranet: también clientes y proveedores","dedicado: solo tu web","compartido: varias webs, más barato"]},
  {p:"Diferencia entre un cliente de correo POP3 y el correo web.", r:"El <b>POP3</b> (Outlook, Thunderbird) es un <b>programa de escritorio</b> que <b>descarga los mensajes al ordenador</b> y no cifra por defecto. El <b>webmail</b> (Gmail, Yahoo, Outlook.com) se usa <b>desde el navegador</b>, <b>guarda copia en el servidor</b> y es más seguro y flexible, porque se abre desde cualquier dispositivo.", k:["POP3: programa de escritorio","descarga local","webmail: navegador","copia en el servidor","más seguro y flexible"]},
  {p:"¿Qué tipos de software hay según su licencia? Pon ejemplos.", r:"<b>Freeware</b>: gratuito (VLC, GIMP). <b>Privativo</b>: de pago, con licencia (Office, Photoshop). <b>Shareware</b>: se prueba gratis con <b>límite de tiempo o de funciones</b> (versiones trial). Para descargar con seguridad: la web oficial, Softpedia o Softonic.", k:["freeware: gratis (VLC, GIMP)","privativo: de pago (Office)","shareware: prueba limitada"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una agencia de viajes quiere (a) que sus empleados consulten los cuadrantes internos; (b) que los hoteles colaboradores actualicen su disponibilidad; (c) una web barata para empezar; (d) dejar de recibir correo basura de un remitente. ¿Qué solución propones para cada cosa?", pasos:["(a) <b>Intranet</b>: solo acceso interno.","(b) <b>Extranet</b>: acceso de externos vinculados a la empresa.","(c) <b>Servidor compartido</b>, más barato que uno dedicado, con <b>HTTPS</b>.","(d) <b>Bloquear al remitente</b>, marcar como spam y usar filtros."]}
 ]},
 2:{cortas:[
  {p:"¿Qué son los medios propios, pagados y ganados? Pon un ejemplo de cada uno.", r:"<b>Propios</b>: canales que <b>controla la marca</b> (su web, su blog). <b>Pagados</b>: <b>se paga por aparecer</b> (anuncios en Google o en redes). <b>Ganados</b>: <b>lo que otros dicen de ti</b> (recomendaciones, reseñas en Tripadvisor). Ojo: los perfiles en redes no son 100 % propios; los de Google+ desaparecieron al cerrar en 2019.", k:["propios: web, blog","pagados: anuncios","ganados: reseñas, recomendaciones","las redes no son 100 % propias"]},
  {p:"¿Qué formas de pago online existen y qué ventajas o inconvenientes tienen?", r:"<b>TPV virtual</b> (Redsys): tarjeta a través del banco. <b>PayPal</b>: muy sencillo, pero con comisiones más altas y no disponible en todos los países. <b>Transferencia</b>: sin comisión para la tienda, pero más lenta. <b>Contra reembolso</b>: se paga al recibir; suele tener mínimo, máximo y recargo. <b>Bizum</b>: pago móvil inmediato. <b>Tarjeta monedero</b>: prepago.", k:["TPV virtual","PayPal: sencillo pero caro","transferencia: lenta, sin comisión","contra reembolso: recargo","Bizum y tarjeta monedero"]},
  {p:"¿Cómo se compra con seguridad en internet?", r:"Comprobar que la web tiene <b>https y candado</b>; buscar <b>sellos de confianza</b> (VeriSign, Truste, Aenor) y <b>datos de contacto visibles</b>; pagar <b>mejor con tarjeta de crédito que de débito</b>; comprar en <b>webs conocidas</b>; usar <b>VPN en wifis públicas</b>. Para pedir ayuda: <b>INCIBE, teléfono 017</b>.", k:["https y candado","sellos de confianza","datos de contacto","crédito mejor que débito","VPN en wifi pública","INCIBE 017"]},
  {p:"¿Qué es la propuesta de valor y cómo se construye?", r:"Es lo que hace que el cliente te elija. Se construye en cinco pasos: (1) <b>audiencia</b>: ¿a quién me dirijo?; (2) <b>problema que resuelvo</b>; (3) <b>puntos fuertes</b>; (4) <b>beneficios para el cliente</b>; (5) <b>comunicarla de forma clara</b>. Osterwalder propone 9 cualidades de valor diferencial y Miguel Florido añade el <b>tiempo</b>.", k:["audiencia","problema que resuelvo","puntos fuertes","beneficios","comunicarla claro","Osterwalder / Florido"]}
 ], ejercicios:[
  {p:"Vendes un producto de 120 € con PayPal (5,40 % + 0,35 € por venta). ¿Cuánto dinero neto recibe la tienda?", r:113.17, dec:2, u:"€", pasos:["Comisión = 120 × 0,054 + 0,35 = 6,48 + 0,35 = 6,83 €.","Neto = 120 − 6,83 = <b>113,17 €</b>."]},
  {p:"Una tienda hace 200 ventas al mes de 25 € cobradas con PayPal (5,40 % + 0,35 €). ¿Cuánto paga en comisiones al mes?", r:340, dec:2, u:"€", pasos:["Comisión por venta = 25 × 0,054 + 0,35 = 1,35 + 0,35 = 1,70 €.","Al mes: 200 × 1,70 = <b>340 €</b>."]}
 ]},
 3:{cortas:[
  {p:"¿Qué son los objetivos SMART? Pon un ejemplo correcto y uno incorrecto.", r:"Son objetivos <b>Specific</b> (específicos), <b>Measurable</b> (medibles), <b>Achievable</b> (alcanzables), <b>Relevant</b> (relevantes) y <b>Time-bound</b> (con plazo). Correcto: «<b>Aumentar un 20 % las ventas online en Brasil en los próximos 6 meses</b>». Incorrecto: «<b>vender más</b>» (no es específico, ni medible, ni tiene plazo).", k:["específico","medible","alcanzable","relevante","con plazo","ejemplo «vender más» no es SMART"]},
  {p:"¿Cuáles son las partes del plan de marketing digital?", r:"(1) <b>Análisis de mercado y competencia</b> (DAFO); (2) <b>objetivos</b> (SMART); (3) <b>público objetivo</b>; (4) <b>canales</b>; (5) <b>contenido</b>; (6) <b>ejecución y seguimiento</b> (plan de acción con KPIs, responsables, plazos, recursos y prioridades); (7) <b>optimización</b>.", k:["análisis y DAFO","objetivos","público objetivo","canales","contenido","ejecución y seguimiento","optimización"]},
  {p:"Compara los modelos de marketing mix 4P, 4C y 7P.", r:"<b>4P</b>: producto, precio, distribución (place) y promoción. <b>4C</b>: lo mismo desde el cliente: <b>cliente, coste, conveniencia y comunicación</b>. <b>7P</b> (para servicios): las 4P + <b>procesos, personal y presentación física</b>. También existen las 5P (4P + people) y las 3P estratégicas (posicionamiento, propuesta de valor y público objetivo).", k:["4P: producto, precio, distribución, promoción","4C: cliente, coste, conveniencia, comunicación","7P: + procesos, personal, presentación física"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> ¿Son SMART estos objetivos? Corrige los que no lo sean: (a) «ser la mejor marca de zapatillas»; (b) «conseguir 5.000 seguidores en TikTok en México antes del 31 de marzo»; (c) «mejorar las ventas online».", pasos:["(a) <b>No</b>: no es medible ni tiene plazo. Ej.: «Ser top 3 en ventas online de zapatillas en Madrid en 12 meses».","(b) <b>Sí</b>: específico (TikTok México), medible (5.000), alcanzable, relevante y con plazo (31 de marzo).","(c) <b>No</b>: falta cuánto y cuándo. Ej.: «Aumentar un 15 % las ventas online en el próximo trimestre»."]}
 ]},
 4:{cortas:[
  {p:"¿Qué es el marketing de afiliación y quiénes son sus actores?", r:"Un <b>anunciante paga a un afiliado</b> (web, influencer, comparador…) <b>por los resultados</b> que le genera. Lo inventó <b>Jeff Bezos (Amazon) en 1996</b> y ha «democratizado» la publicidad digital. Actores (IAB y PMA): <b>anunciantes</b>, <b>afiliados o publishers</b>, <b>redes de afiliación</b> (plataformas, agencias) y <b>usuarios finales</b>.", k:["paga por resultados","Jeff Bezos, 1996","anunciantes","afiliados/publishers","redes de afiliación","usuarios"]},
  {p:"Explica los modelos de pago CPM, CPC, CPA, CPL y CPD.", r:"<b>CPM</b>: se paga cada <b>1.000 impresiones</b> (sobre todo branding). <b>CPC</b>: cada <b>clic</b> (tráfico). <b>CPA/CPV</b>: cada <b>acción o venta</b> (resultados). <b>CPL</b>: cada <b>lead</b>, es decir, registro o contacto (captación de datos). <b>CPD</b>: cada <b>descarga</b> (apps, documentos).", k:["CPM: mil impresiones, branding","CPC: clic","CPA: venta","CPL: lead","CPD: descarga"]},
  {p:"Diferencia entre lead masivo y lead cualificado.", r:"El lead <b>masivo o «frío»</b> es <b>barato</b> y de <b>gran volumen</b>, pero con poca intención de compra (Groupon, Rumbo). El lead <b>cualificado o «caliente»</b> es <b>más caro</b> pero tiene <b>alta intención de compra</b> (automoción, seguros, formación).", k:["masivo: frío, barato, volumen","cualificado: caliente, caro","alta intención de compra"]}
 ], ejercicios:[
  {p:"Una campaña CPM cuesta 6 € por mil impresiones y consigue 750.000 impresiones. ¿Cuál es su coste?", r:4500, dec:2, u:"€", pasos:["Coste = (impresiones ÷ 1.000) × precio CPM.","(750.000 ÷ 1.000) × 6 = 750 × 6 = <b>4.500 €</b>."]},
  {p:"Una tienda paga a sus afiliados 8 € por cada venta (CPA) y este mes consigue 120 ventas por afiliación. ¿Cuánto paga?", r:960, dec:2, u:"€", pasos:["Coste CPA = ventas × precio por venta.","120 × 8 = <b>960 €</b>."]},
  {p:"Un usuario compra 80 € a través de un cashback. La tienda paga al cashback un 15 % y este devuelve al usuario un 6 % de la compra. ¿Cuánto gana el cashback?", r:7.2, dec:2, u:"€", pasos:["El cashback se queda con 15 % − 6 % = 9 % de la venta.","80 × 0,09 = <b>7,20 €</b>.","(Cobra 12 € de la tienda y devuelve 4,80 € al usuario.)"]}
 ]},
 5:{cortas:[
  {p:"Diferencia entre la venta transaccional y la relacional. ¿Cuáles son las fases del marketing relacional?", r:"La <b>transaccional</b> (producto-precio) busca <b>conquistar</b> con una venta puntual. La <b>relacional</b> (venta consultiva) busca <b>retener</b> con una relación a largo plazo. Fases del marketing relacional: <b>atraer, vender, satisfacer y fidelizar</b>.", k:["transaccional: conquistar, venta puntual","relacional: retener, largo plazo","atraer, vender, satisfacer, fidelizar"]},
  {p:"¿Qué beneficios tiene fidelizar clientes?", r:"<b>Más unidades vendidas</b>, <b>mejores márgenes</b>, <b>menor coste de captación</b> (retener es más barato que captar), <b>venta cruzada</b> (cross selling), <b>recomendaciones</b> y mayor <b>Customer Life Time Value</b> (valor del cliente en el tiempo).", k:["más ventas","mejores márgenes","menor coste de captación","venta cruzada","recomendaciones","Customer Life Time Value"]},
  {p:"Diferencia entre programas de fidelidad y de recompensa, y entre e-fidelización 100 % digital y mixta.", r:"Los programas <b>de fidelidad</b> se basan en el <b>consumo puro y los puntos</b> (Repsol); los <b>de recompensa</b> buscan una <b>implicación emocional</b> (Fnac). La e-fidelización <b>100 % digital</b> es la de empresas solo online (Amazon, eDreams); la <b>mixta</b> combina online y tienda (MediaMarkt, Mercadona, app de Lidl).", k:["fidelidad: puntos (Repsol)","recompensa: emocional (Fnac)","100 % digital: Amazon","mixta: online + tienda (Lidl)"]}
 ], ejercicios:[
  {p:"Una academia empieza el curso con 800 alumnos y pierde 120 durante el año. ¿Cuál es su tasa de deserción?", r:15, dec:2, u:"%", pasos:["Tasa de deserción = clientes perdidos ÷ clientes iniciales × 100.","120 ÷ 800 × 100 = <b>15 %</b>.","Su tasa de retención es 100 − 15 = 85 %."]}

 6:{cortas:[
