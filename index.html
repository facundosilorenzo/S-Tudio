  {p:"¿Qué funciones tienen las instituciones del Sistema Financiero Internacional?", r:"Ningún país debe decidir de forma unilateral: se busca el consenso, liderado por grandes instituciones que dan financiación para mantener la estabilidad. Funciones: A) actúan como <b>reguladores, supervisores y controladores</b> del sistema crediticio, fianzas y garantías; B) <b>definen las políticas bancarias y financieras</b> extranjeras; C) <b>definen y ejecutan las políticas de valores y seguros</b>. <b>FMI</b>: estabilidad financiera y cooperación monetaria, facilitar el comercio, crecimiento sostenible y reducir la pobreza. <b>Banco Mundial</b>: reducir la pobreza, desarrollo del sector privado, inversión en países en desarrollo, arbitraje de inversiones. <b>BEI</b>: financia proyectos que contribuyen a los objetivos de la UE.", k:["reguladores y supervisores","políticas bancarias y financieras","políticas de valores y seguros","FMI","Banco Mundial","BEI"]},
  {p:"¿Cómo presta dinero el FMI a un país?", r:"Con los recursos que aportan los países miembros. El país que necesita equilibrar su <b>balanza de pagos</b> <b>compra al FMI, con su propia moneda, Derechos Especiales de Giro (DEG)</b>, una divisa internacional creada por el FMI. Usa los DEG para financiar el déficit o sus reservas y después <b>devuelve el préstamo recomprando en su moneda</b> la misma cantidad.", k:["aportaciones de los miembros","balanza de pagos","compra DEG con su moneda","recompra para devolver"]},
  {p:"¿Qué requisitos pide el Banco Mundial para conceder un préstamo y cómo financia el BEI a las pymes?", r:"<b>Banco Mundial</b>: presta sobre todo para <b>infraestructura productiva</b>. El solicitante debe ser <b>socio del BM y del FMI</b>; el proyecto debe ser <b>rentable técnica y económicamente</b>, <b>prioritario</b> para el desarrollo del país y no ser una carga excesiva para su economía. <b>BEI</b>: financia a las pymes mediante <b>capital riesgo</b> e instrumentos de financiación del riesgo (<b>microfinanciación y garantías</b> para créditos de entidades financieras); se contacta por correo, oficinas o el formulario de su web, con documentación suficiente.", k:["BM: socio del BM y del FMI","rentable y prioritario","BEI: capital riesgo","microfinanciación y garantías"]},
  {p:"¿Qué es el crowdfunding y cómo funciona una campaña?", r:"Fuente de financiación <b>alternativa y complementaria</b> a la banca, con gran impacto internacional. Se elabora un <b>plan de negocio</b> por fases y se envía a una <b>plataforma</b> (p. ej. Crowd Thinking), que decide si lanza una <b>campaña online</b> con un <b>importe objetivo y un plazo</b>. Si no se alcanza el objetivo, <b>se devuelve el dinero</b> a los mecenas; si se alcanza, se transfiere a los emprendedores <b>menos una comisión</b>. Ejemplo: <b>Pebble 2</b>, que pedía 1 millón de $ y logró casi 13 millones en 37 días con más de 65.000 mecenas.", k:["alternativa a la banca","plan de negocio","plataforma y campaña online","objetivo y plazo","si no se llega se devuelve","comisión","Pebble 2"]}
 ],

3: {
 examen: ["3. Euromercados: concepto y cómo funcionan", "5. Riesgos (y ventajas) de operar con euromercados", "7. Mercado de divisas o FOREX"],
 cortas: [
  {p:"¿Qué son los euromercados y cómo funcionan?", r:"Mercados que <b>no operan solo en Europa</b> y usan instrumentos en <b>divisas distintas a las del país donde se ubican</b> (ej.: un euro prestado en Suecia). Así <b>eluden las leyes y políticas de los gobiernos</b> y no están sujetos a regulaciones como las restricciones de tipos de interés: abaratan la financiación y cubren el riesgo de cambio. Operan en el <b>mercado de valores</b> (<b>eurobonos</b>: obligaciones de empresas y deuda de gobiernos) y en el <b>mercado monetario</b> (<b>eurodólares</b>: operaciones interbancarias, depósitos y préstamos). Participan bancos centrales, bancos, grandes empresas y particulares, normalmente <b>no residentes</b>. Hoy se prefiere el término <b>Mercados Internacionales de Capitales</b>.", k:["divisa distinta a la del país","eluden regulación","eurobonos (valores)","eurodólares (monetario)","no residentes","Mercados Internacionales de Capitales"]},
  {p:"¿Qué riesgos y ventajas tiene operar en los euromercados?", r:"<b>Riesgos</b>: control de capitales y <b>mayor riesgo de crédito</b> que en un banco; <b>riesgo de tipo de cambio</b>; <b>inflación</b> en algunos casos; <b>baja disciplina presupuestaria</b> en algunos países (es muy fácil acudir a ellos); <b>volatilidad</b> por la especulación. <b>Ventajas</b>: no hay depósitos no remunerados (no hay importe mínimo), casi sin costes de gestión del riesgo, costes administrativos y de personal bajos, <b>no pagan impuestos</b> y no se pagan agencias de calificación.", k:["riesgo de crédito y control de capitales","tipo de cambio","inflación","baja disciplina presupuestaria","volatilidad","ventajas: sin impuestos, costes bajos"]},
  {p:"¿Qué es el FOREX y cuáles son sus características?", r:"Mercado de divisas (<b>Foreign Exchange</b>) donde se fija el valor de las monedas para las transacciones internacionales. Es <b>mundial y descentralizado</b>: hay mercado siempre que oferentes y demandantes acuerden un precio. Es <b>mayorista</b> (entidades de crédito e inversores institucionales) y opera <b>24 horas, 5 días a la semana</b>. Características: <b>eficiencia</b> (la información llega rápido a todos), <b>homogeneidad</b> (siempre la divisa), <b>transparencia</b> (muchos oferentes y demandantes), <b>perfección</b> y enorme volumen diario. Participantes <b>directos</b> (bancos centrales, entidades financieras, brokers, empresas internacionales) e <b>indirectos</b> (inversores institucionales y particulares).", k:["Foreign Exchange","descentralizado","mayorista","24 h, 5 días","eficiencia, homogeneidad, transparencia, perfección","participantes directos e indirectos"]}
 ],
 test: [
  {p:"Un euro prestado en Suecia es un ejemplo de…", o:["Euromercado","Mercado nacional regulado","Crowdfunding","Seguro de cambio"], c:0, e:"Divisa distinta a la del país donde se opera."},
  {p:"En el mercado de valores, los euromercados operan con…", o:["Eurobonos","Eurodólares","DEG","Pagarés de empresa nacionales"], c:0, e:"En el mercado monetario, con eurodólares."},
  {p:"Hoy se tiende a sustituir el término «euromercado» por…", o:["Mercados Internacionales de Capitales","Mercado Único Europeo","Eurozona","FOREX"], c:0, e:"Porque puede hacer pensar que es solo de Europa o en euros."},
  {p:"¿Cuál es un RIESGO de operar en euromercados?", o:["Volatilidad por la especulación","Pagar muchos impuestos","Costes de personal muy altos","Pagar agencias de calificación"], c:0, e:"Lo demás son ventajas al revés: no pagan impuestos, costes bajos…"},
  {p:"¿Cuál es una VENTAJA de los euromercados?", o:["No pagan impuestos","Menor riesgo de crédito que un banco","No tienen riesgo de cambio","Mucha disciplina presupuestaria"], c:0, e:"También costes administrativos bajos y sin importe mínimo."},
  {p:"El FOREX opera…", o:["24 horas al día, 5 días a la semana","Solo en horario bancario español","Una vez al mes","Solo los fines de semana"], c:0, e:"Es mundial y descentralizado."},
  {p:"La característica del FOREX de que siempre se negocia el mismo elemento (la divisa) es la…", o:["Homogeneidad","Transparencia","Eficiencia","Perfección"], c:0, e:"Eficiencia = información rápida; transparencia = muchos oferentes y demandantes."}
 ]
},
4: {
 examen: ["2. Tipos de divisas (y el tipo de cambio)", "5. Tipos de transacciones en el FOREX", "8. Mercado a plazo o forward"],
 cortas: [
  {p:"¿Qué tipos de divisas existen? Pon un ejemplo de cada una.", r:"<b>Convertible</b>: se intercambia sin restricciones (dólar USD). <b>No convertible</b>: no aceptada en el mercado internacional (el apunte pone el peso chileno). <b>Bilateral</b>: usada por varios países en un convenio para liquidar operaciones. <b>Exótica</b>: sin amplio mercado internacional (real brasileño; yuan chino, que sí es convertible). <b>Fuerte</b>: estable, sin grandes fluctuaciones por inflación (euro).", k:["convertible (USD)","no convertible","bilateral","exótica (real, yuan)","fuerte (euro)"]},
  {p:"¿Qué es el tipo de cambio y cómo se lee EUR/USD 1,14?", r:"Es el <b>número de unidades de una moneda que se cambian por una unidad de otra</b>. Las monedas se nombran con 3 letras y los pares con 6: las 3 primeras son la <b>moneda base</b> y las 3 últimas la <b>cotizada</b>. EUR/USD 1,14 significa que <b>1 euro cotiza a 1,14 dólares</b>. El tipo de cambio es doble: hay un precio comprador y otro vendedor.", k:["unidades de una moneda por una de otra","base / cotizada","1 € = 1,14 $","precio comprador y vendedor"]},
  {p:"¿Qué tipos de transacciones hay en el FOREX?", r:"Principales: <b>al contado o spot</b> (se liquidan en <b>no más de dos días hábiles</b>) y <b>a plazo o forward</b> (se acuerda hoy y se ejecuta en una fecha futura fijada en contrato, de obligado cumplimiento; son las más comunes). Otras: <b>futuros</b> (plazo con contrato <b>estandarizado</b>), <b>opciones</b> (derivado: se adquiere el <b>derecho pero no la obligación</b> de comprar o vender) y <b>swaps</b> (comprar una divisa al contado y venderla a plazo a la vez, o al revés).", k:["spot: ≤ 2 días hábiles","forward: fecha futura, obligatorio","futuros: estandarizado","opciones: derecho, no obligación","swaps: contado + plazo"]},
  {p:"Explica el mercado a plazo (forward), el premio y el descuento.", r:"La compraventa se acuerda al contratar, pero se ejecuta en una <b>fecha futura, más allá de dos días hábiles</b>. El tipo forward depende del <b>tipo spot y del diferencial de tipos de interés</b> de las dos divisas, por eso rara vez coincide con el spot. El cliente pide cotización a su banco, la acepta y firma; el banco contacta dos días hábiles antes del vencimiento. Una divisa cotiza con <b>premio</b> si vale más a plazo que al contado, y con <b>descuento</b> si vale menos. Para obtener el forward, <b>los premios se suman</b> al tipo spot y <b>los descuentos se restan</b>.", k:["fecha futura (> 2 días hábiles)","spot + diferencial de intereses","premio: se suma","descuento: se resta"]}
 ],

 ]
},
5: {
 examen: ["3. Tipos de riesgo en el comercio internacional", "4. Métodos de reducción del riesgo", "5. El crédito documentario"],
 cortas: [
  {p:"¿Qué tipos de riesgo hay en el comercio internacional?", r:"<b>Riesgos comerciales</b>, ligados al entorno del negocio: impagos, aparición de un producto de la competencia, problemas de suministro, fraude, problemas de transporte (influyen volumen, relación con el cliente, plazos, solvencia…). <b>Riesgos financieros</b>, ligados a cambios en las condiciones financieras: <b>tipo de cambio</b> (el principal), <b>de crédito</b> (impago o demora), <b>contractual</b> (cambios en bonificaciones, descuentos o impuestos), <b>de tipo de interés</b>, <b>riesgo país</b> (cambio de gobierno o falta de divisas) y <b>documentario</b> (confiscación de mercancías o documentos mal hechos).", k:["comerciales: impago, competencia, suministro, fraude, transporte","financieros: cambio, crédito, contractual, interés, país, documentario"]},
  {p:"¿Cómo se reduce cada riesgo? Relaciona riesgo y solución.", r:"<b>Impago</b> → seguro de crédito a la exportación. <b>Problemas de suministro</b> → tener más de un proveedor. <b>Fraude</b> → informes de empresas especializadas. <b>Insolvencia del comprador</b> → crédito documentario irrevocable. <b>Transporte</b> → aval bancario de cumplimiento. <b>Fiscales</b> → conocer bien la legislación, beneficios y exenciones. <b>Transferencias</b> (el gobierno congela la salida de dinero) → aseguradoras que cubren ese riesgo.", k:["impago → seguro de crédito","suministro → varios proveedores","fraude → informes","insolvencia → crédito documentario irrevocable","transporte → aval de cumplimiento","transferencias → aseguradoras"]},
  {p:"¿Qué es el crédito documentario y cómo funciona?", r:"Es un <b>mandato de pago</b> que el importador da a su banco para que, directamente o a través de otro banco, <b>pague al exportador</b> siempre que este cumpla al pie de la letra las condiciones. Funciones: <b>garantía, pago y financiación</b>. Pasos: 1) contrato de compraventa con las condiciones del crédito; 2) el importador pide la apertura a su banco (<b>banco emisor</b>); 3) el emisor lo aprueba y lo comunica a un banco del país del exportador (<b>banco avisador</b>); 4) el avisador notifica al exportador, que envía la mercancía; 5) el exportador presenta los documentos al avisador; 6) si todo está conforme, el avisador paga y envía los documentos al emisor, que le reembolsa; 7) el importador paga a su banco y con los documentos retira la mercancía.", k:["mandato de pago","garantía, pago y financiación","banco emisor (importador)","banco avisador (exportador)","pago contra documentos conformes"]}
 ],
 test: [
  {p:"La aparición de un producto de la competencia es un riesgo…", o:["Comercial","Financiero","Documentario","De tipo de interés"], c:0, e:"Los comerciales están ligados al entorno del negocio."},
  {p:"La confiscación de mercancías o los documentos de embarque mal hechos son riesgo…", o:["Documentario","País","Contractual","De crédito"], c:0, e:"Es un riesgo financiero de tipo documentario."},
  {p:"Un cambio de gobierno o la falta de divisas en el país del comprador es riesgo…", o:["País","Comercial","Contractual","De suministro"], c:0, e:"Riesgo financiero."},

  {p:"Para el riesgo de insolvencia del comprador, el tema recomienda…", o:["Un crédito documentario irrevocable","Un swap","Tener más proveedores","Una VPN"], c:0, e:"Garantiza el pago si se cumplen las condiciones."},
  {p:"Contra los problemas de suministro conviene…", o:["Tener más de un proveedor en cartera","Contratar un seguro de cambio","Pedir un DEG","Abrir un crédito documentario"], c:0, e:"Diversificar proveedores."},
  {p:"En el crédito documentario, el banco del importador se llama…", o:["Banco emisor","Banco avisador","Banco confirmador obligatorio","Banco central"], c:0, e:"El del país del exportador es el avisador."},
  {p:"¿Cuáles son las tres funciones del crédito documentario?", o:["Garantía, pago y financiación","Seguro, transporte y aduana","Ahorro, inversión y crédito","Control, auditoría y fiscalidad"], c:0, e:"Así aparece en los apuntes."}
 ]
},
6: {
 examen: ["2. El seguro de cambio: concepto y consecuencias", "8. SWIFT (código SWIFT / BIC)"],
 cortas: [
  {p:"¿Qué es el seguro de cambio y qué características tiene?", r:"Es un <b>acuerdo en firme, de obligado cumplimiento</b> (no opcional), por el que dos partes intercambian una cantidad de divisas a un <b>precio determinado en una fecha futura</b>. Son operaciones <b>a medida</b>, flexibles, con vencimientos normalmente múltiplos de mes. <b>No es un seguro que solo actúe si el cambio es desfavorable</b>: fija el tipo de cambio en el futuro. Se contrata con un banco, que exige un <b>depósito de garantía</b> (porcentaje del nominal). Es sencillo, <b>sin prima</b>, pero con comisiones.", k:["acuerdo en firme, obligatorio","precio y fecha futura fijados","a medida","no solo si es desfavorable","depósito de garantía","sin prima, con comisiones"]},
  {p:"Diferencia entre el seguro de cambio de importación y el de exportación.", r:"<b>De importación</b>: compromiso de <b>compra</b> de la divisa en fecha y tipo pactados; evita el riesgo de <b>apreciación</b> de la divisa y fija de antemano el precio de compra. <b>De exportación</b>: compromiso de <b>venta</b> de la divisa en fecha y tipo pactados; evita el riesgo de <b>depreciación</b> y fija el precio de venta. Ambos son sencillos, sin prima y con comisiones.", k:["importación: compra, evita apreciación","exportación: venta, evita depreciación"]},
  {p:"¿Qué es el SWIFT y qué objetivos tiene?", r:"<b>Society for Worldwide Interbank Financial Telecommunication</b>: sistema de <b>mensajes entre entidades financieras</b> para órdenes de pago, créditos documentarios, remesas, valores… Objetivos: <b>confianza</b> (quien lo usa está autorizado), <b>confidencialidad</b> (solo personas autorizadas), <b>disponibilidad</b> (accesible cuando se necesita) e <b>integridad</b> (información válida, precisa y completa). Así se estandarizan procesos, se evitan errores de interpretación, aumenta la seguridad y la información viaja muy rápido.", k:["mensajes entre entidades financieras","confianza","confidencialidad","disponibilidad","integridad"]},
  {p:"¿Cómo se lee un código SWIFT (BIC)? Usa el ejemplo BBVAESMM.", r:"El código SWIFT también se llama <b>BIC (Bank Identifier Code)</b>. En <b>BBVAESMM</b>: los <b>4 primeros</b> caracteres identifican al <b>banco</b> (BBVA), los <b>2 siguientes</b> al <b>país</b> (ES) y los <b>2 últimos</b> a la <b>localidad</b> (MM). Se pueden añadir <b>3 más</b> para la <b>sucursal</b>. Los mensajes se agrupan por su primer dígito: <b>MT110</b> es un aviso de cheque (transferencias de clientes y cheques) y <b>MT400</b> un aviso de pago de una remesa (remesas documentarias).", k:["BIC","4 banco + 2 país + 2 localidad","+3 sucursal","MT110","MT400"]}
 ],
 test: [
  {p:"El seguro de cambio es un contrato…", o:["En firme, de obligado cumplimiento","Opcional, que solo se ejerce si conviene","Que solo actúa si el cambio es desfavorable","Con pago de prima obligatoria"], c:0, e:"Fija el tipo de cambio en una fecha futura."},

  {p:"¿Cuál NO es un objetivo del SWIFT?", o:["Rentabilidad","Confidencialidad","Disponibilidad","Integridad"], c:0, e:"Los cuatro: confianza, confidencialidad, disponibilidad e integridad."},

 ]

 cortas: [
  {p:"¿Qué tipos de objetivos empresariales existen?", r:"<b>Misión y visión</b>: la razón de ser de la empresa; responde a qué producir, cómo producir y para quién producir. <b>Objetivos generales</b>: metas a medio y largo plazo; deben ser realistas, claros y medibles. <b>Objetivos operativos</b>: ayudan a conseguir los generales, en concordancia con la misión.", k:["misión y visión","qué, cómo y para quién producir","generales a medio y largo plazo","operativos"]},
  {p:"Explica las características de la empresa como sistema.", r:"Es un <b>sistema global</b>: un cambio en un elemento afecta a los demás. La <b>combinación organizada de recursos</b> da mejores resultados que usarlos por separado. Es un <b>sistema abierto</b> al entorno económico, social, político y cultural, sobre el que influye y por el que es influida. Persigue <b>objetivos comunes</b> a todos sus miembros. Transforma <b>entradas (inputs) en salidas (outputs)</b>.", k:["sistema global","combinación organizada de recursos","sistema abierto al entorno","objetivos comunes","inputs → outputs"]},
  {p:"¿Cuáles son las funciones básicas de la empresa y quién las describió?", r:"Las describió por primera vez el ingeniero <b>Henri Fayol</b> en 1916 (<i>L'Administration industrielle et générale</i>). Son: <b>planificación, organización, dirección y control</b>.", k:["Henri Fayol","1916","planificación","organización","dirección","control"]},
  {p:"Enumera las áreas de actividad de la empresa (función de organización) y qué hace cada una.", r:"<b>Financiera</b>: consigue los recursos financieros y decide cómo emplearlos. <b>Aprovisionamiento</b>: obtiene los recursos materiales. <b>Producción</b>: depende de la actividad (comprar productos, externalizar la producción o prestar servicios). <b>RRHH</b>: cubre las necesidades de personal y gestiona la plantilla. <b>Marketing</b>: mejora la posición competitiva y ofrece soluciones a los clientes.", k:["financiera","aprovisionamiento","producción","recursos humanos","marketing"]},
  {p:"Diferencia entre entorno general y entorno específico de la empresa, con ejemplos.", r:"<b>Entorno general (macroentorno)</b>: factores que la empresa no puede controlar directamente pero le afectan: demográficos, económicos, tecnológicos, políticos, legislativos, internacionales. Fuentes de información: INE, Eurostat, Registro Mercantil. <b>Entorno específico (microentorno)</b>: factores del mercado en el que actúa, que le afectan directamente y sobre los que puede actuar: <b>proveedores, clientes y competencia</b>.", k:["general: no controlable","demográficos, económicos, tecnológicos, políticos…","específico: le afecta directamente","proveedores, clientes, competencia"]},
  {p:"¿Para qué sirve el análisis del entorno y por qué es especialmente importante para una pyme?", r:"Permite <b>detectar a tiempo oportunidades y amenazas</b> (aprovechar unas y evitar o reducir las otras) e <b>identificar actuaciones para adaptarse o anticiparse</b> a los cambios. En la pyme es aún más importante porque no tiene la imagen de marca ni la inercia de mercado de las grandes empresas.", k:["oportunidades y amenazas","adaptarse o anticiparse","la pyme no tiene imagen de marca"]},
  {p:"Define la responsabilidad social empresarial (RSE).", r:"Conjunto de <b>obligaciones y compromisos legales y éticos</b> derivados del impacto de la actividad de la empresa en el ámbito económico, social, laboral o medioambiental. El <b>Libro Verde de la Comisión Europea</b> la define como la <b>integración voluntaria</b> por parte de las empresas de las preocupaciones sociales y medioambientales en sus operaciones comerciales y en sus relaciones con sus interlocutores.", k:["obligaciones legales y éticas","impacto económico, social, laboral, medioambiental","Libro Verde","integración voluntaria"]}

  {p:"Los objetivos que marcan metas a medio y largo plazo y deben ser realistas, claros y medibles son los…", o:["Objetivos generales","Objetivos operativos","Objetivos de misión","Objetivos diarios"], c:0, e:"Los operativos ayudan a conseguir los generales."},
  {p:"Que un cambio en un elemento de la empresa afecte a todos los demás significa que la empresa es un sistema…", o:["Global","Cerrado","Independiente","Estático"], c:0, e:"Es una de las características de la empresa como sistema."},
  {p:"La empresa transforma entradas en salidas. En inglés se llaman…", o:["Inputs y outputs","Assets y liabilities","Leads y sales","Costs y profits"], c:0, e:"Inputs (entradas) → actuación empresarial → outputs (salidas)."},
  {p:"¿Quién describió por primera vez las funciones básicas de la empresa y cuándo?", o:["Henri Fayol, en 1916","Adam Smith, en 1776","Frederick Taylor, en 1950","Philip Kotler, en 1967"], c:0, e:"En L'Administration industrielle et générale (París, 1916)."},
  {p:"¿Cuál NO es una de las cuatro funciones básicas de la empresa?", o:["Financiación","Planificación","Dirección","Control"], c:0, e:"Las cuatro son planificación, organización, dirección y control. Lo financiero es un área de actividad."},
  {p:"El área que se encarga de obtener los recursos materiales para la actividad es…", o:["Aprovisionamiento","Marketing","Recursos humanos","Financiera"], c:0, e:"La financiera consigue el dinero; aprovisionamiento, los materiales."},

  {p:"Proveedores, clientes y competencia forman parte del…", o:["Entorno específico o microentorno","Entorno general","Entorno político","Entorno demográfico"], c:0, e:"Le afectan directamente y la empresa puede actuar ante ellos."},

 ]

 cortas: [
  {p:"Define empresario y explica los dos aspectos que se deducen de esa definición.", r:"Es la <b>persona o grupo de personas que delimita los objetivos de la empresa y organiza los factores productivos</b> para cumplirlos. 1) <b>No tiene por qué ser el propietario</b> (la propiedad está separada del control, sobre todo en las grandes empresas) ni una sola persona. 2) Su función más característica es la de <b>emprendedor</b>, aunque también ejerce liderazgo, organización y dirección.", k:["fija objetivos y organiza los factores productivos","no tiene que ser el propietario","propiedad separada del control","función emprendedora"]},
  {p:"¿Cuáles son las funciones del empresario?", r:"<b>Fija objetivos</b> (cualitativos y cuantitativos). <b>Organiza y coordina</b> la empresa y a sus empleados, delegando tareas. <b>Escoge los recursos</b> que mejor cumplen los objetivos. <b>Asume el riesgo</b> de sus decisiones y traza líneas de actuación. <b>Evalúa</b> las acciones realizadas.", k:["fija objetivos","organiza y coordina","escoge recursos","asume el riesgo","evalúa"]},
  {p:"¿Qué cualidades definen el perfil del empresario? Pon ejemplos.", r:"<b>Cualidades personales o actitudes</b>: liderazgo, pasión, autoconfianza, templanza, empatía, buen comunicador, implicación con la sociedad. <b>Cualidades profesionales o aptitudes</b>: conocimientos especializados, técnicas de gestión, idiomas, informática, conocimientos financieros, marketing, habilidades resolutivas. <b>Cualidades éticas o filosóficas</b>: novedad en las escuelas de negocios tras las crisis, buscan un perfil más humano.", k:["actitudes (personales)","aptitudes (profesionales)","cualidades éticas","ejemplos de cada una"]},
  {p:"¿Qué es el capital humano de la empresa y qué grupos lo forman?", r:"Es el <b>equipo humano organizado</b> que lleva a cabo la actividad productiva con los medios disponibles: sin él los demás elementos no sirven. Además del empresario (dueño), están los <b>directivos</b>, que organizan y dirigen las actividades, y los <b>trabajadores</b>, que no tienen funciones directivas pero sí cierta autonomía en su trabajo.", k:["equipo humano organizado","directivos","trabajadores"]},
  {p:"¿Qué es el plan de empresa y para qué sirve?", r:"Es el <b>documento que refleja el proyecto empresarial</b>: explica la idea y cómo ponerla en marcha. Debe ser claro, sencillo, con datos actualizados e incluir todas las áreas. Sirve al empresario y a otros usuarios: <b>posibles accionistas, buscar financiación</b>, fijar objetivos, servir de guía, conseguir clientes y proveedores y <b>controlar resultados</b>. Conviene tener una versión completa y otra resumida.", k:["documento del proyecto empresarial","idea y puesta en marcha","financiación / accionistas","guía y control"]},
  {p:"Enumera el contenido del plan de empresa.", r:"A) <b>Introducción</b> (misión, visión, objetivos, descripción). B) <b>Plan de marketing</b> (DAFO, estrategias, producto, precio, distribución, comunicación). C) <b>Plan de organización</b> (cómo se produce o presta el servicio, proveedores, perfil de empleados). D) <b>Aspectos jurídicos y fiscales</b>. E) <b>Plan económico-financiero</b> (de dónde salen los recursos). F) <b>Plan de contingencias</b>. G) <b>Calendario de implantación</b>.", k:["introducción","marketing","organización","jurídico-fiscal","económico-financiero","contingencias","calendario"]}

 ]
},
3: {
 examen: ["2. El empresario individual (características, responsabilidad…)", "6-8. Sociedades capitalistas: SA, SL y comanditaria por acciones", "11. Sociedad laboral y sociedad cooperativa"],
 cortas: [
  {p:"Características del empresario individual.", r:"Es el <b>único socio</b> y responsable del negocio. Tiene <b>responsabilidad ilimitada</b>: responde con <b>todo su patrimonio</b> (no se distingue el de la empresa del personal), con excepciones si está casado. <b>No hay capital mínimo</b>. Requisitos: <b>capacidad legal</b>, ejercer la actividad <b>habitualmente y por cuenta propia</b>, y <b>en nombre propio</b>. Ventaja: <b>libertad de acción</b> y rapidez en las decisiones; riesgo: asume solo las decisiones erróneas.", k:["único socio","responsabilidad ilimitada / todo su patrimonio","sin capital mínimo","3 requisitos","libertad de acción"]},
  {p:"Características de la sociedad anónima.", r:"Capital dividido en <b>acciones</b>; adecuada para grandes inversiones. Responsabilidad <b>limitada</b>. Mínimo <b>1 socio</b>. Capital mínimo <b>60.000 €</b> (en la constitución basta desembolsar el <b>25 %</b>). Denominación «Sociedad anónima» o SA. Acciones de <b>libre transmisión</b> (salvo derecho preferente). Derechos del accionista: participar en beneficios, voto en la junta, preferencia en nuevas acciones e información. Órganos: <b>junta general de accionistas</b> (una vez al año, voto proporcional) y <b>órgano de administración</b>.", k:["acciones","limitada","1 socio","60.000 € (25 %)","libre transmisión","junta y órgano de administración"]},
  {p:"Características de la sociedad limitada.", r:"Capital dividido en <b>participaciones</b>. Responsabilidad <b>limitada</b>. Mínimo <b>1 socio</b>. Capital mínimo <b>1 €</b> con dos condiciones: destinar al menos el <b>20 % del beneficio a reserva legal</b> hasta que reserva + capital sumen <b>3.000 €</b>, y en liquidación los socios responden <b>solidariamente</b> de la diferencia hasta 3.000 €. Denominación SL o SRL. Transmisión <b>limitada</b> (derecho preferente de los socios). Órganos: <b>junta general</b> y <b>órgano de administración</b>.", k:["participaciones","limitada","1 socio","1 € + condiciones (20 % reserva, 3.000 €)","transmisión limitada"]},
  {p:"Características de la sociedad comanditaria por acciones.", r:"Capital en acciones con dos tipos de socios: <b>colectivos</b>, que administran y responden <b>ilimitadamente</b>, y <b>comanditarios</b>, con responsabilidad <b>limitada</b>. Mínimo <b>2 socios</b> (uno de cada tipo). Capital mínimo <b>60.000 €</b>. Denominación: nombre de los socios colectivos + «S. Com. p. A.». Transmisión: con consentimiento del resto de socios.", k:["socios colectivos (ilimitada) y comanditarios (limitada)","2 socios","60.000 €","S. Com. p. A."]},
  {p:"Características de la sociedad laboral.", r:"La <b>mayoría del capital</b> debe pertenecer a <b>trabajadores</b> que prestan servicios retribuidos, de forma personal y directa y por tiempo indefinido. Responsabilidad <b>limitada</b>. Mínimo <b>2 socios</b>. Capital mínimo: <b>3.000 €</b> (sociedad limitada laboral) o <b>60.000 €</b> (sociedad anónima laboral, SAL).", k:["mayoría del capital de los trabajadores","limitada","2 socios","3.000 € SLL / 60.000 € SAL"]},
  {p:"Características de la sociedad cooperativa.", r:"Funcionamiento <b>democrático</b>: <b>un socio, un voto</b>, sea cual sea su aportación. De primer grado (personas físicas o jurídicas), segundo grado (cooperativas de primer grado) o tercer grado. Responsabilidad <b>limitada</b>. Mínimo <b>3 socios</b> en las de primer grado y <b>2</b> en las de segundo. Capital mínimo <b>fijado en los estatutos</b>. Denominación «Sociedad cooperativa» o «S. Coop.». La propiedad <b>no se puede transmitir</b>.", k:["un socio, un voto","grados","limitada","3 socios (1.er grado) / 2 (2.º)","capital en estatutos","no transmisible"]}
 ],
 test: [
  {p:"El empresario individual responde de las deudas…", o:["Con todo su patrimonio (responsabilidad ilimitada)","Solo con el capital aportado","Solo con los bienes de la empresa","No responde"], c:0, e:"No hay distinción entre el patrimonio de la empresa y el suyo."},
  {p:"¿Cuál es el capital mínimo del empresario individual?", o:["No existe capital mínimo","3.000 €","60.000 €","1 €"], c:0, e:"Depende de la voluntad y capacidad del empresario."},
  {p:"¿Cuál NO es un requisito del empresario individual?", o:["Tener al menos dos socios","Capacidad legal","Ejercer de forma habitual y por cuenta propia","Actuar en nombre propio"], c:0, e:"Es el único socio."},
  {p:"La característica más reseñable del empresario individual es…", o:["Su libertad de acción","Su responsabilidad limitada","Su capital mínimo elevado","Que decide en junta"], c:0, e:"Decide solo y rápido, pero asume solo los errores."},
  {p:"El capital mínimo de una sociedad anónima es…", o:["60.000 €, desembolsando al menos el 25 % al constituirla","3.000 € íntegros","1 €","No tiene"], c:0, e:"Tabla de la SA."},
  {p:"¿Cuántos socios necesita como mínimo una sociedad anónima?", o:["Uno","Dos","Tres","Cinco"], c:0, e:"Puede ser unipersonal."},
  {p:"¿Cuál NO es un derecho del accionista de una SA?", o:["Cobrar un sueldo fijo de la empresa","Participar en los beneficios","Votar en la junta general","Adquirir preferentemente nuevas acciones"], c:0, e:"Derechos: beneficios, voto, preferencia e información."},
  {p:"En la sociedad limitada el capital se divide en…", o:["Participaciones","Acciones","Obligaciones","Bonos"], c:0, e:"La SA se divide en acciones."},
  {p:"La SL con capital inferior a 3.000 € debe destinar a reserva legal al menos…", o:["El 20 % del beneficio","El 5 % del beneficio","El 50 % del beneficio","Nada"], c:0, e:"Hasta que reserva + capital sumen 3.000 €."},
  {p:"En la sociedad comanditaria por acciones, el socio que administra y responde personalmente de las deudas es el…", o:["Socio colectivo","Socio comanditario","Accionista minoritario","Socio cooperativista"], c:0, e:"El comanditario tiene responsabilidad limitada."},
  {p:"En la sociedad laboral, la mayoría del capital debe pertenecer a…", o:["Trabajadores con contrato indefinido que prestan servicios en ella","Bancos","Un solo socio capitalista","La Administración"], c:0, e:"De forma personal, directa y por tiempo indefinido."},
  {p:"El capital mínimo de una sociedad anónima laboral es…", o:["60.000 €","3.000 €","1 €","Fijado en los estatutos"], c:0, e:"La sociedad limitada laboral: 3.000 €."},
  {p:"En una cooperativa cada socio tiene…", o:["Un voto, independientemente de su aportación","Votos proporcionales a su capital","Voto solo si aporta más de 3.000 €","Ningún voto"], c:0, e:"Funcionamiento democrático."},
  {p:"¿Cuántos socios necesita como mínimo una cooperativa de primer grado?", o:["Tres","Uno","Dos","Cinco"], c:0, e:"Las de segundo grado, dos."},
  {p:"El capital mínimo de una cooperativa es…", o:["El fijado en sus estatutos","60.000 €","3.000 €","1 €"], c:0, e:"Tabla de la sociedad cooperativa."}
 ]
},
4: {
 examen: ["7. Obligaciones fiscales de la empresa", "9. El concepto de insolvencia", "10. El concurso de acreedores"],
 cortas: [
  {p:"¿Cuáles son las obligaciones fiscales de la empresa?", r:"<b>IRPF</b>: lo pagan el empresario individual, las comunidades de bienes y las sociedades civiles, por <b>estimación objetiva</b> (parámetros fijados por Hacienda, sin contabilidad exhaustiva) o <b>estimación directa</b> (conservar todas las facturas emitidas y recibidas). <b>Retener el IRPF a los trabajadores</b> y liquidarlo en plazo. <b>Impuesto de Sociedades (IS)</b>: para las sociedades. <b>IVA</b>: grava las transacciones económicas. Se hacen <b>declaraciones periódicas trimestrales</b> (pagos fraccionados).", k:["IRPF (individual, CB, SC)","estimación objetiva / directa","retenciones a trabajadores","Impuesto de Sociedades","IVA","trimestral"]},
  {p:"Diferencia entre estimación objetiva y estimación directa del IRPF.", r:"<b>Objetiva</b>: se tributa según unos <b>parámetros fijados por la Agencia Tributaria</b>, sin llevar un registro contable exhaustivo de facturas. <b>Directa</b>: el empresario debe <b>conservar todas las facturas</b>, emitidas y recibidas, y tributa por el rendimiento real.", k:["objetiva: parámetros de Hacienda","directa: todas las facturas"]},
  {p:"¿Qué es la insolvencia y qué tipos hay?", r:"Según la RAE, «falta de solvencia, incapacidad de pagar una deuda». La empresa es insolvente cuando no puede atender sus pagos porque sus deudas superan sus bienes y derechos o estos no se convierten rápido en efectivo. Tipos: <b>suspensión de pagos</b>, por falta de liquidez puntual, y <b>quiebra</b>, cuando las deudas superan a los bienes y derechos y los acreedores no pueden cobrar.", k:["incapacidad de pagar","suspensión de pagos: falta de liquidez puntual","quiebra: deudas > bienes"]},
  {p:"¿Qué es el concurso de acreedores y cuál es su objetivo?", r:"Es el procedimiento judicial (ante un <b>juez mercantil</b>, Ley Concursal) que comprende tanto la suspensión de pagos como la quiebra. Busca <b>repartir de forma equitativa las pérdidas</b> entre los acreedores y que el deudor responda con el máximo posible, <b>garantizar el cobro</b> e intentar que la empresa continúe. Protege a los más débiles, como los <b>trabajadores</b>, y da prioridad a las deudas con la <b>Seguridad Social y Hacienda</b>.", k:["juez mercantil","suspensión de pagos y quiebra","reparto equitativo de pérdidas","protege a los trabajadores","prioridad SS y Hacienda"]},
  {p:"¿Quién puede iniciar el concurso de acreedores y cuáles son sus fases?", r:"Lo puede pedir el <b>propio deudor (concurso voluntario)</b> o un <b>acreedor afectado (concurso necesario)</b>, en plazo y con la documentación. El deudor debe estar en <b>insolvencia</b>. Fases: 1) <b>fase común</b>, 2) <b>fase de convenio</b>, 3) <b>fase de liquidación</b>.", k:["voluntario: el deudor","necesario: un acreedor","fase común","convenio","liquidación"]}
 ],
 test: [
  {p:"¿Quién tributa por IRPF por su actividad empresarial?", o:["Empresario individual, comunidades de bienes y sociedades civiles","Solo las sociedades anónimas","Solo las cooperativas","Todas las sociedades mercantiles"], c:0, e:"Las sociedades tributan por el Impuesto de Sociedades."},
  {p:"En la estimación directa del IRPF el empresario debe…", o:["Conservar todas las facturas emitidas y recibidas","Tributar por parámetros fijos de Hacienda","No declarar nada","Pagar solo el IVA"], c:0, e:"En la objetiva se tributa por parámetros sin contabilidad exhaustiva."},
  {p:"Las sociedades mercantiles tributan por su beneficio mediante el…", o:["Impuesto de Sociedades","IRPF","IVA","Impuesto de Sucesiones"], c:0, e:"IS para sociedades."},
  {p:"El impuesto que grava las transacciones económicas es el…", o:["IVA","IS","IRPF","IBI"], c:0, e:"Impuesto sobre el Valor Añadido."},
  {p:"¿Con qué periodicidad hacen las empresas sus declaraciones (pagos fraccionados)?", o:["Trimestral","Diaria","Cada cinco años","Solo al cerrar la empresa"], c:0, e:"En lugar de pagar todo una vez al año."},
  {p:"La insolvencia provocada por una falta de liquidez puntual se llama…", o:["Suspensión de pagos","Quiebra","Liquidación","Fusión"], c:0, e:"La quiebra es cuando las deudas superan a los bienes y derechos."},
  {p:"La quiebra se produce cuando…", o:["Las deudas son mayores que los bienes y derechos","Falta liquidez solo un día","La empresa tiene beneficios","Cambia de forma jurídica"], c:0, e:"Los acreedores no pueden cobrar."},
  {p:"El concurso de acreedores lo inicia el deudor en el caso del concurso…", o:["Voluntario","Necesario","Forzoso","Fiscal"], c:0, e:"Si lo pide un acreedor, es necesario."},
  {p:"¿Ante quién se tramita el concurso de acreedores?", o:["Un juez mercantil","La Cámara de Comercio","El Registro Civil","El ayuntamiento"], c:0, e:"Según la Ley Concursal."},
  {p:"Según el tema, en el concurso tienen prioridad de cobro las deudas con…", o:["La Seguridad Social y Hacienda","Los socios","Los clientes","Los proveedores extranjeros"], c:0, e:"También se protege a los trabajadores."},
  {p:"¿Cuál es el orden de las fases del concurso de acreedores?", o:["Común, convenio y liquidación","Liquidación, común y convenio","Convenio, liquidación y común","Inicio, juicio y sentencia"], c:0, e:"Fase 1 común, fase 2 convenio, fase 3 liquidación."}
 ]
},
5: {
 examen: ["5.2 Clasificación de las fuentes de financiación"],
 cortas: [
  {p:"Clasifica las fuentes de financiación según los tres criterios del tema.", r:"<b>Según el plazo</b>: <b>capital permanente</b> (patrimonio neto + pasivo no corriente), que financia las inversiones a largo plazo, y <b>exigible a corto plazo</b> (pasivo corriente, vence antes de un año), que financia el ciclo de explotación. <b>Según la titularidad</b>: <b>propias</b> (patrimonio neto, no se devuelven) y <b>ajenas</b> (de terceros, se devuelven en plazo). <b>Según dónde se generan</b>: <b>internas o autofinanciación</b> (generadas por la propia actividad) y <b>externas</b> (obtenidas del exterior).", k:["plazo: permanente / exigible a c/p","titularidad: propias / ajenas","origen: internas / externas"]},
  {p:"¿Qué es el capital permanente y qué financia?", r:"Es la suma del <b>patrimonio neto y el pasivo no corriente</b>. Su misión es financiar las <b>inversiones a largo plazo</b> de la empresa.", k:["PN + PNC","inversiones a largo plazo"]},
  {p:"Diferencia entre fondos propios y fondos ajenos.", r:"<b>Propios</b>: forman el patrimonio neto, pertenecen a la empresa y <b>no se devuelven</b>. <b>Ajenos</b>: proceden de <b>terceros</b> y deben devolverse en el plazo establecido.", k:["propios: no se devuelven","ajenos: de terceros, se devuelven"]}
 ],
 test: [
  {p:"El capital permanente está formado por…", o:["Patrimonio neto + pasivo no corriente","Pasivo corriente","Activo no corriente","Patrimonio neto + pasivo corriente"], c:0, e:"Financia las inversiones a largo plazo."},
  {p:"El exigible a corto plazo está formado por…", o:["El pasivo corriente","El patrimonio neto","El pasivo no corriente","Las reservas"], c:0, e:"Vence antes de un año y financia el ciclo de explotación."},
  {p:"Según la titularidad, las fuentes de financiación se clasifican en…", o:["Propias y ajenas","Internas y externas","A corto y a largo plazo","Fijas y variables"], c:0, e:"Internas/externas es según dónde se generan."},
  {p:"Según dónde se generan los fondos, las fuentes se clasifican en…", o:["Internas (autofinanciación) y externas","Propias y ajenas","Permanentes y exigibles","Corrientes y no corrientes"], c:0, e:"Las internas las genera la propia actividad."},
  {p:"Un préstamo bancario a 5 años es una fuente…", o:["Ajena, externa y del capital permanente","Propia e interna","Ajena y exigible a corto plazo","Propia y externa"], c:0, e:"Es de terceros, viene del exterior y vence a más de un año (pasivo no corriente)."},
  {p:"Las reservas son una fuente…", o:["Propia e interna","Ajena y externa","Ajena e interna","Exigible a corto plazo"], c:0, e:"Son beneficios no repartidos: autofinanciación."},
  {p:"La aportación de capital de los socios es una fuente…", o:["Propia y externa","Ajena e interna","Ajena y externa","Exigible a corto plazo"], c:0, e:"Es patrimonio neto (propia), pero viene de fuera de la actividad (externa)."},
  {p:"Una deuda con proveedores a 60 días es una fuente…", o:["Ajena y exigible a corto plazo","Propia y permanente","Interna","Propia y externa"], c:0, e:"Pasivo corriente."}
 ]
},
6: {
 examen: ["3. Aportaciones de los socios", "3.1 Business angels", "6. Autofinanciación (ventajas e inconvenientes)"],
 cortas: [
  {p:"¿Cómo pueden aportar los socios y qué es el valor nominal de una acción?", r:"Al nacer la sociedad, los socios aportan fondos que pasan al <b>patrimonio neto</b>. Pueden aportar <b>dinero en efectivo</b> (ingreso en la cuenta de la empresa), <b>bienes materiales</b> (instalaciones, maquinaria) o <b>inmateriales</b> (avales, garantías). El <b>valor nominal</b> es el valor de emisión que aparece en el título: <b>capital social ÷ número de acciones</b>.", k:["patrimonio neto","efectivo, bienes materiales e inmateriales","valor nominal = capital social ÷ nº acciones"]},
  {p:"¿Qué son los business angels y qué aportan?", r:"<b>Inversores privados</b> que apoyan financieramente nuevos proyectos. Aportan <b>capital, conocimiento técnico, contactos y relaciones personales</b>. Puede considerarse financiación propia o ajena según cuánto se impliquen. La relación se formaliza en un <b>contrato</b> con acuerdos previos, porque el riesgo es elevado.", k:["inversores privados","capital, conocimiento, contactos","propia o ajena","contrato"]},
  {p:"¿Qué es la autofinanciación y qué tipos hay?", r:"Financiación <b>propia e interna</b>: recursos generados por la propia actividad que <b>no hay que devolver</b>, destinados a invertir y crecer de forma independiente. Tipos: <b>de mantenimiento</b> (amortizaciones y provisiones) y <b>de enriquecimiento</b> (beneficios retenidos como <b>reservas</b> en lugar de repartirlos como dividendos).", k:["propia e interna","no se devuelve","mantenimiento: amortizaciones y provisiones","enriquecimiento: reservas"]},
  {p:"Ventajas e inconvenientes de la autofinanciación.", r:"<b>Ventajas</b>: no tiene <b>coste explícito</b>, da <b>autonomía financiera</b> y <b>aumenta el valor contable</b> de la empresa. <b>Inconvenientes</b>: tiene <b>coste de oportunidad</b>, puede llevar a invertir en <b>proyectos poco rentables</b>, puede <b>no bastar para grandes proyectos</b>, <b>reduce los dividendos</b> y suele ser <b>más lenta</b> que la financiación ajena.", k:["sin coste explícito","autonomía financiera","más valor contable","coste de oportunidad","proyectos poco rentables","menos dividendos","más lenta"]}
 ],
 test: [
  {p:"Las aportaciones de los socios al constituir la sociedad pasan a formar parte del…", o:["Patrimonio neto","Pasivo corriente","Pasivo no corriente","Activo corriente"], c:0, e:"Son financiación propia."},
  {p:"¿Cuál de estas NO es una forma de aportación de los socios según el tema?", o:["Un préstamo hipotecario a nombre del banco","Dinero en efectivo","Maquinaria o instalaciones","Avales o garantías"], c:0, e:"Pueden aportar efectivo, bienes materiales o inmateriales."},
  {p:"El valor nominal de una acción se calcula como…", o:["Capital social ÷ número de acciones","Número de acciones ÷ capital social","Beneficio ÷ número de acciones","Capital social × número de acciones"], c:0, e:"Es el valor que figura en el título."},
  {p:"Los business angels son…", o:["Inversores privados que apoyan nuevos proyectos","Bancos públicos","Proveedores que aplazan pagos","Organismos de la UE"], c:0, e:"Aportan capital, conocimiento, contactos y relaciones."},
  {p:"La financiación de un business angel puede considerarse…", o:["Propia o ajena, según su grado de implicación","Siempre ajena a corto plazo","Siempre una subvención","Siempre autofinanciación"], c:0, e:"Depende de cuánto aporte en conocimiento, capital o trabajo."},
  {p:"La autofinanciación es una fuente…", o:["Propia e interna","Ajena y externa","Propia y externa","Ajena e interna"], c:0, e:"La genera la propia empresa y no se devuelve."},
  {p:"Las amortizaciones y provisiones son autofinanciación de…", o:["Mantenimiento","Enriquecimiento","Expansión","Riesgo"], c:0, e:"Las reservas son de enriquecimiento."},
  {p:"¿Cuál es una VENTAJA de la autofinanciación?", o:["No tiene coste explícito","Aumenta los dividendos","Es más rápida que la ajena","No tiene coste de oportunidad"], c:0, e:"También da autonomía financiera y aumenta el valor contable."},
  {p:"¿Cuál es un INCONVENIENTE de la autofinanciación?", o:["Reduce los dividendos","Aumenta el endeudamiento","Obliga a pagar intereses","Hace perder autonomía"], c:0, e:"Además tiene coste de oportunidad y suele ser más lenta."}
 ]
},
7: {
 examen: ["3. El préstamo bancario (elementos)", "6. Leasing", "7. Crédito bancario y crédito comercial", "8. Descuento comercial"],
 cortas: [
  {p:"Define préstamo bancario y explica sus elementos.", r:"Operación en la que una entidad (<b>prestamista</b>) concede a la empresa (<b>prestatario</b>) una cantidad durante un plazo, a cambio de intereses y comisiones. Está <b>vinculado a una inversión concreta</b>. Elementos: <b>principal</b> (importe), <b>interés/comisiones</b>, <b>plazo</b>, <b>periodicidad</b>, <b>cuota</b> (cuota de interés + cuota de capital), <b>amortización</b> (parte del principal en cada cuota), <b>saldo vivo</b> (capital pendiente), <b>carencia</b> (solo se pagan intereses) y <b>TAE</b> (coste efectivo con intereses y comisiones).", k:["prestamista y prestatario","vinculado a una inversión","principal","cuota","amortización","saldo vivo","carencia","TAE"]},
  {p:"¿Qué es el leasing y qué opciones hay al final del contrato?", r:"Es el <b>arrendamiento de un elemento del activo fijo</b> (maquinaria, equipos, instalaciones): la entidad de leasing (<b>arrendador</b>) lo alquila a la empresa (<b>arrendatario</b>) por una cuota periódica. Es a <b>largo plazo</b>. Al final: 1) <b>devolverlo</b>, 2) <b>opción de compra</b> por un precio fijado, 3) <b>nuevo contrato</b> de leasing. Ventajas: usar el bien sin tener el dinero, adaptado a cada empresa y fácil renovar activos obsoletos. Inconveniente: <b>coste más alto</b> que otras alternativas.", k:["alquiler de activo fijo","arrendador / arrendatario","largo plazo","devolver, comprar o renovar","más caro"]},
  {p:"Diferencia entre crédito bancario y crédito comercial.", r:"<b>Crédito bancario</b>: el banco pone a disposición una <b>cuenta con un límite máximo</b> para imprevistos; se pagan <b>intereses solo por lo dispuesto</b> y una <b>comisión por lo no dispuesto</b>. <b>Crédito comercial</b> (de funcionamiento): <b>aplazamiento del pago a proveedores</b> (30, 60, 90 o 120 días). No tiene coste explícito pero sí <b>implícito</b> (se pierde el descuento por pronto pago). Aparece en el balance como <b>proveedores</b>.", k:["bancario: límite máximo, intereses por lo dispuesto","comisión por lo no dispuesto","comercial: aplazar pagos a proveedores","coste implícito (pronto pago)"]},

  {p:"Diferencia entre la Agencia IDEA y Extenda.", r:"Las dos dependen de la <b>Junta de Andalucía</b> (ámbito regional). La <b>Agencia IDEA</b> busca sobre todo que <b>empresas extranjeras inviertan en Andalucía</b> y tiene oficinas en el extranjero. <b>Extenda</b> (Agencia Andaluza de Promoción Exterior) ayuda a las <b>empresas andaluzas a salir fuera</b> con información, formación, consultoría y promoción.", k:["ambas de la Junta de Andalucía","IDEA: atraer inversión extranjera","Extenda: ayudar a las andaluzas a exportar"]},
  {p:"¿Qué son el ICEX, COFIDES y CESCE?", r:"<b>ICEX</b>: entidad pública empresarial adscrita al Ministerio de Industria, Comercio y Turismo; da formación, asesoramiento, financiación, ferias, misiones comerciales e información sobre compradores extranjeros. <b>COFIDES</b>: sociedad estatal de <b>capital mixto</b> que da préstamos, avales, garantías y participa en el capital; exige un <b>proyecto de inversión en el exterior</b>. <b>CESCE</b>: Compañía Española de Seguros de Crédito a la Exportación.", k:["ICEX: entidad pública empresarial","COFIDES: capital mixto, proyecto de inversión en el exterior","CESCE: seguro de crédito a la exportación"]},
  {p:"¿Cómo organizarías una base de datos para la internacionalización de una pyme?", r:"Con una <b>hoja de cálculo</b>, por su simplicidad: permite aplicar <b>filtros</b> y hacer <b>tablas dinámicas</b>. Campos opcionales: información de mercados exteriores, servicios ofrecidos, trámites, financiación o asesoramiento financiero, ayudas, premios, formación y misiones comerciales. Además, <b>fichas de clientes y proveedores</b> con datos básicos, información comercial e información financiera.", k:["hoja de cálculo","filtros y tablas dinámicas","campos (mercados, ayudas, trámites…)","fichas de clientes y proveedores"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa malagueña de aceite quiere empezar a exportar a Canadá. Indica a qué organismo acudiría en cada ámbito (local, regional, nacional e internacional) y qué le ofrece cada uno.", pasos:["Local: <b>Cámara de Comercio de Málaga</b> (Dpto. de Comercio Exterior: programas de apoyo, base de datos de contactos, formación) y <b>Promálaga</b> (networking, misiones comerciales).","Regional: <b>Extenda</b>, que ayuda a las empresas andaluzas a salir fuera (información, formación, consultoría y promoción).","Nacional: <b>ICEX</b> (asesoramiento, ferias, misiones, compradores extranjeros) e <b>ICO</b> (líneas de mediación para financiar la internacionalización).","Internacional: financiación de la <b>UE</b> (directa o indirecta) y <b>Red Europea para las Empresas</b> (asesoramiento gratuito)."]},
  {p:"<b>Caso práctico.</b> Una empresa vende a un cliente de Marruecos con cobro a 120 días y la factura es en dólares. Necesita liquidez ya. ¿Qué línea del ICO le conviene y por qué encaja?", pasos:["Le conviene la <b>Línea ICO Exportadores</b>.","Es para empresas y autónomos con domicilio social en España que emiten facturas de venta en firme fuera del territorio nacional.","Financia el <b>anticipo de facturas</b> con vencimiento <b>no superior a 180 días</b> (120 días encaja).","Se tramita a través de <b>entidades de crédito</b> y admite facturas en <b>divisa distinta del euro</b> (dólares encaja)."]}
 ]},
 2:{cortas:[
  {p:"Define el Sistema Financiero Internacional y explica su estructura.", r:"Es el conjunto de <b>instituciones públicas y privadas</b> que regulan, supervisan y controlan el sistema crediticio, las finanzas y las garantías, y que definen y ejecutan la política monetaria, bancaria, de valores y de seguros del mercado mundial. Tiene dos ramas: los <b>mercados financieros internacionales</b> (mercados domésticos, de divisas y euromercados) y el <b>sistema monetario internacional</b> (Banco Mundial, FMI y BCE).", k:["instituciones públicas y privadas","regulan, supervisan y controlan","mercados financieros: doméstico, divisas, euromercados","sistema monetario: BM, FMI, BCE"]},
  {p:"¿Cuál es el origen de las principales instituciones financieras internacionales?", r:"El <b>FMI</b> y el <b>Banco Mundial</b> nacieron en la conferencia de <b>Bretton Woods</b> (EE. UU.); el BM nació como Banco Internacional de Reconstrucción y Fomento. El <b>Banco de Pagos Internacionales</b> se creó en <b>1930</b> con sede en Suiza. El <b>BEI</b>, en <b>1958</b> en Luxemburgo. El <b>BCE</b>, en <b>1998</b>.", k:["FMI y BM: Bretton Woods","BPI: 1930, Suiza","BEI: 1958, Luxemburgo","BCE: 1998"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Tres amigos diseñan una mochila solar y quieren financiarla con crowdfunding internacional. Explica los pasos de la campaña y qué pasa si no llegan al objetivo.", pasos:["Analizan el proyecto y elaboran un <b>plan de negocio por fases</b>.","Lo envían a la <b>plataforma</b> elegida, que decide si lanza la campaña online.","Se fija un <b>importe objetivo y un plazo</b>; la plataforma da visibilidad a la campaña.","Si <b>no</b> llegan al objetivo, se <b>devuelve el dinero a los mecenas</b>. Si llegan, reciben el dinero <b>menos una comisión</b> de la plataforma."]},
  {p:"<b>Caso práctico.</b> Un país tiene déficit en su balanza de pagos y pide ayuda al FMI. Explica paso a paso cómo funciona el préstamo con DEG.", pasos:["Los recursos del FMI vienen de las <b>aportaciones de los países miembros</b>.","El país <b>compra DEG</b> (la divisa internacional creada por el FMI) <b>con su propia moneda</b>.","Usa los DEG para financiar su <b>déficit de balanza de pagos</b> o sus necesidades de reserva.","Devuelve el préstamo <b>recomprando con su propia moneda</b> la misma cantidad."]}
 ]},
 3:{cortas:[
  {p:"¿Qué instrumentos se negocian en los euromercados?", r:"<b>Depósitos interbancarios</b> (muy corto plazo, prestados a bancos, referenciados al LIBOR); <b>préstamos sindicados</b> (divididos entre varios prestamistas para diversificar el riesgo); <b>eurobonos</b> (medio y largo plazo, representan deuda); <b>euronotas</b> (medio y largo, programas que emiten pagarés a corto de forma sucesiva) y <b>europagarés</b> (corto plazo, no garantizados por un grupo de bancos, se emiten al descuento).", k:["depósitos interbancarios (LIBOR)","préstamos sindicados","eurobonos","euronotas","europagarés"]},
  {p:"¿Cómo se clasifica el mercado financiero internacional?", r:"En tres: el <b>mercado doméstico</b> (mercado interior de un país, con valores de entidades domiciliadas allí); los <b>euromercados</b> (mercados crediticios que operan fuera del país de la moneda de sus transacciones; hoy se llaman Mercados Internacionales de capitales) y el <b>mercado de divisas</b> (libre cambio de divisas, que facilita el comercio y la inversión y fija el valor de las monedas).", k:["doméstico","euromercados","mercado de divisas"]},
  {p:"¿Cómo funciona el mercado español de divisas?", r:"Es la compraventa de divisas en España contra euros o contra otras divisas, entre residentes o con no residentes: es un <b>mercado totalmente abierto</b>. Casi todo pasa por el <b>mercado interbancario</b> a través de redes de comunicación. Está <b>liberalizado</b> por la Autoridad Monetaria, aunque en la práctica casi siempre se opera con intermediarios financieros. Los departamentos de <b>Tesorería</b> de las entidades tienen un papel clave.", k:["contra euros u otras divisas","mercado totalmente abierto","interbancario","liberalizado, con intermediarios","Tesorería"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa mexicana necesita financiarse en dólares y le ofrecen hacerlo en un euromercado de Londres. Explica qué ventajas y qué riesgos tendría frente a un banco convencional.", pasos:["Es euromercado porque opera con una divisa (dólar) <b>fuera de su país</b>; no tiene que ver con Europa ni con el euro.","Ventajas: <b>bajo coste</b> (la mayor), sin importe mínimo, costes administrativos bajos, sin impuestos ni agencias de calificación.","Riesgos: <b>volatilidad</b> por especulación (el mayor), riesgo de tipo de cambio, mayor riesgo de crédito que un banco, control de capitales e inflación en algunos casos.","Conclusión: se abarata la financiación, pero hay que vigilar la volatilidad y cubrir el riesgo de cambio."]}
 ]},
 4:{cortas:[
  {p:"¿Qué factores mueven el tipo de cambio?", r:"La <b>oferta de divisas</b> depende de la actividad económica mundial, el diferencial de intereses y la renta mundial. La <b>demanda de divisas</b> depende del nivel de renta nacional, los precios de los bienes y el saldo de la balanza de pagos.", k:["oferta: actividad mundial, diferencial de intereses, renta mundial","demanda: renta nacional, precios, balanza de pagos"]},
  {p:"Explica las teorías sobre el tipo de cambio.", r:"<b>Paridad del poder adquisitivo</b>: cuando baja la inflación, baja el tipo de cambio y la moneda se aprecia. <b>Paridad de los tipos de interés</b>: cuando sube el tipo de interés, sube el tipo de cambio, y viceversa. <b>Expectativas</b>: relaciona los tipos spot y forward. <b>Efecto Fisher</b>: relaciona inflación y tipo de interés nominal; se aprecia la divisa del país con menor tipo de interés nominal.", k:["paridad del poder adquisitivo","paridad de tipos de interés","expectativas (spot-forward)","efecto Fisher"]},
  {p:"Diferencias entre una operación spot y una forward.", r:"<b>Spot</b> (contado): máximo <b>2 días hábiles</b>, muy líquida, al precio actual, se paga ahora y hay menos especulación; se usa cuando necesito la divisa ya. <b>Forward</b> (plazo): fecha futura fijada en contrato (<b>más de 2 días hábiles</b>), menos líquida, a precio de contrato, se paga en el futuro y hay más especulación; es la operación <b>más común</b> y de <b>obligado cumplimiento</b>.", k:["spot: máx. 2 días hábiles","forward: más de 2 días, fecha futura","forward obligatorio y el más común","liquidez, precio y desembolso"]}

 5:{cortas:[
  {p:"¿Qué posiciones puede adoptar una empresa frente al riesgo de cambio?", r:"<b>Asumir el riesgo</b>: lo controla esperando que el cambio le sea favorable (asunción voluntaria). <b>Contra el riesgo</b>: toma medidas de cobertura para minimizar pérdidas; es la posición <b>más corriente</b>. <b>Neutral al riesgo</b>: no se cubre y acepta posibles pérdidas pensando en beneficios futuros.", k:["asume el riesgo","contra el riesgo (la más corriente)","neutral al riesgo"]},
  {p:"¿Cómo se cubre el riesgo de cambio? Distingue riesgo de transacción y de traslación.", r:"Métodos principales: <b>seguro de cambio</b> y <b>opciones sobre divisas</b>; otros: swaps, cuentas en divisas, compensación y cláusulas de precio. El <b>riesgo de transacción</b> es la volatilidad entre contado y plazo; se cubre con cuentas en divisas, cobros y pagos en la misma moneda o un forward. El <b>riesgo de traslación</b> afecta a empresas con <b>filiales en el extranjero</b>: las filiales negocian su financiación en divisas y se mantienen al mínimo los activos en la matriz.", k:["seguro de cambio y opciones","otros: swaps, cuentas en divisas, compensación, cláusulas","transacción: contado vs plazo","traslación: filiales en el extranjero"]},
  {p:"Diferencia entre crédito documentario irrevocable y confirmado.", r:"El <b>irrevocable</b> no se puede anular sin acuerdo de las partes; es la opción recomendada en mercados de riesgo. El <b>confirmado</b> añade la garantía de cobro de un <b>segundo banco</b> al exportador. Pueden combinarse: un crédito irrevocable y confirmado da la máxima seguridad.", k:["irrevocable: no se anula sin acuerdo","confirmado: garantía de un segundo banco","se pueden combinar"]}
 ], ejercicios:[
  {p:"Un exportador contrata un seguro de cambio para cobrar 60.000 USD. Tipo pactado: 0,8500 USD/EUR (1 USD = 0,85 €). Comisión bancaria: 1 %. ¿Cuántos euros recibirá?", r:50490, dec:2, u:"EUR", pasos:["Importe en euros: 60.000 × 0,8500 = 51.000 €.","Comisión del 1 %: 51.000 × 0,01 = 510 €.","Recibe 51.000 − 510 = <b>50.490 €</b>."]},
  {p:"Vendes por 10.000 € a un cliente que paga en su moneda (XXX) con cobro aplazado. Hoy EUR/XXX = 3,00, así que fijáis el precio en 30.000 XXX. Al cobrar, EUR/XXX = 2,50. ¿Cuántos euros recibes?", r:12000, dec:2, u:"EUR", pasos:["Cobras 30.000 XXX.","Al nuevo tipo: 30.000 ÷ 2,50 = <b>12.000 €</b>.","Ganas 2.000 €: el riesgo de cambio es de doble sentido, también puede dar beneficios."]},
  {p:"<b>Caso práctico.</b> Una empresa exporta maquinaria a un cliente nuevo de un país inestable, con transporte largo por mar. Identifica tres riesgos y la medida para reducir cada uno.", pasos:["Insolvencia del comprador (cliente nuevo) → <b>crédito documentario irrevocable</b> (y confirmado si el país es de riesgo).","Riesgo país / transferencias (el gobierno puede bloquear pagos) → <b>compañías aseguradoras</b> que cubren ese riesgo.","Transporte → <b>aval bancario de cumplimiento</b>. Impago en general → <b>Seguro de Crédito a la Exportación</b>."]}

 6:{cortas:[
  {p:"¿Qué obligaciones tienen las partes en un seguro de cambio?", r:"El exportador o importador debe <b>entregar la divisa</b> en la fecha pactada. La entidad financiera debe entregar ese día el <b>contravalor al cambio prefijado</b>, sea cual sea la cotización. El importador debe comprar aunque la divisa se haya depreciado (pagará más que en el mercado) y el exportador debe vender aunque se haya apreciado (cobrará menos). Ambos pagan <b>comisiones</b>. Si facturan en la misma divisa hay un contrato; si es distinta, dos.", k:["entregar la divisa en la fecha","el banco paga al cambio prefijado","obligatorio aunque el mercado vaya mejor","comisiones"]},
  {p:"¿Qué son las cuentas en divisas y qué características tienen?", r:"Las permitió el <b>Real Decreto 1816/1991</b>, que liberalizó las transacciones con el exterior y acabó con el monopolio del Banco de España. Las usan sobre todo los <b>exportadores</b> (más control del cobro y a veces rentabilidad). Características: <b>una cuenta, una sola divisa</b>; <b>no admiten domiciliaciones</b>; total liquidez; pocos servicios adicionales; interés según el mercado.", k:["RD 1816/1991","exportadores","una sola divisa por cuenta","sin domiciliaciones","total liquidez"]},
  {p:"¿Qué son las collection accounts y cuándo encajan?", r:"Son <b>cuentas concentradoras</b>: el exportador abre una cuenta en el <b>país del importador</b> en la divisa de facturación, asigna una clave a cada importador y el banco le envía un <b>mensaje SWIFT</b> por cada ingreso (importe, fecha, fecha valor y clave). Encajan con exportadores que venden a países no comunitarios y tienen <b>relación reiterada</b> con varios importadores de un mismo país. Ventajas: mejor tesorería, menos riesgo de cambio, menos costes y más rentabilidad.", k:["cuenta en el país del importador","clave por importador","aviso por SWIFT","relación reiterada, países no comunitarios"]}
 ], ejercicios:[
  {p:"Spot EUR/USD = 1,15. Interés del euro: 4 %. Interés del dólar: 2 %. Calcula el tipo forward a 90 días (base 360, 4 decimales).", r:1.1443, dec:4, pasos:["Forward = Spot × (1 + i<sub>cotizada</sub> × t) ÷ (1 + i<sub>base</sub> × t). Base EUR, cotizada USD.","t = 90/360 = 0,25.","1,15 × (1 + 0,02 × 0,25) ÷ (1 + 0,04 × 0,25) = 1,15 × 1,005 ÷ 1,01.","= <b>1,1443</b>."]},
  {p:"Spot EUR/USD = 1,20. Interés del euro: 3 %. Interés del dólar: 2,5 %. Calcula el tipo forward a 270 días (base 360, 4 decimales).", r:1.1956, dec:4, pasos:["Base EUR, cotizada USD. t = 270/360 = 0,75.","1,20 × (1 + 0,025 × 0,75) ÷ (1 + 0,03 × 0,75).","= 1,20 × 1,01875 ÷ 1,0225 = <b>1,1956</b>."]},

 7:{cortas:[
  {p:"¿Qué es un contrato de futuros sobre divisas y cuáles son sus rasgos?", r:"Un acuerdo para intercambiar una divisa a un precio y fecha determinados en un <b>mercado organizado y regulado</b>, con <b>contratos estándar</b> en importe y plazo. Tipo de cambio único sin spread y fecha predeterminada. Se negocia a través de una <b>cámara de compensación</b> (como el CME) que garantiza el cumplimiento: <b>no hay riesgo de impago</b>. Hay que depositar una <b>garantía</b>, la relación es anónima y se puede cancelar anticipadamente.", k:["mercado organizado, contratos estándar","sin spread, fecha predeterminada","cámara de compensación, sin riesgo de impago","garantía","tick"]},
  {p:"¿Qué es una opción sobre divisas? Explica sus elementos y posiciones.", r:"Un contrato que da el <b>derecho, no la obligación</b>, de comprar (<b>call</b>) o vender (<b>put</b>) una divisa. Elementos: tipo de opción, nombre del valor, fecha de vencimiento y <b>precio de ejercicio (strike)</b>. Posiciones: call comprada (larga), call vendida (corta), put comprada (larga) y put vendida (corta). El comprador paga una <b>prima</b>; solo el <b>vendedor</b> está obligado.", k:["derecho, no obligación","call = compra, put = venta","strike y vencimiento","prima","solo el vendedor está obligado"]},
  {p:"¿Qué es un swap de divisas?", r:"Un acuerdo entre dos partes para <b>intercambiar cobros y pagos</b> durante un periodo: pagos en una divisa y tipo de interés a cambio de pagos en otra divisa. Factores: fechas de comienzo y final, nominal, tipo de interés de cada parte y periodicidad. Por tipo de interés puede ser fijo-fijo, fijo-variable o variable-variable. Se intercambian los principales y los intereses.", k:["intercambio de cobros y pagos en distintas divisas","fechas, nominal, interés, periodicidad","fijo-fijo, fijo-variable, variable-variable"]},
  {p:"Diferencias entre forward, futuros y opciones.", r:"En el <b>forward</b> y los <b>futuros</b> están obligados comprador y vendedor; en las <b>opciones</b>, solo el vendedor. El forward es a medida (tamaño y fecha según contrato) y se pacta directamente; futuros y opciones son <b>estandarizados</b> y cotizan en mercado. El forward no tiene cámara de compensación; futuros y opciones sí. En futuros ambas partes aportan garantías; en opciones el tomador paga una prima.", k:["obligación: forward y futuros ambos; opciones solo vendedor","forward a medida, los otros estandarizados","cámara de compensación en futuros y opciones","garantías vs prima"]}
