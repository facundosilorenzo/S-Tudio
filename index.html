 {p:"¿Qué clasificación es la más útil para controlar el presupuesto del almacén?", o:["En función de su actividad","En función de su imputabilidad","Fijos y variables","Directos e indirectos"], c:0, e:"Permite saber en qué actividad se produce cada coste."},
 {p:"El alquiler del local y la amortización de las estanterías son costes de…", o:["Almacenaje","Manutención","Preparación de pedidos","Administración"], c:0, e:"El coste de almacenaje (o de infraestructuras) es el del uso del espacio y los medios fijos."},
 {p:"La amortización de una carretilla elevadora usada para mover mercancía es un coste de…", o:["Manutención","Almacenaje","Administración y gestión","Costes ocultos"], c:0, e:"Los medios de almacenaje móviles y el personal que manipula van a manutención."},
 {p:"El sueldo del personal de limpieza y vigilancia del almacén es un coste de…", o:["Administración y gestión","Manutención","Preparación de pedidos","Almacenaje"], c:0, e:"Incluye personal administrativo, dirección y servicios generales (limpieza, vigilancia, climatización)."},
 {p:"El coste de los envases y embalajes para preparar pedidos va en…", o:["Costes de preparación de pedidos (picking)","Costes de almacenaje","Costes ocultos","Coste de fabricación"], c:0, e:"Tanto los de un solo uso como los reutilizables, comprados o alquilados."},
 {p:"El coste de oportunidad por el dinero invertido en las existencias forma parte del…", o:["Coste de los stocks","Coste de manutención","Coste oculto","Coste de administración"], c:0, e:"Coste de los stocks = adquisición + almacenamiento unitario + coste de oportunidad."},
 {p:"Las roturas, los robos y las diferencias de inventario son…", o:["Costes ocultos","Costes de almacenaje","Costes fijos","Gastos de compra"], c:0, e:"No se prevén, pero afectan al valor real de los productos almacenados."},
 {p:"Si una estantería se compra con fondos propios, su financiación aparece como…", o:["Coste de oportunidad","Intereses bancarios","Arancel","Rappel"], c:0, e:"Con crédito serían intereses bancarios; con fondos propios, coste de oportunidad."},
 {p:"La cuota de amortización lineal se calcula como…", o:["(Coste de adquisición − valor residual) ÷ años de vida útil","Coste de adquisición × años de vida útil","Valor residual ÷ coste de adquisición","(Coste + valor residual) ÷ años"], c:0, e:"Caso Bodegas Rio: (10.000 − 800) ÷ 15 = 613,33 €/año."},
 {p:"La inmologística consiste en…", o:["Alquilar instalaciones industriales a otras empresas para que optimicen costes","Comprar inmuebles para vivir","Un tipo de descuento comercial","Un software de almacén"], c:0, e:"Es una tendencia para reducir costes de almacenamiento."}
],
ejercicios: [
 {p:"Una empresa compra 2.000 unidades a 15 €/ud. Condiciones: descuento comercial 5 %, rappel 3 % y pronto pago 2 %. Gastos a su cargo: transporte 600 €, seguro 150 € y embalajes no retornables 250 €. ¿Cuál es el coste total de adquisición?", r:28092.10, dec:2, u:"€", pasos:["Importe bruto: 2.000 × 15 = 30.000 €.","Comercial 5 %: 30.000 × 0,95 = 28.500 €.","Rappel 3 %: 28.500 × 0,97 = 27.645 €.","Pronto pago 2 %: 27.645 × 0,98 = 27.092,10 €.","+ gastos: 600 + 150 + 250 = 1.000 €.","Coste total = <b>28.092,10 €</b>."]},
 {p:"Con los datos del ejercicio anterior (coste total 28.092,10 € por 2.000 unidades), ¿cuál es el coste de adquisición unitario?", r:14.05, dec:2, u:"€/ud", pasos:["Coste unitario = coste total ÷ unidades.","28.092,10 ÷ 2.000 = 14,046 → <b>14,05 €/ud</b>."]},
 {p:"Se compran 1.000 unidades a 8 €/ud con un descuento comercial del 10 %. Gastos: transporte 300 €, envases retornables 200 € (se devuelven al proveedor) y aranceles 500 €. ¿Cuál es el coste unitario de adquisición?", r:8, dec:2, u:"€/ud", pasos:["Importe bruto: 1.000 × 8 = 8.000 €. Comercial 10 %: 7.200 €.","Gastos: transporte 300 + aranceles 500 = 800 €. Los envases <b>retornables no cuentan</b>.","Total: 7.200 + 800 = 8.000 €.","Unitario: 8.000 ÷ 1.000 = <b>8 €/ud</b>."]},
 {p:"Bodegas Rio compra una estantería por 10.000 €, con un valor residual de 800 € y una vida útil de 15 años. ¿Cuál es la cuota de amortización anual (método lineal)?", r:613.33, dec:2, u:"€/año", pasos:["Cuota = (coste − valor residual) ÷ vida útil.","(10.000 − 800) ÷ 15 = 9.200 ÷ 15 = <b>613,33 €/año</b>.","Es un coste de <b>almacenaje</b> (medio fijo)."]},
 {p:"Una estantería cuesta 18.000 €, tiene un valor residual de 1.500 € y una vida útil de 10 años. ¿Cuál es la cuota de amortización anual?", r:1650, dec:2, u:"€/año", pasos:["(18.000 − 1.500) ÷ 10 = 16.500 ÷ 10 = <b>1.650 €/año</b>.","Va a costes de <b>almacenaje</b>."]},
 {p:"Una carretilla elevadora cuesta 24.000 €, su valor residual es de 4.000 € y su vida útil de 8 años. ¿Cuál es la cuota de amortización anual y a qué coste se imputa?", r:2500, dec:2, u:"€/año", pasos:["(24.000 − 4.000) ÷ 8 = 20.000 ÷ 8 = <b>2.500 €/año</b>.","Es un medio de almacenaje <b>móvil</b> → coste de <b>manutención</b>."]},
 {p:"El alquiler del almacén cuesta 12.000 € al año y se reparte por m³ ocupados: almacenaje 600 m³, preparación de pedidos 300 m³ y administración 100 m³. ¿Cuánto alquiler se imputa a preparación de pedidos?", r:3600, dec:2, u:"€", pasos:["Clave de reparto: m³ ocupados. Total: 600 + 300 + 100 = 1.000 m³.","Preparación de pedidos: 300 ÷ 1.000 = 30 %.","12.000 × 0,30 = <b>3.600 €</b>."]},
 {p:"<b>Caso práctico.</b> Clasifica según su actividad: (a) alquiler del almacén; (b) sueldo de los carretilleros; (c) cajas para enviar pedidos; (d) sueldo del jefe de almacén y de la limpieza; (e) mercancía robada; (f) coste de oportunidad del dinero invertido en existencias; (g) mantenimiento de las estanterías.", pasos:["(a) <b>Almacenaje</b> (uso del espacio).","(b) <b>Manutención</b> (personal que manipula).","(c) <b>Preparación de pedidos</b> (envases y embalajes).","(d) <b>Administración y gestión</b> (dirección y servicios generales).","(e) <b>Coste oculto</b>.","(f) <b>Coste de los stocks</b>.","(g) <b>Almacenaje</b> (reparación y mantenimiento de medios fijos)."]}
],
cortas: [
 {p:"¿Cómo se calcula el coste de adquisición de un producto?", r:"Se parte del <b>importe bruto</b> (unidades × precio unitario), se le <b>restan los descuentos</b> en orden (comercial, rappel o volumen y pronto pago, cada uno sobre lo que deja el anterior) y se le <b>suman los gastos de compra</b> a cargo del comprador: transporte, seguro, envases y embalajes no retornables, y aranceles y otros tributos (el IVA solo si no es deducible). El unitario es el total ÷ unidades.", k:["importe bruto","restar descuentos en orden","sumar gastos de compra","IVA solo si no es deducible","unitario = total ÷ unidades"]},
 {p:"Explica los tipos de coste de almacenamiento según el nivel de actividad y según su imputabilidad.", r:"Según el <b>nivel de actividad</b>: <b>fijos</b> (no dependen de la cantidad almacenada, como el mantenimiento) y <b>variables</b> (cambian con la actividad, como la manutención). Según su <b>imputabilidad</b>: <b>directos</b> (se asignan a un producto o proceso) e <b>indirectos</b> o gastos generales (afectan a toda la empresa y se reparten con claves de reparto).", k:["fijos","variables","directos","indirectos","claves de reparto"]},
 {p:"¿Qué costes de almacenamiento hay según su actividad?", r:"<b>Almacenaje</b> (uso del espacio y medios fijos), <b>manutención</b> (manipulación: personal y medios móviles), <b>preparación de pedidos</b> (picking, envases y embalajes), <b>administración y gestión</b> (personal administrativo, dirección, servicios generales), <b>coste de los stocks</b> (adquisición + almacenamiento unitario + coste de oportunidad) y <b>costes ocultos</b> (roturas, robos, diferencias de inventario…).", k:["almacenaje","manutención","preparación de pedidos","administración","stocks","ocultos"]}
]
});
ESTUDIO.extra("logistica", {
 1:{cortas:[
  {p:"Define la logística y explica sus objetivos.", r:"Es la actividad empresarial que consiste en la <b>planificación y la gestión</b> de las operaciones relacionadas con el <b>movimiento de materias primas y productos terminados</b> desde el proveedor hasta el consumidor. Objetivos: alcanzar el <b>nivel de servicio</b> que exigen los clientes (calidad, precio, cantidad y momento de entrega), <b>reducir los costes logísticos</b> (pedido, almacenaje y distribución) y reforzar la <b>sostenibilidad</b>.", k:["planificación y gestión","del proveedor al consumidor","nivel de servicio","reducir costes","sostenibilidad"]},
  {p:"¿Cuáles son las 7 funciones logísticas?", r:"<b>Compras</b> (buscar proveedores y adquirir), <b>almacenamiento</b> (manipular, conservar y depositar), <b>gestión de inventarios</b> (cantidad óptima según costes), <b>embalaje</b> (proteger para transportar y almacenar), <b>planificación de la producción</b> (programar unidades y organizar recursos), <b>transporte</b> (del origen al punto de consumo) y <b>servicio al cliente</b> (que reciba el producto cuando y como lo pide).", k:["compras","almacenamiento","gestión de inventarios","embalaje","planificación de la producción","transporte","servicio al cliente"]},
  {p:"Explica los tipos de canal de distribución según el número de intermediarios.", r:"<b>Directo</b>: sin intermediarios, del fabricante al consumidor (vendedores propios o agentes comerciales). <b>Corto</b>: un intermediario, el detallista o minorista. <b>Largo</b>: al menos dos, mayorista y minorista. <b>Muy largo</b>: aparecen además otros, como centrales de compra o importadores.", k:["directo: sin intermediarios","corto: un detallista","largo: mayorista + minorista","muy largo: centrales de compra, importador"]},
  {p:"Explica las fases del ciclo de vida del producto.", r:"<b>Introducción</b>: ventas escasas, beneficios muy bajos o nulos por los costes iniciales y sin competencia. <b>Crecimiento</b>: las ventas crecen rápido, aumentan los beneficios y empiezan a aparecer competidores. <b>Madurez</b>: ventas y beneficios estables, aumenta la competencia; es la <b>fase más larga</b>. <b>Declive</b>: bajan ventas y beneficios por cambios legales, de moda o productos sustitutivos o más baratos.", k:["introducción: sin competencia","crecimiento: ventas crecen rápido","madurez: la más larga","declive: causas"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una empresa textil (industrial) compra tejido, confecciona camisetas y las vende a tiendas. Indica qué funciones logísticas tiene en cada fase del proceso logístico. ¿Qué cambiaría si solo comprara las camisetas hechas para revenderlas?", pasos:["Aprovisionamiento: <b>compras</b>.","Producción: almacenamiento, gestión de inventarios, <b>planificación de la producción</b> y transporte.","Distribución: almacenamiento, inventarios, embalaje, transporte y <b>servicio al cliente</b>.","Si solo revende es una <b>empresa comercial</b>: no tiene producción, solo aprovisionamiento y distribución."]}
 ]},
 2:{cortas:[
  {p:"¿Cuáles son las funciones del almacén?", r:"<b>Recepción</b> (dar entrada: asignar muelle, comprobar con el albarán, verificar cantidad y calidad, registrar y codificar); <b>almacenaje</b> (ubicar en la zona más adecuada); <b>conservación y mantenimiento</b> (perfecto estado, con seguridad e higiene); <b>gestión y control de existencias</b> (cuánto almacenar y con qué frecuencia pedir) y <b>expedición</b> (picking y preparación del envío: embalaje, precintado y etiquetado).", k:["recepción","almacenaje","conservación y mantenimiento","gestión de existencias","expedición (picking)"]},
  {p:"¿Qué es el cross docking y qué tipos hay?", r:"Es una técnica en la que se <b>recibe y se expide sin almacenar</b>: no hay stock ni inventario, solo recepción y expedición. <b>Directo o predistribuido</b>: la mercancía sale igual que entró porque el proveedor prepara cada pedido. <b>Indirecto o consolidado</b>: entra en un formato y sale en otro, hay que desfragmentar y reagrupar. Requiere mucha coordinación (<b>ECR</b>).", k:["sin almacenar, sin stock","directo: sale igual que entra","indirecto: desfragmentar y reagrupar","ECR"]},
  {p:"¿Qué es la logística inversa?", r:"Es el flujo <b>del consumidor al proveedor</b>. Incluye la <b>gestión de devoluciones</b> (del cliente a la empresa y de la empresa al proveedor, también por exceso de inventario o productos obsoletos) y la <b>gestión de residuos</b>, ligada a la logística verde: <b>reutilización</b> (nuevo uso), <b>reciclaje</b> (aprovechar la materia prima para un producto nuevo) y <b>refabricación</b> (reacondicionar hasta la calidad original con menor coste).", k:["del consumidor al proveedor","devoluciones","residuos","reutilizar, reciclar, refabricar"]},
  {p:"¿Cómo se certifica la calidad en un almacén?", r:"Con un <b>sistema de gestión de calidad</b> basado en el control de procesos. En España certifica <b>AENOR</b>. Normas <b>ISO</b>: calidad, serie <b>9000</b> (ISO 9001:2015); medio ambiente, <b>ISO 14000</b>; riesgos y seguridad, ISO 22000, 27001 y OHSAS 18001; responsabilidad social, ISO 26000. El modelo <b>EFQM</b> (Modelo Europeo de Excelencia) se basa en la <b>autoevaluación</b>.", k:["sistema de gestión de calidad","AENOR","ISO 9000 calidad","ISO 14000 medio ambiente","EFQM autoevaluación"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Una cadena de supermercados recibe palés completos de agua que salen tal cual hacia sus tiendas, y palés mezclados de frutas que hay que deshacer para formar el pedido de cada tienda. ¿Qué técnica usa en cada caso? ¿Qué funciones del almacén intervienen?", pasos:["Las dos son <b>cross docking</b>: se recibe y se expide sin almacenar.","Agua: <b>directo o predistribuido</b> (sale igual que entró).","Fruta: <b>indirecto o consolidado</b> (se desfragmenta y se reagrupa por tienda).","Solo intervienen <b>recepción y expedición</b>; no hay stock ni gestión de inventario."]},
  {p:"<b>Caso práctico.</b> Una tienda de electrónica recibe móviles devueltos: unos funcionan, otros están rotos y otros se pueden arreglar. Clasifica qué haría con cada uno según la logística inversa.", pasos:["Es <b>logística inversa</b>: flujo del consumidor hacia la empresa.","Los que funcionan: <b>gestión de devoluciones</b> (vuelven a stock o al proveedor).","Los que se pueden arreglar: <b>refabricación</b> (reacondicionar hasta la calidad original con menor coste).","Los rotos: <b>reciclaje</b> (aprovechar su materia prima) o <b>reutilización</b> de piezas."]}
 ]},
 3:{cortas:[
  {p:"¿Qué tres aspectos hay que tener en cuenta para ubicar un almacén?", r:"1) Que sea un <b>punto intermedio</b> entre el origen (fuentes de suministro) y el destino; con una sola fuente, dentro o muy cerca de ella. 2) Los <b>costes de la localización</b>: terrenos, permisos, autorizaciones y personal. 3) La <b>accesibilidad</b> para los transportes, la comunicación y los suministros (luz, agua, gas).", k:["punto intermedio origen-destino","costes de la localización","accesibilidad y suministros"]},
  {p:"¿Qué zonas tiene el lay-out de un almacén?", r:"<b>Recepción</b> (cerca de la entrada y separada del resto); <b>almacenamiento</b> (en el suelo o en estanterías; se puede dividir por tipo de producto, mantenimiento o rotación); <b>expedición</b> (preparación de pedidos y acondicionamiento: embalaje, etiquetado, control de salida) y <b>zonas auxiliares</b> (oficinas y servicios).", k:["recepción","almacenamiento","expedición","auxiliares"]},
  {p:"Explica los métodos de almacenaje.", r:"Por <b>asignación de ubicación</b>: ordenado (sitio fijo), caótico o hueco libre (donde haya sitio, con software SGA), a granel (montones) y en bloque (grupos de iguales). Por <b>aprovechamiento del espacio</b>: sin pasillos o con pasillos. Por <b>flujo</b>: <b>FIFO</b> (primero en entrar, primero en salir) y <b>LIFO</b> (primero en entrar, último en salir).", k:["ordenado, caótico, granel, bloque","con o sin pasillos","FIFO y LIFO"]},
  {p:"Diferencia entre depósito aduanero, depósito en zona franca y depósito franco.", r:"Los tres son <b>régimen especial de almacenamiento</b>: mercancía sin aranceles ni impuestos, por tiempo ilimitado. El <b>depósito aduanero</b> es un almacén reconocido por la aduana y bajo su control. El <b>depósito en zona franca</b> está dentro de una zona franca (parte cercada del territorio aduanero que se trata como si estuviera fuera), sin controles de aduana. El <b>depósito franco</b> es igual pero <b>fuera de la zona franca</b>, aunque depende de ella.", k:["sin aranceles ni impuestos, tiempo ilimitado","aduanero: bajo control de la aduana","zona franca: dentro, sin controles","franco: fuera pero depende de ella"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Un almacén de yogures necesita que salgan primero los que entraron antes. Un almacén de una tienda online tiene miles de referencias distintas y muy poco espacio. ¿Qué método de almacenaje usarías en cada uno?", pasos:["Yogures (perecederos): flujo <b>FIFO</b>, primero en entrar, primero en salir.","Tienda online: método <b>caótico o de hueco libre</b>, colocando cada artículo donde haya sitio para aprovechar el espacio (como Amazon).","El caótico tiene riesgo de perder el control: se compensa con un <b>software de gestión de almacenes (SGA)</b>."]}
 ]},
 4:{cortas:[
  {p:"Diferencia entre medios de almacenaje fijos y móviles.", r:"Los <b>fijos o estáticos</b> sirven para depositar el producto mientras está almacenado: <b>estanterías</b> (convencionales, compactas y en voladizo) y el propio <b>suelo</b>. Los <b>móviles o dinámicos</b> permiten <b>trasladar</b> la mercancía (carga y descarga, almacenamiento, picking y traslados) y se eligen según el diseño y tamaño del almacén, la automatización, la actividad y la tracción.", k:["fijos: depositar (estanterías y suelo)","móviles: trasladar","criterios de elección"]},
  {p:"¿Qué medios móviles hay con movimiento pero sin traslado?", r:"Están <b>fijados al suelo o al techo</b> y mueven los productos de forma continua. En el suelo, el <b>transporte rodante</b>: cinta de rodillos (por gravedad o motor) y cinta de banda. En el techo, el <b>transporte aéreo</b>: raíles con ganchos, perchas o poleas, y grúas aéreas.", k:["fijados al suelo o al techo","cintas de rodillos y de banda","raíles aéreos y grúas"]},
  {p:"Explica la transpaleta, el apilador y la carretilla contrapesada.", r:"<b>Transpaleta</b>: dos largueros en U invertida con mecanismo de elevación y timón; manual o autopropulsada; para carga y descarga y traslados cortos (15-25 m). <b>Apilador</b>: como la transpaleta pero con <b>mástil elevador</b> para subir y apilar a distintas alturas. <b>Carretilla contrapesada</b>: lleva un contrapeso de hierro detrás para cargar delante; es la <b>más usada</b> para carga y descarga.", k:["transpaleta: distancias cortas","apilador: mástil para elevar","contrapesada: la más usada"]}
 ], ejercicios:[
  {p:"<b>Caso práctico.</b> Un almacén de muebles recibe camiones con palés, los guarda en estanterías altas de pasillo estrecho y quiere automatizar los traslados entre zonas. Elige los medios móviles para cada tarea y justifícalo.", pasos:["Descarga de camiones: <b>carretilla contrapesada</b>, la más usada para carga y descarga.","Estanterías altas de pasillo estrecho: <b>carretilla trilateral</b> (recoge a izquierda, derecha y frente) o <b>transelevador</b>.","Traslados automáticos entre zonas: <b>AGV</b> (vehículo de guiado automático, sin conductor).","Apoyo a picking a nivel del suelo: <b>transpaleta</b>."]},
  {p:"<b>Caso práctico.</b> Clasifica según su grado de automatización: transpaleta manual, apilador eléctrico con conductor y transelevador guiado por ordenador.", pasos:["Transpaleta manual: <b>manual</b>, el operario hace la tracción y la elevación.","Apilador eléctrico con conductor: <b>autopropulsado</b>, tiene motor y el operario solo lo dirige.","Transelevador por ordenador: <b>automático</b>, motor eléctrico y órdenes desde un ordenador."]}
 ]},
 5:{cortas:[
  {p:"Explica el método ABC y cómo se hace.", r:"Clasifica las mercancías por importancia siguiendo la <b>regla de Pareto</b> (80 % de los efectos por el 20 % de las causas). <b>A</b>: 10-20 % de las unidades y 80-90 % del valor, control más exhaustivo. <b>B</b>: ~30 % de unidades y ~15 % del valor. <b>C</b>: ~50 % de unidades y ~5 % del valor. Pasos: calcular el valor (unidades × precio), <b>ordenar de mayor a menor valor</b>, calcular % de unidades y de valor, calcular los acumulados y asignar grupos.", k:["regla de Pareto","A: pocas unidades, mucho valor","C: muchas unidades, poco valor","ordenar por valor y acumular"]},
  {p:"¿Cuáles son los costes de los stocks?", r:"<b>Adquisición</b> (la compra al proveedor); <b>emisión del pedido</b> (costes fuera de factura desde el pedido hasta la recepción: transporte, seguros, material de oficina); <b>almacenamiento o posesión</b> (instalaciones, robos, roturas, capital invertido) y <b>ruptura de stocks</b> (no tener mercancía: pedidos perdidos y deterioro de la imagen).", k:["adquisición","emisión del pedido","almacenamiento o posesión","ruptura de stocks"]},
  {p:"¿Qué ratios se usan para el control económico de los stocks?", r:"<b>Índice de rotación</b>: veces que se renuevan las existencias en un periodo. <b>Periodo medio de maduración</b>: duración del ciclo de explotación en días. <b>Umbral de rentabilidad</b>: punto en que ingresos = costes, beneficio 0. <b>Índice de cobertura</b>: días que tardan en agotarse las existencias sin ruptura; es el <b>inverso de la rotación</b>.", k:["rotación","periodo medio de maduración","umbral de rentabilidad","cobertura = inverso de la rotación"]}
 ], ejercicios:[
  {p:"Una tienda vende normalmente 800 unidades a la semana y guarda un 12 % extra como stock de seguridad. ¿Cuál es el stock total?", r:896, dec:0, u:"unidades", pasos:["Stock total = stock normal + stock de seguridad.","Seguridad: 800 × 0,12 = 96.","800 + 96 = <b>896 unidades</b>."]},
  {p:"Análisis ABC: P1 80 uds × 30 €; P2 300 uds × 5 €; P3 400 uds × 1 €; P4 1.500 uds × 0,20 €. Los productos del grupo A son P1 y P2. ¿Qué % acumulado del valor suman? (2 decimales)", r:84.78, dec:2, u:"%", pasos:["Valores: P1 2.400 €; P2 1.500 €; P3 400 €; P4 300 €. Total: 4.600 €.","Orden por valor: P1 (52,17 %), P2 (32,61 %), P3 (8,70 %), P4 (6,52 %).","Acumulado de P1 + P2: 52,17 + 32,61 = <b>84,78 %</b> → grupo A.","P3 (93,48 % acumulado) es B y P4 es C."]},
  {p:"Con los datos del ejercicio anterior, ¿qué % de las unidades físicas representa el producto P4 (grupo C)? (2 decimales)", r:65.79, dec:2, u:"%", pasos:["Unidades totales: 80 + 300 + 400 + 1.500 = 2.280.","P4: 1.500 ÷ 2.280 × 100 = <b>65,79 %</b>.","Encaja con el grupo C: muchas unidades y poco valor (6,52 %)."]}
 ]},
 6:{cortas:[
  {p:"¿Qué unidades de carga existen?", r:"<b>Europaleta</b> (norma UNE): 1.200 × 800, hasta 2.000 kg y 2,5 m³; la más usada en la UE. <b>Palé universal</b> (ISO): 1.200 × 1.000. <b>Contenedor ISO</b>: 10, 20, 30, 40 y 50 pies; los más usados son el de 20 pies (TEU) y el de 40 (FEU); facilitan la intermodalidad. <b>Contenedor IATA</b>: adaptado al fuselaje del avión.", k:["europaleta 1.200 × 800","palé universal 1.200 × 1.000","contenedor ISO: TEU y FEU","contenedor IATA"]},
  {p:"Compara los sistemas de almacenaje convencional y compacto.", r:"<b>Convencional</b> (el más usado): estanterías separadas por pasillos; acceso directo a cada ubicación, poca inversión, FIFO y LIFO y fácil control, pero no aprovecha el espacio por los pasillos. <b>Compacto</b>: sin pasillos, las carretillas entran en la estantería; optimiza el espacio con poca inversión, pero es lento y exige mercancía homogénea. Drive-in (un frontal) solo LIFO; drive-through (dos frontales) FIFO y LIFO.", k:["convencional: acceso directo, pierde espacio","compacto: sin pasillos, gran densidad","drive-in LIFO","drive-through FIFO y LIFO"]},
  {p:"Compara los sistemas dinámico y móvil.", r:"<b>Dinámico</b>: estanterías con caminos de rodillos, por gravedad o motorizados; optimiza el espacio, da gran control y ahorra tiempo, pero la inversión es alta y hay riesgo de aplastamiento (gravedad solo FIFO). <b>Móvil</b>: estanterías convencionales sobre raíles que se desplazan, con <b>un solo pasillo</b>; optimiza el espacio, admite mercancía heterogénea y acceso directo, pero la inversión es alta. Es el que <b>menos superficie</b> ocupa.", k:["dinámico: rodillos, gravedad o motor","móvil: un solo pasillo","inversión alta en ambos","móvil: menos superficie"]}
 ], ejercicios:[
  {p:"Una estantería convencional admite 35 paletas por altura y la carretilla eleva 6 alturas. Hay que almacenar 4.000 paletas. ¿Cuántas estanterías hacen falta?", r:20, dec:0, u:"estanterías", pasos:["Capacidad = 35 × 6 = 210 paletas por estantería.","4.000 ÷ 210 = 19,05.","Se redondea hacia arriba: <b>20 estanterías</b>."]},
  {p:"Con las 20 estanterías convencionales del ejercicio anterior (1,10 m de anchura, 35 m de largura) y pasillos de 3 m, calcula la superficie.", r:1820, dec:2, u:"m²", pasos:["Convencional: un pasillo por cada dos estanterías → 20 ÷ 2 = 10 pasillos.","(20 × 1,10 + 10 × 3) × 35 = (22 + 30) × 35.","= <b>1.820 m²</b>."]},
  {p:"Si esas 20 estanterías fueran móviles (mismas medidas, un pasillo de 3 m), ¿qué superficie haría falta?", r:875, dec:2, u:"m²", pasos:["Sistema móvil: <b>un solo pasillo</b>.","(20 × 1,10 + 1 × 3) × 35 = 25 × 35.","= <b>875 m²</b>, menos de la mitad que la convencional."]},
  {p:"Una estantería dinámica drive-in tiene 20 huecos por altura, 5 alturas y 10 paletas por hueco (12 m de profundidad, 24 m de largura). Hay que almacenar 2.800 paletas con pasillos de 3 m. Calcula la superficie (drive-in: 2 pasillos para 3 estanterías).", r:1008, dec:2, u:"m²", pasos:["Capacidad: 20 × 5 × 10 = 1.000 paletas por estantería.","2.800 ÷ 1.000 = 2,8 → <b>3 estanterías</b>.","(3 × 12 + 2 × 3) × 24 = 42 × 24 = <b>1.008 m²</b>."]}
 ]},
 7:{cortas:[
  {p:"Diferencia entre las estrategias «operario hacia el producto» y «producto hacia el operario».", r:"En <b>operario hacia el producto</b> el operario se desplaza a la estantería e importa la ergonomía: estanterías de un nivel, de varios niveles o entreplantas, móviles o de pasillo estrecho. En <b>producto hacia el operario</b> el producto viaja hasta él y <b>no hay tiempos muertos</b>: almacén automático para cajas (miniload), carrusel vertical u horizontal y paternóster.", k:["operario se desplaza: ergonomía","producto viaja: sin tiempos muertos","miniload, carrusel, paternóster"]},
  {p:"¿Cómo se almacenan las piezas largas?", r:"<b>En el suelo</b>, sobre tacos de separación para meter las horquillas, si son piezas muy resistentes que se apilan. En <b>estantería cantiléver o en voladizo</b> (pilares con brazos en U o doble T) si son flexibles o de alto valor; puede ser simple (una cara, contra la pared) o doble (dos caras).", k:["suelo con tacos: piezas resistentes","cantiléver: flexibles o de alto valor","simple o doble"]},
  {p:"¿Cómo se almacenan los contenedores y con qué medios?", r:"En terminales marítimas, ferroviarias y depósitos de contenedores. Disposiciones: <b>fila única</b> (con pasillo para el camión-puente), <b>fila doble</b> (pasillo a cada lado), <b>bloques de fila triple</b> (con grúa apiladora) y <b>bloque compacto</b>. Medios: grúa pórtico (portainer), camión-puente (van carrier), carretillas de carga frontal y lateral y grúa apiladora (reach stacker).", k:["fila única, doble, triple, compacto","portainer, van carrier","forklift, side loader, reach stacker"]},
  {p:"¿Qué es un almacén autoportante?", r:"Aquel en el que <b>las propias estanterías sostienen el techo y las paredes</b>: forman el edificio. Normalmente son estanterías convencionales con doble función (almacenar y soportar). Suele usar almacenaje <b>caótico</b> apoyado en informática y el <b>transelevador automático</b> como medio móvil.", k:["las estanterías son el edificio","doble función","caótico con informática","transelevador automático"]}
 ], ejercicios:[
  {p:"Un paternóster tiene 8 gavetas en horizontal y 30 en vertical. Un taller tiene 1.000 referencias distintas (una gaveta por referencia). ¿Cuántos paternóster necesita?", r:5, dec:0, u:"paternóster", pasos:["Gavetas por paternóster: 8 × 30 = 240.","1.000 ÷ 240 = 4,17.","Se redondea hacia arriba: <b>5 paternóster</b>."]},
  {p:"En un recinto quedan 120 m de largo libres después de restar los pasillos. ¿Cuántos contenedores de 20′ (6,096 m) caben en un bloque de 3 filas y 4 alturas?", r:228, dec:0, u:"contenedores", pasos:["A lo largo: 120 ÷ 6,096 = 19,69 → 19 (lo que cabe: redondeo hacia abajo).","Bloque: 19 × 3 filas × 4 alturas.","= <b>228 contenedores</b>."]}
 ]}

  {p:"¿Qué significan estas abreviaturas: gr8, 2nite, thx, wbu, fyi, atb?", r:"gr8 = <b>great</b>; 2nite = <b>tonight</b>; thx = <b>thanks</b>; wbu = <b>what about you</b>; fyi = <b>for your information</b>; atb = <b>all the best</b>.", k:["great","tonight","thanks","what about you","for your information","all the best"]},

  {p:"Explica el uso de in, on y at con el tiempo y pon dos ejemplos de cada una.", r:"<b>IN</b>: periodos amplios (estaciones, meses, años, partes del día): in summer, in the morning. <b>ON</b>: días y fechas concretas: on Monday, on September 7th. <b>AT</b>: horas y vacaciones de varios días: at half past eight, at Christmas. Ojo: <b>at night</b>.", k:["in: periodos amplios","on: días y fechas","at: horas y vacaciones","at night"]},
